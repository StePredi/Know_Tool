<title>Matematica per situazioni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Stessi colori, font e forme di «Per situazioni» nell'app: rami a pillola con numero, schede colorate, sfondo a puntini. Qui cambia solo il contenuto: ogni argomento è un blocco di dati con lo stesso modello. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface2: #eceff4; --ink: #121920; --mute: #4c5a69;
  --line: #c6d0db; --line2: #dde3ea; --on: #ffffff; --focus: #1f5fb0;
  --trap: #fff1c7; --trap-k: #6b4a00; --good: #dff3e8; --good-k: #0f5e36;
  --ff: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fm: 'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --surface: #161e27; --surface2: #1e2832; --ink: #e9eef3; --mute: #a9b6c3; --line: #35434f; --line2: #263240; --on: #0d1218; --focus: #7db2f0;
    --trap: #3a2f10; --trap-k: #ffd98a; --good: #15322a; --good-k: #8fe0b6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --surface: #161e27; --surface2: #1e2832; --ink: #e9eef3; --mute: #a9b6c3; --line: #35434f; --line2: #263240; --on: #0d1218; --focus: #7db2f0;
  --trap: #3a2f10; --trap-k: #ffd98a; --good: #15322a; --good-k: #8fe0b6; color-scheme: dark;
}
[data-c=red] { --c: #e5484d; --t: #fde4e3; --k: #9b1c20; --co: #fff; }
[data-c=orange] { --c: #f08c3c; --t: #fdebdc; --k: #8f4510; --co: #fff; }
[data-c=yellow] { --c: #d9a800; --t: #fbf1cc; --k: #6e5500; --co: #2b2100; }
[data-c=green] { --c: #22a565; --t: #d9f3e6; --k: #0f5e36; --co: #fff; }
[data-c=teal] { --c: #0f9e9e; --t: #d3f1f1; --k: #0a5959; --co: #fff; }
[data-c=blue] { --c: #4c6fff; --t: #e1e7ff; --k: #2336a6; --co: #fff; }
[data-c=indigo] { --c: #5b5bd6; --t: #e6e6fb; --k: #33339a; --co: #fff; }
[data-c=violet] { --c: #8e4ec6; --t: #efe3fa; --k: #5a2a86; --co: #fff; }
[data-c=pink] { --c: #d6409f; --t: #fce5f3; --k: #8a1f5e; --co: #fff; }
[data-c=slate] { --c: #5a6b82; --t: #e3e8ef; --k: #2f3b4c; --co: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [data-c] { --t: color-mix(in srgb, var(--c) 24%, #161e27); --k: color-mix(in srgb, var(--c) 45%, #fff); } }
:root[data-theme="dark"] [data-c] { --t: color-mix(in srgb, var(--c) 24%, #161e27); --k: color-mix(in srgb, var(--c) 45%, #fff); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ff); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1560px; margin: 0 auto; display: grid; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.top h1 { margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; }
.bozza { font-size: 12.5px; color: var(--mute); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 12px; background: var(--surface); }
.arg { display: flex; flex-wrap: wrap; gap: 8px; }
.arg button { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 16px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 8px; align-items: baseline; }
.arg button small { font-weight: 400; font-size: 12.5px; color: var(--mute); }
.arg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.arg button[aria-pressed="true"] small { color: inherit; opacity: 0.8; }

.guida { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; font-size: 16px; }
.guida .ing { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cerca { flex: 1 1 220px; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; font: inherit; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 16px; font-weight: 700; font-size: 14px; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 38px; padding: 0 14px; font-weight: 700; font-size: 14px; }

.prova { display: flex; gap: 10px; align-items: center; min-width: 0; }
.prova > b { flex: none; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; min-width: 0; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-family: var(--fm); font-size: 17px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.piano { background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 10px 14px; display: grid; gap: 8px; }
.piano .riga { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.piano .tit { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); width: 100%; }
.piano .ex { font-family: var(--fm); font-size: 21px; }
.piano .fin { font-family: var(--fm); font-size: 21px; background: var(--good); color: var(--good-k); border-radius: 999px; padding: 0 14px; }
.piano .ar { color: var(--mute); }
.step { display: inline-flex; gap: 8px; align-items: center; border: 2px solid var(--c); background: var(--t); color: var(--k); border-radius: 999px; padding: 3px 14px 3px 4px; font-weight: 700; }
.step i { width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: var(--co); display: grid; place-items: center; font-style: normal; font-size: 13px; }
.step[aria-current="true"] { background: var(--c); color: var(--co); }
.step[aria-current="true"] i { background: rgba(255,255,255,0.92); color: #151a2e; }
.piano .nota { font-size: 16px; }

.stage { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1200px) { .stage.apri { grid-template-columns: minmax(0, 1fr) 450px; } }

.vp { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 16px; padding: 16px; cursor: grab; background-color: var(--surface);
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 26px 26px; overscroll-behavior: contain; }
.vp.drag { cursor: grabbing; user-select: none; }
.sizer { position: relative; margin: 0 auto; }
.mappa { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.mappa svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.lk { fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; transition: opacity .2s; }
.lk.thin { stroke-width: 1.8; opacity: .8; }
.lk.dim { opacity: .15; }
.nd { position: absolute; transition: opacity .2s, box-shadow .15s; }
.nd.dim { opacity: 0.2; }
.centro { background: var(--ink); color: var(--surface); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.2; padding: 6px 8px; }
.centro b { font-size: 21px; }
.centro span { font-size: 12.5px; opacity: .8; margin-top: 3px; }
.ramo, .gh { display: flex; align-items: center; gap: 9px; padding: 0 14px 0 7px; background: var(--c); color: var(--co); border: 0; border-radius: 24px; font-weight: 700; font-size: 15.5px; text-align: left; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.ramo span, .gh span { line-height: 1.18; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.ramo i, .gh i { flex: none; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.92); color: #151a2e; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 14px; }
.ramo.chiuso { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 28%, transparent); }
.ramo small { display: block; font-weight: 400; font-size: 11.5px; opacity: .9; }
.sc, .gl { text-align: left; background: var(--t); color: var(--k); border: 0; border-radius: 10px; padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; gap: 3px; overflow: hidden; }
.gl { position: relative; }
.sc:hover, .gl:hover { box-shadow: 0 0 0 2px var(--c); }
.sc.sel, .gl.sel { box-shadow: 0 0 0 3px var(--ink); }
.nm { font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm { align-self: flex-start; max-width: 100%; font-family: var(--fm); font-size: 15.5px; background: var(--surface); color: var(--k); border-radius: 6px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.badge { position: absolute; top: -8px; left: -8px; z-index: 2; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 13px; display: grid; place-items: center; border: 2px solid var(--surface); }
.vpw { position: relative; }
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: 0 8px 24px rgba(10,15,40,.18); z-index: 5; }
.zoom button { border: 0; background: none; height: 34px; padding: 0 12px; font-weight: 700; border-radius: 10px; }

.gg { display: none; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; align-items: start; }
.gc { background: var(--t); border: 2px solid var(--c); border-radius: 18px; padding: 10px 10px 12px; display: grid; gap: 8px; }
.gh { width: 100%; min-height: 44px; padding-block: 4px; }
.gv { display: grid; gap: 6px; }
.gl { background: var(--surface); }
.gl.dim { opacity: .28; }
.gl.hide { display: none; }
.gl .badge { top: 6px; left: auto; right: 8px; }

.vista-griglia .vpw { display: none; }
.vista-griglia .gg { display: grid; }
@media (max-width: 759px) { .vpw { display: none; } .gg { display: grid; } .seg, .only-map, .prova > b { display: none; } .guida { font-size: 15px; } }

.det { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: grid; gap: 14px; align-content: start; padding: 14px 16px 18px; min-width: 0; }
@media (min-width: 1200px) { .det { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; } }
@media (max-width: 1199px) {
  .det { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto; border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.3);
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stage.apri::after { content: ''; position: fixed; inset: 0; background: rgba(8,12,18,.45); z-index: 30; }
}
.det[hidden] { display: none; }
.det .cima { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.det h2 { margin: 6px 0 0; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.tag { display: inline-flex; background: var(--c); color: var(--co); border-radius: 999px; padding: 1px 12px; font-size: 13px; font-weight: 700; }
.x { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; width: 36px; height: 36px; font-size: 18px; flex: none; }
.det h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
.det p, .det ul { margin: 0; }
.det ul { padding-left: 20px; display: grid; gap: 4px; }
.big { font-family: var(--fm); font-size: 23px; line-height: 1.35; padding: 10px 14px; background: var(--t); color: var(--k); border-radius: 12px; overflow-x: auto; display: grid; gap: 4px; }
.big > div { white-space: pre-wrap; }
.es { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: grid; gap: 3px; margin-top: 6px; }
.es .da { font-family: var(--fm); font-size: 19px; }
.es .pa { font-size: 14.5px; color: var(--mute); display: grid; gap: 1px; }
.es .ris { font-family: var(--fm); font-size: 19px; background: var(--good); color: var(--good-k); border-radius: 8px; padding: 0 10px; width: fit-content; max-width: 100%; }
.es .ris::before { content: '= '; }
.err { background: var(--trap); color: var(--trap-k); border-radius: 12px; padding: 8px 12px; }
.err h3 { color: inherit; opacity: .85; }
.conf { display: grid; gap: 6px; }
.conf button { text-align: left; border: 2px solid var(--c); background: var(--t); color: var(--k); border-radius: 12px; padding: 5px 12px; }
.conf button b { font-weight: 700; }
.perche { background: var(--surface2); border-radius: 12px; padding: 8px 12px; }
.vuoto { color: var(--mute); }
.m { font-family: var(--fm); font-size: 1.1em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .12em; line-height: 1.15; }
.fr > .n { border-bottom: 1px solid currentColor; padding: 0 .25em; }
.fr > .d { padding: 0 .25em; }
.rd { border-top: 1px solid currentColor; padding: 0 .08em; }
sup, sub { font-size: .68em; line-height: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="top">
    <h1>Matematica per situazioni</h1>
    <span class="bozza">Demo fuori dall'app · contenuto scritto da Claude, da controllare sul tuo libro</span>
  </div>
  <div class="arg" id="arg" role="tablist" aria-label="Argomento"></div>
  <div class="guida" id="guida"></div>

  <div class="bar">
    <input class="cerca" id="cerca" type="search" placeholder="Cerca: radice, frazione, quanti termini, ordine…" aria-label="Cerca">
    <div class="seg" role="group" aria-label="Disposizione"><button id="v-mappa" aria-pressed="true">Mappa</button><button id="v-griglia" aria-pressed="false">Griglia</button></div>
    <button class="btn only-map" id="tutto">Chiudi rami</button>
  </div>

  <div class="prova"><b>Prova con un esercizio</b><div class="chips" id="chips"></div></div>
  <div id="piano"></div>

  <div class="stage" id="stage">
    <div>
      <div class="vpw" id="vpw"><div class="vp" id="vp"><div class="sizer" id="sizer"><div class="mappa" id="mappa"></div></div></div>
        <div class="zoom only-map" aria-label="Zoom"><button id="z-meno" aria-label="Riduci">−</button><button id="z-fit">Adatta</button><button id="z-piu" aria-label="Ingrandisci">+</button></div></div>
      <div class="gg" id="gg"></div>
    </div>
    <aside class="det" id="det" hidden></aside>
  </div>
</div>

<script>
/* DATI: ogni argomento ha lo stesso modello. Cambiano solo questi dati, non la schermata.
   Formule in testo normale: ^ apice, _ pedice, frac(a|b), sqrt(x), ->, >=, <=, inf, *  ·  Nei testi la formula sta tra apici inversi. */
var DATI = [

/* ===================== DERIVATE ===================== */
{ id: 'derivate', nome: 'Derivate', ingresso: 'Espressione',
  guida: 'Guarda <b>l\'ultima operazione</b> che faresti per calcolare l\'espressione: quella dice quale regola usare.',
  pianoTitolo: 'Piano d\'attacco, da fuori a dentro',
  rami: [
    { id: 'pot', nome: 'Potenze e radici', col: 'green', nodi: ['k', 'pot', 'rad', 'rec'] },
    { id: 'exp', nome: 'Esponenziali e logaritmi', col: 'orange', nodi: ['exp', 'log'] },
    { id: 'gon', nome: 'Goniometriche', col: 'pink', nodi: ['sc', 'tan', 'inv'] },
    { id: 'ope', nome: 'Più pezzi insieme', col: 'blue', nodi: ['som', 'pro', 'quo'] },
    { id: 'com', nome: 'Qualcosa dentro', col: 'violet', nodi: ['cat', 'potf', 'radf', 'expf', 'logf', 'scf', 'piu'] },
    { id: 'spe', nome: 'Casi particolari', col: 'teal', nodi: ['fg', 'semp', 'punto'] }
  ],
  nodi: {
    k: { nome: 'Costante', breve: 'k -> 0', vedo: 'Un numero solo, senza x (anche π, e, √2, ln 2).', formula: "(k)' = 0",
      adatto: ['Anche `pi`, `ln(2)` o `e^2` sono numeri: la derivata è 0.', 'Un numero che moltiplica una funzione non sparisce: vedi «Somma e costante».'],
      esempi: [{ da: '7', ris: '0' }, { da: 'ln(2)', passi: ['È un numero, non dipende da x.'], ris: '0' }],
      errore: 'Derivare `ln(2)` come `1/2`: è un numero, non `ln(x)`.', confondi: [['som', 'k·f non è una costante: la k resta e si deriva f.']],
      perche: 'Una costante non cambia al variare di x: la pendenza è zero.', chiavi: 'numero costante zero' },
    pot: { nome: 'Potenza', breve: 'x^n -> n*x^(n-1)', vedo: 'La x è in basso e l\'esponente è un numero (x², x⁵, x⁻³).', formula: "(x^n)' = n*x^(n-1)",
      adatto: ['Scendi con l\'esponente davanti, poi togli 1 all\'esponente.', 'Un numero davanti resta: `(5x^4)\' = 20x^3`.', 'Esponente negativo: −3 − 1 = −4.'],
      esempi: [{ da: '5x^4', passi: ['L\'esponente 4 scende: `5*4*x^3`'], ris: '20x^3' }, { da: 'frac(1|x^3)', passi: ['Riscrivo: `x^(-3)`', 'Scendo con −3 e tolgo 1: `-3*x^(-4)`'], ris: '-frac(3|x^4)' }],
      errore: 'Dimenticare di togliere 1, o con esponente negativo scrivere `x^(-2)` invece di `x^(-4)`.',
      confondi: [['exp', 'x^n ha la x in basso; a^x ha la x in alto.']],
      perche: 'Se x cresce di poco, x^n cresce n volte x^(n−1) per quel poco: l\'esponente scende e la pendenza si moltiplica.', chiavi: 'potenza esponente x alla' },
    rad: { nome: 'Radice', breve: 'sqrt(x) -> 1/(2*sqrt(x))', vedo: 'Una radice con solo x sotto (√x, ∛x).', formula: "(sqrt(x))' = frac(1|2*sqrt(x))",
      adatto: ['Riscrivi come potenza: `sqrt(x) = x^(1/2)`, e usa la regola della potenza.', 'Radice cubica: `(x^(1/3))\' = frac(1|3*x^(2/3))`.'],
      esempi: [{ da: 'sqrt(x)', passi: ['`x^(1/2)`', 'Scendo con 1/2 e tolgo 1: `(1/2)*x^(-1/2)`'], ris: 'frac(1|2*sqrt(x))' }],
      errore: 'Scrivere `1/sqrt(x)`: manca il 2.', confondi: [['radf', 'Se sotto la radice c\'è più della sola x, serve anche la catena.']],
      perche: 'È la regola della potenza con esponente 1/2.', chiavi: 'radice quadrata cubica' },
    rec: { nome: 'Reciproco', breve: '1/x -> -1/x^2', vedo: '1 fratto x (o numero fratto x, 1/x²).', formula: "(frac(1|x))' = -frac(1|x^2)",
      adatto: ['È `x^(-1)`: scendo con −1.', '`1/x^2 = x^(-2)` → `-2/x^3`.'],
      esempi: [{ da: 'frac(3|x)', passi: ['`3*x^(-1)`', '`3*(-1)*x^(-2)`'], ris: '-frac(3|x^2)' }],
      errore: 'Dimenticare il meno.', confondi: [['log', '1/x è la derivata di ln x; la derivata di 1/x è −1/x².']],
      perche: 'Caso particolare della potenza con n = −1.', chiavi: 'reciproco frazione uno fratto x' },
    exp: { nome: 'Esponenziale', breve: 'e^x -> e^x', vedo: 'La x è in alto (esponente) e la base è un numero: e^x, 2^x.', formula: ["(e^x)' = e^x", "(a^x)' = a^x*ln(a)"],
      adatto: ['Con e la funzione resta uguale.', 'Con un\'altra base a compare `ln(a)`.', 'Se in alto non c\'è solo x, vedi «Esponenziale di g».'],
      esempi: [{ da: '2^x', passi: ['Base 2: compare `ln(2)`'], ris: '2^x*ln(2)' }],
      errore: 'Usare la regola della potenza (`x*a^(x-1)`): qui la x non è la base.', confondi: [['pot', 'La x in alto è l\'esponenziale, la x in basso è la potenza.']],
      perche: 'e è la base per cui la pendenza della curva è uguale all\'altezza.', chiavi: 'esponenziale x in alto e alla x' },
    log: { nome: 'Logaritmo', breve: 'ln(x) -> 1/x', vedo: 'ln x, log x, log in base a.', formula: ["(ln(x))' = frac(1|x)", "(log_a(x))' = frac(1|x*ln(a))"],
      adatto: ['ln è il logaritmo in base e.', 'In base a compare `ln(a)` sotto. Controlla se nel tuo libro «log» senza base vuol dire ln.'],
      esempi: [{ da: '5*ln(x)', passi: ['Il 5 resta'], ris: 'frac(5|x)' }, { da: 'log_2(x)', ris: 'frac(1|x*ln(2))' }],
      errore: 'Confondere 1/x (derivata di ln x) con la derivata di 1/x.', confondi: [['rec', 'La derivata di 1/x è −1/x².'], ['logf', 'Con qualcosa dentro il logaritmo serve g′.']],
      perche: 'Il logaritmo cresce sempre più piano: a x grande la pendenza è piccola, 1/x.', chiavi: 'logaritmo ln log' },
    sc: { nome: 'Seno e coseno', breve: 'sin -> cos, cos -> -sin', vedo: 'sin x o cos x con solo x dentro.', formula: ["(sin x)' = cos x", "(cos x)' = -sin x"],
      adatto: ['Il coseno ha il segno meno.', 'Se dentro c\'è più di x: vedi «Goniometriche di g».'],
      esempi: [{ da: '3*sin x + cos x', passi: ['`(3*sin x)\' = 3*cos x`', '`(cos x)\' = -sin x`'], ris: '3*cos x - sin x' }],
      errore: 'Dimenticare il meno nella derivata del coseno.', confondi: [['scf', 'Con qualcosa di diverso da x dentro, moltiplica per g′.']],
      perche: 'Ciclo da ricordare: sin → cos → −sin → −cos → sin. Dopo quattro derivate torni al punto di partenza.', chiavi: 'seno coseno sin cos goniometrica' },
    tan: { nome: 'Tangente', breve: 'tan x -> 1/cos^2 x', vedo: 'tan x con solo x dentro.', formula: "(tan x)' = frac(1|cos^2 x) = 1 + tan^2 x",
      adatto: ['Le due forme sono uguali: usa quella che semplifica meglio.', 'Con qualcosa dentro: `g\'/cos^2 g`.'],
      esempi: [{ da: '2*tan x', ris: 'frac(2|cos^2 x)' }],
      errore: 'Scrivere `1/cos x`: manca il quadrato.', confondi: [['scf', 'Con qualcosa dentro serve anche g′.']],
      perche: 'Si ricava dal quoziente sin/cos.', chiavi: 'tangente tan' },
    inv: { nome: 'Arcoseno, arcotangente', breve: 'arctan x -> 1/(1+x^2)', vedo: 'arcsin x, arccos x, arctan x.', formula: ["(arcsin x)' = frac(1|sqrt(1-x^2))", "(arctan x)' = frac(1|1+x^2)"],
      adatto: ['arccos x ha lo stesso risultato di arcsin con il segno meno.', 'Con qualcosa dentro moltiplica per g′.'],
      esempi: [{ da: '4*arctan x', ris: 'frac(4|1+x^2)' }],
      errore: 'Pensare che arcsin x sia 1/sin x: è la funzione inversa, non il reciproco.', confondi: [['sc', 'sin x e arcsin x sono funzioni diverse (inverse).']],
      perche: 'Sono le inverse di sin e tan: le loro derivate si ricavano da quelle di sin e tan.', chiavi: 'arcoseno arcotangente inversa arcsin arctan' },
    som: { nome: 'Somma e costante', breve: "(f+g)' = f'+g'", vedo: 'Pezzi separati da + o −; oppure un numero che moltiplica.', formula: ["(f + g)' = f' + g'", "(k*f)' = k*f'"],
      adatto: ['Deriva ogni pezzo da solo e rimetti i segni.', 'Il numero davanti resta: `(3x^2)\' = 3*2x = 6x`.'],
      esempi: [{ da: '3x^2 + 5x - 7', passi: ['`(3x^2)\' = 6x`', '`(5x)\' = 5`', '`(7)\' = 0`'], ris: '6x + 5' }],
      errore: 'Usare questa regola su un prodotto o una frazione: quelli non si derivano pezzo per pezzo.', confondi: [['pro', 'Se i pezzi si moltiplicano, serve la regola del prodotto.']],
      perche: 'La pendenza di una somma è la somma delle pendenze.', chiavi: 'somma differenza più meno numero davanti' },
    pro: { nome: 'Prodotto', breve: "f'g + fg'", vedo: 'Due pezzi con la x che si moltiplicano: `x^2*sin x`, `e^x*ln(x)`.', formula: "(f*g)' = f'*g + f*g'",
      adatto: ['Deriva il primo lasciando il secondo, più il primo per il secondo derivato.', 'Un numero che moltiplica non è un fattore: usa «Somma e costante».', 'Alla fine raccogli per semplificare.'],
      esempi: [{ da: 'x^2*sin x', passi: ["`f = x^2`, `f' = 2x`", "`g = sin x`, `g' = cos x`", "`f'g + fg'`"], ris: '2x*sin x + x^2*cos x' }],
      errore: "Derivare i due fattori e moltiplicare `f'*g'`: è sbagliato.", confondi: [['som', 'Con il + si deriva pezzo per pezzo; con il × serve questa regola.']],
      perche: 'Pensa all\'area di un rettangolo f per g: se cambiano entrambi i lati, l\'area cambia per due strisce.', chiavi: 'prodotto per moltiplicazione' },
    quo: { nome: 'Quoziente', breve: "(f'g - fg')/g^2", vedo: 'Una frazione con la x sia sopra sia sotto.', formula: "(frac(f|g))' = frac(f'*g - f*g'|g^2)",
      adatto: ['Sopra: derivata del sopra per il sotto, MENO il sopra per la derivata del sotto.', 'Sotto: tutto il denominatore al quadrato.', 'Se sotto c\'è solo un numero, è una costante: non serve.', 'Se sopra c\'è solo un numero, prova «Reciproco» o riscrivi come potenza.'],
      esempi: [{ da: 'frac(x^2|x+1)', passi: ["`f = x^2`, `f' = 2x`", "`g = x+1`, `g' = 1`", 'Sopra: `2x(x+1) - x^2*1 = x^2+2x`'], ris: 'frac(x^2+2x|(x+1)^2)' }],
      errore: 'Scambiare l\'ordine sopra (cambia il segno) o dimenticare il quadrato sotto.', confondi: [['pro', 'Il quoziente ha un meno nel numeratore e un quadrato sotto.']],
      perche: 'Si ricava dal prodotto f · (1/g) usando la catena sul reciproco.', chiavi: 'quoziente frazione divisione fratto' },
    cat: { nome: 'Funzione composta', breve: "f'(g)*g'", vedo: 'Una funzione con dentro qualcosa di più di x: sin(3x²), ln(x+1).', formula: "[f(g(x))]' = f'(g(x))*g'(x)",
      adatto: ['Deriva la funzione «fuori» lasciando il «dentro» com\'è.', 'Moltiplica per la derivata del «dentro».', 'Le schede qui sotto sono casi già pronti di questa regola.'],
      esempi: [{ da: 'sin(3x^2)', passi: ['Fuori: sin → `cos(3x^2)`', "Dentro: `(3x^2)' = 6x`"], ris: '6x*cos(3x^2)' }],
      errore: 'Dimenticare di moltiplicare per la derivata del dentro.', confondi: [['pro', 'Composta: una funzione dentro l\'altra. Prodotto: due funzioni moltiplicate.']],
      perche: 'Due ingranaggi collegati: la velocità finale è il prodotto delle due velocità.', chiavi: 'composta catena dentro fuori' },
    potf: { nome: 'Potenza di g', breve: "n*g^(n-1)*g'", vedo: 'Una parentesi elevata a un numero: (x²+1)⁵.', formula: "(g^n)' = n*g^(n-1)*g'",
      adatto: ['Scendi con l\'esponente, togli 1 e lascia la parentesi.', 'Poi moltiplica per la derivata della parentesi.'],
      esempi: [{ da: '(x^2+1)^5', passi: ['`5*(x^2+1)^4`', 'Derivata della parentesi: `2x`'], ris: '10x*(x^2+1)^4' }],
      errore: 'Derivare solo la parentesi o solo l\'esponente.', confondi: [['pot', 'Se dentro c\'è solo x, è la potenza semplice.']],
      perche: 'Caso di catena: fuori «elevato a n», dentro g.', chiavi: 'parentesi elevata potenza di funzione' },
    radf: { nome: 'Radice di g', breve: "g'/(2*sqrt(g))", vedo: 'Una radice con dentro più di x: √(x²+1).', formula: "(sqrt(g))' = frac(g'|2*sqrt(g))",
      adatto: ['Sopra: derivata di quello che c\'è sotto la radice.', 'Sotto: 2 per la radice stessa.'],
      esempi: [{ da: 'sqrt(x^2+1)', passi: ["`g = x^2+1`, `g' = 2x`"], ris: 'frac(2x|2*sqrt(x^2+1)) = frac(x|sqrt(x^2+1))' }],
      errore: 'Dimenticare g′ al numeratore.', confondi: [['rad', 'Con la sola x sotto, il numeratore è 1.']],
      perche: 'Catena su x^(1/2).', chiavi: 'radice di funzione sotto radice' },
    expf: { nome: 'Esponenziale di g', breve: "e^g -> e^g*g'", vedo: 'Esponenziale con in alto più della sola x: e^(x²), 3^(2x).', formula: ["(e^g)' = e^g*g'", "(a^g)' = a^g*ln(a)*g'"],
      adatto: ['Riscrivi la stessa funzione e moltiplica per la derivata dell\'esponente.', 'Con base diversa da e aggiungi `ln(a)`.'],
      esempi: [{ da: 'e^(x^2)', passi: ['Esponente `x^2`, derivata `2x`'], ris: '2x*e^(x^2)' }, { da: '3^(2x)', passi: ['`ln(3)` e derivata di `2x` = 2'], ris: '2*ln(3)*3^(2x)' }],
      errore: 'Scrivere `e^(2x)` → `e^(2x)`: manca il 2 davanti.', confondi: [['exp', 'Con solo x in alto, nessun fattore extra.']],
      perche: 'Catena sull\'esponenziale.', chiavi: 'esponenziale di funzione e alla' },
    logf: { nome: 'Logaritmo di g', breve: "ln(g) -> g'/g", vedo: 'ln con dentro più della sola x: ln(x²+1).', formula: "(ln(g))' = frac(g'|g)",
      adatto: ['Risultato sempre una frazione: derivata del dentro, fratto il dentro.', 'Se dentro c\'è un prodotto o una potenza, prima usa le proprietà: `ln(x^2) = 2*ln(x)`.'],
      esempi: [{ da: 'ln(x^2+1)', passi: ["Dentro `g = x^2+1`, `g' = 2x`"], ris: 'frac(2x|x^2+1)' }],
      errore: 'Scrivere solo 1/g senza g′.', confondi: [['log', 'Con la sola x dentro, g′ = 1 e resta 1/x.']],
      perche: 'Catena su ln.', chiavi: 'logaritmo di funzione ln di' },
    scf: { nome: 'Goniometriche di g', breve: "sin(g) -> cos(g)*g'", vedo: 'Goniometrica con dentro più della sola x: cos(5x), sin(x²).', formula: ["(sin g)' = cos g*g'", "(cos g)' = -sin g*g'", "(tan g)' = frac(g'|cos^2 g)"],
      adatto: ['Deriva la goniometrica lasciando il dentro uguale.', 'Poi moltiplica per g′.'],
      esempi: [{ da: 'cos(5x)', passi: ['`-sin(5x)`', "`g' = 5`"], ris: '-5*sin(5x)' }],
      errore: 'Dimenticare il meno nel coseno o il g′.', confondi: [['sc', 'Con la sola x dentro, g′ = 1.']],
      perche: 'Catena su sin, cos, tan.', chiavi: 'seno coseno di funzione sin cos tan composta' },
    piu: { nome: 'Più strati', breve: 'dal fuori al dentro', vedo: 'Una funzione dentro una funzione dentro un\'altra: ln(sin 3x), sin²x.', formula: "[f(g(h))]' = f'(g(h))*g'(h)*h'",
      adatto: ['Elenca gli strati dal più esterno: ln( sin( 3x ) ).', 'Deriva uno strato per volta e moltiplica i pezzi.', '`sin^2 x` vuol dire `(sin x)^2`: parentesi elevata a un numero.'],
      esempi: [{ da: 'ln(sin(3x))', passi: ['Strato 1, ln: `1/sin(3x)`', 'Strato 2, sin: `cos(3x)`', 'Strato 3: `3`'], ris: 'frac(3*cos(3x)|sin(3x))' }, { da: 'sin^2 x', passi: ['`(sin x)^2`', '`2*sin x*cos x`'], ris: '2*sin x*cos x' }],
      errore: 'Fermarsi al primo strato.', confondi: [['cat', 'È la stessa regola ripetuta più volte.']],
      perche: 'Con tre ingranaggi collegati le velocità si moltiplicano tutte.', chiavi: 'più strati composte multiple' },
    fg: { nome: 'Funzione alla funzione', breve: 'f^g -> e^(g*ln f)', vedo: 'La x è sia nella base sia nell\'esponente: x^x, (sin x)^x.', formula: "(f^g)' = f^g*(g'*ln(f) + g*frac(f'|f))",
      adatto: ['Il modo più sicuro: riscrivi `f^g = e^(g*ln(f))` e deriva come composta.', 'Non vale né la regola della potenza né quella dell\'esponenziale.'],
      esempi: [{ da: 'x^x', passi: ['`x^x = e^(x*ln(x))`', "Esponente: `(x*ln(x))' = ln(x) + 1`"], ris: 'x^x*(ln(x) + 1)' }],
      errore: 'Usare la regola della potenza: la x è anche in alto.', confondi: [['exp', 'Nell\'esponenziale la base è un numero.']],
      perche: 'Ogni numero positivo può scriversi come potenza di e: `a^b = e^(b*ln(a))`.', chiavi: 'x alla x variabile in alto e in basso' },
    semp: { nome: 'Semplifica prima', breve: 'riscrivi, poi deriva', vedo: 'Frazioni, radici o logaritmi che si possono riscrivere più corti.', formula: 'frac(x^3+x|x) = x^2 + 1',
      adatto: ['`ln(x^2) = 2*ln(x)`, `ln(a*b) = ln(a) + ln(b)`.', 'Se sotto c\'è un solo termine, spezza la frazione.', '`1/x^3 = x^(-3)`, `x*sqrt(x) = x^(3/2)`.'],
      esempi: [{ da: 'frac(x^3+x|x)', passi: ['Semplifico: `x^2 + 1` (per x ≠ 0)'], ris: '2x' }],
      errore: 'Usare il quoziente quando la frazione si poteva semplificare: funziona, ma i conti sono lunghi.', confondi: [['quo', 'Se non si semplifica, serve il quoziente.']],
      perche: 'Meno passaggi, meno errori.', chiavi: 'semplifica riscrivi prima proprietà' },
    punto: { nome: 'Derivata in un punto', breve: "f'(a)", vedo: '«Calcola la pendenza in x = a», «retta tangente», «derivata in…».', formula: "y - f(a) = f'(a)*(x - a)",
      adatto: ['Prima trova `f\'(x)` con la regola giusta, poi sostituisci x = a.', 'La retta tangente usa il valore `f(a)` e la pendenza `f\'(a)`.'],
      esempi: [{ da: 'f(x) = x^3, in x = 2', passi: ["`f'(x) = 3x^2`", "`f'(2) = 12`", '`f(2) = 8`'], ris: 'y = 12x - 16' }],
      errore: 'Sostituire x = 2 prima di derivare: la derivata di un numero è 0.', confondi: [['k', 'Una costante ha derivata 0, ma f(a) è solo un numero da usare nella retta.']],
      perche: 'La derivata in un punto è la pendenza della tangente lì.', chiavi: 'punto tangente retta pendenza' }
  },
  esercizi: [
    { f: '3x^2 + 5x - 7', ris: '6x + 5', piano: [['som', 'Ultima operazione: somma e differenza.'], ['pot', 'Pezzi `3x^2` e `5x`.'], ['k', 'Il `-7` sparisce.']] },
    { f: 'x^2*sin x', ris: '2x*sin x + x^2*cos x', piano: [['pro', 'Ultima operazione: due fattori che si moltiplicano.'], ['pot', 'Primo fattore `x^2`.'], ['sc', 'Secondo fattore `sin x`.']] },
    { f: 'frac(x^2|x+1)', ris: 'frac(x^2+2x|(x+1)^2)', piano: [['quo', 'Ultima operazione: frazione con x sopra e sotto.'], ['pot', 'Derivata del sopra: `x^2`.'], ['som', 'Derivata del sotto: `x+1`.']] },
    { f: 'sin(3x^2)', ris: '6x*cos(3x^2)', piano: [['scf', 'Fuori c\'è sin, dentro `3x^2`.'], ['pot', 'Derivata del dentro: `(3x^2)\'`.']] },
    { f: 'ln(x^2+1)', ris: 'frac(2x|x^2+1)', piano: [['logf', 'Fuori c\'è ln, dentro `x^2+1`.'], ['som', 'Derivata del dentro, a pezzi.'], ['pot', 'Il pezzo `x^2`.']] },
    { f: 'e^(x^2)*cos x', ris: 'e^(x^2)*(2x*cos x - sin x)', piano: [['pro', 'Ultima operazione: due fattori.'], ['expf', 'Primo fattore: e con `x^2` in alto.'], ['pot', 'Derivata dell\'esponente `x^2`.'], ['sc', 'Secondo fattore `cos x`.']] },
    { f: 'sqrt(x^2+1)', ris: 'frac(x|sqrt(x^2+1))', piano: [['radf', 'Fuori c\'è la radice, dentro `x^2+1`.'], ['som', 'Derivata del dentro.'], ['pot', 'Il pezzo `x^2`.']] },
    { f: '(x^2+1)^5', ris: '10x*(x^2+1)^4', piano: [['potf', 'Una parentesi elevata a 5.'], ['som', 'Derivata della parentesi.'], ['pot', 'Il pezzo `x^2`.']] },
    { f: 'x^x', ris: 'x^x*(ln(x) + 1)', piano: [['fg', 'La x è nella base e nell\'esponente.'], ['log', 'Compare `ln(x)`.'], ['pro', 'Derivata di `x*ln(x)`.']] },
    { f: 'ln(sin(3x))', ris: 'frac(3*cos(3x)|sin(3x))', piano: [['piu', 'Tre strati: ln, sin, 3x.'], ['logf', 'Strato 1: ln.'], ['scf', 'Strato 2: sin.'], ['som', 'Strato 3: `3x`.']] }
  ]
},

/* ===================== LIMITI ===================== */
{ id: 'limiti', nome: 'Limiti', ingresso: 'Cosa esce',
  guida: '<b>Sostituisci</b> il valore a cui tende x: quello che esce (un numero, k/0, una forma indeterminata) dice cosa fare.',
  pianoTitolo: 'Cosa esce, cosa faccio',
  rami: [
    { id: 'sub', nome: 'Esce subito il risultato', col: 'green', nodi: ['num', 'kinf', 'k0', 'inf'] },
    { id: 'z0', nome: 'Forma 0/0', col: 'blue', nodi: ['poli', 'radici', 'notev', 'hop'] },
    { id: 'ii', nome: 'Forma ∞/∞', col: 'violet', nodi: ['gradi', 'ordini'] },
    { id: 'id', nome: 'Forma ∞ − ∞', col: 'orange', nodi: ['dpoli', 'drad', 'dfr'] },
    { id: 'alt', nome: 'Forme 0·∞ e 1^∞', col: 'pink', nodi: ['zi', 'uno'] }
  ],
  nodi: {
    num: { nome: 'Esce un numero', breve: 'lim = f(c)', vedo: 'Sostituisci x con il valore a cui tende e ottieni un numero (la funzione è continua lì).', formula: 'lim_(x->c) f(x) = f(c)',
      adatto: ['Vale per polinomi, radici, esponenziali, logaritmi e goniometriche dove sono definiti.', 'Controlla che c sia nel dominio: `ln(0)` o `1/0` non sono numeri.'],
      esempi: [{ da: 'lim_(x->2) (x^2+1)', passi: ['Sostituisco: `2^2 + 1`'], ris: '5' }],
      errore: 'Sostituire senza controllare il dominio.', confondi: [['k0', 'Se esce k/0 non è un numero: guarda i segni dai due lati.']], perche: 'Dove la funzione è continua il limite coincide con il valore.', chiavi: 'sostituzione continua numero' },
    kinf: { nome: 'Numero diviso infinito', breve: 'k/inf -> 0', vedo: 'Un numero diviso un infinito, per esempio `5/x` con x → ∞.', formula: 'frac(k|inf) = 0',
      adatto: ['Vale anche con −∞.', 'Con x → ∞: `1/x`, `1/x^2`, `1/sqrt(x)` tendono tutti a 0.'],
      esempi: [{ da: 'lim_(x->+inf) frac(5|x)', ris: '0' }],
      errore: 'Dire che fa ∞: più il denominatore cresce, più la frazione si rimpicciolisce.', confondi: [['k0', 'Con il denominatore che va a 0, la frazione esplode.']], perche: 'Dividere per un numero enorme dà un risultato piccolissimo.', chiavi: 'costante fratto infinito zero' },
    k0: { nome: 'Numero diviso zero', breve: 'k/0 -> ±inf', vedo: 'Sostituendo esce k/0 con k ≠ 0.', formula: ['frac(k|0^+) = +inf   (k > 0)', 'frac(k|0^-) = -inf   (k > 0)'],
      adatto: ['Calcola il limite da sinistra (`x->c^-`) e da destra (`x->c^+`) separatamente.', 'Se i due segni sono diversi il limite non esiste, ma c\'è un asintoto verticale.', 'Con `x^2` sotto il segno è sempre +: lo zero è sempre da destra.'],
      esempi: [{ da: 'lim_(x->0) frac(1|x^2)', passi: ['Sotto `x^2` è sempre positivo'], ris: '+inf' }, { da: 'lim_(x->0) frac(1|x)', passi: ['Da destra: `+inf`', 'Da sinistra: `-inf`'], ris: 'non esiste' }],
      errore: 'Scrivere 1/0 = 0, o dire «non esiste» senza guardare i lati.', confondi: [['kinf', 'Qui il denominatore va a zero: la frazione cresce.']], perche: 'Dividere per un numero piccolissimo dà un numero enorme.', chiavi: 'divisione per zero asintoto verticale' },
    inf: { nome: 'Infiniti che non litigano', breve: 'inf + inf = inf', vedo: 'Escono più infiniti combinati con + o ×, senza «∞ − ∞».', formula: ['+inf + inf = +inf', 'inf * inf = inf  (segno: prodotto dei segni)'],
      adatto: ['`k + inf = inf` e `k*inf = ±inf` se k ≠ 0.', 'Attenzione: `inf - inf` e `0*inf` sono forme indeterminate.'],
      esempi: [{ da: 'lim_(x->+inf) (x^2 + 3x)', ris: '+inf' }],
      errore: 'Dire che ∞ − ∞ = 0.', confondi: [['dpoli', 'Con ∞ − ∞ serve un\'altra tecnica.']], perche: 'Sommando infiniti dello stesso segno non si perde nulla.', chiavi: 'infinito somma prodotto' },
    poli: { nome: '0/0 con polinomi', breve: 'scomponi e semplifica', vedo: 'Frazione di polinomi: sostituendo esce 0/0, cioè c è radice di sopra e di sotto.', formula: 'frac((x-c)*A(x)|(x-c)*B(x)) = frac(A(x)|B(x))',
      adatto: ['Scomponi numeratore e denominatore (Ruffini): compare `(x-c)` in entrambi.', 'Semplifica `(x-c)` e sostituisci di nuovo.'],
      esempi: [{ da: 'lim_(x->2) frac(x^2-4|x-2)', passi: ['Sostituendo: 0/0', '`x^2-4 = (x-2)(x+2)`', 'Semplifico `(x-2)`: resta `x+2`'], ris: '4' }],
      errore: 'Sostituire di nuovo senza aver tolto il fattore comune.', confondi: [['radici', 'Con le radici serve la coniugata, non la scomposizione.']], perche: 'Il fattore (x − c) è quello che fa 0: toglierlo elimina il problema.', chiavi: 'polinomi frazione zero su zero scomposizione' },

<script>
(function () {
  var fr = function (n, d) { return '<span class="fr"><span class="n">' + n + '</span><span class="d">' + d + '</span></span>'; };

  var esc = function (t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  function close(s, i) { var d = 0; for (var j = i; j < s.length; j++) { if (s[j] === '(') d++; else if (s[j] === ')') { d--; if (d === 0) return j; } } return s.length - 1; }
  function splitTop(s, ch) { var d = 0; for (var i = 0; i < s.length; i++) { var c = s[i]; if (c === '(') d++; else if (c === ')') d--; else if (c === ch && d === 0) return [s.slice(0, i), s.slice(i + 1)]; } return [s, '']; }

        else { var m = /^([+−]?(\d+|[A-Za-z])|[+−])/.exec(rest); if (m) { inner = m[0]; len = m[0].length; } else { o += esc(c); i++; continue; } }
        o += '<' + tag + '>' + parse(inner) + '</' + tag + '>'; i += 1 + len; continue;
      }

  }
  function F(s) {

  var plain = function (h) { return h.replace(/<[^>]+>/g, ' ').toLowerCase(); };

    var t = A().nodi[id]._s;

  }

  var LW = 228, LH = 62, PITCH = 70, BW = 200, BH = 52, CW = 136, CH = 70, GAP = 38, GRP = 30;

  }

        if (!cl) r.nodi.forEach(function (id, j) {
          var ly = c.y + j * PITCH, lx = s === 'L' ? X.lf : X.rf, fx1 = s === 'L' ? bx : bx + BW, fx2 = s === 'L' ? lx + LW : lx, n = a.nodi[id];
          paths += '<path class="lk thin' + (acceso(id) ? '' : ' dim') + '" data-c="' + r.col + '" d="M' + fx1 + ' ' + ym + ' C' + (fx1 + fx2) / 2 + ' ' + ym + ' ' + (fx1 + fx2) / 2 + ' ' + (ly + LH / 2) + ' ' + fx2 + ' ' + (ly + LH / 2) + '"/>';

  }
  function fit() {
    var vp = el('vp'), sz = el('sizer'), m = el('mappa'); if (!m.style.height) return;
    var avail = Math.max(vp.clientWidth - 32, 200), base = Math.min(1, avail / W), k = base * S.z, hh = parseFloat(m.style.height);
    m.style.transform = 'scale(' + k + ')'; sz.style.width = (W * k) + 'px'; sz.style.height = (hh * k) + 'px';
  }

  function renderGriglia() {
    var a = A(), bm = badgeMap(), h = '';
    a.rami.forEach(function (r, ri) {
      var cl = S.chiusi[a.id + r.id];
      h += '<section class="gc" data-c="' + r.col + '"><button class="gh" data-ramo="' + r.id + '" aria-expanded="' + (!cl) + '"><i>' + (ri + 1) + '</i><span>' + esc(r.nome) + '</span></button>';
      if (!cl) {
        h += '<div class="gv">';
        r.nodi.forEach(function (id) {
          var n = a.nodi[id], vis = acceso(id);
          h += '<button class="gl' + (S.sel === id ? ' sel' : '') + (vis ? '' : (S.ex !== null ? ' dim' : ' hide')) + '" data-c="' + r.col + '" data-id="' + id + '"><span class="nm">' + esc(n.nome) + '</span><span class="fm">' + F(n.breve) + '</span>' + (bm[id] ? '<span class="badge">' + bm[id] + '</span>' : '') + '</button>';
        });
        h += '</div>';
      }
      h += '</section>';
    });
    el('gg').innerHTML = h;
  }

  function dettaglio(id) {
    var a = A(), n = a.nodi[id], r = a.ramoDi[id];
    var h = '<div class="cima"><div data-c="' + r.col + '"><span class="tag">' + esc(r.nome) + '</span><h2>' + esc(n.nome) + '</h2></div><button class="x" data-chiudi="1" aria-label="Chiudi">✕</button></div>';
    h += '<div><h3>Come lo riconosci</h3><p>' + T(n.vedo) + '</p></div>';
    var fl = Array.isArray(n.formula) ? n.formula : [n.formula];
    h += '<div data-c="' + r.col + '"><h3>Formula</h3><div class="big">' + fl.map(function (x) { return '<div>' + F(x) + '</div>'; }).join('') + '</div></div>';
    h += '<div><h3>Come la adatto</h3><ul>' + n.adatto.map(function (x) { return '<li>' + T(x) + '</li>'; }).join('') + '</ul></div>';
    h += '<div><h3>Esempio svolto</h3>' + n.esempi.map(function (e) {
      return '<div class="es"><div class="da">' + F(e.da) + '</div>' + (e.passi && e.passi.length ? '<div class="pa">' + e.passi.map(function (p) { return '<span>' + T(p) + '</span>'; }).join('') + '</div>' : '') + '<div class="ris">' + F(e.ris) + '</div></div>';
    }).join('') + '</div>';
    if (n.errore) h += '<div class="err"><h3>Errore tipico</h3><p>' + T(n.errore) + '</p></div>';
    if (n.confondi && n.confondi.length) h += '<div><h3>Da non confondere con</h3><div class="conf">' + n.confondi.map(function (c) {
      var rr = a.ramoDi[c[0]]; return '<button data-c="' + rr.col + '" data-id="' + c[0] + '"><b>' + esc(a.nodi[c[0]].nome) + '</b> · ' + T(c[1]) + '</button>';
    }).join('') + '</div></div>';
    if (n.perche) h += '<div class="perche"><h3>Perché funziona</h3><p>' + T(n.perche) + '</p></div>';
    return h;
  }

  function renderPiano() {
    var box = el('piano');
    if (S.ex === null) { box.innerHTML = ''; return; }
    var a = A(), e = a.esercizi[S.ex], h = '<div class="piano"><div class="tit">' + esc(a.pianoTitolo) + '</div><div class="riga"><span class="ex">' + F(e.f) + '</span><span class="ar">→</span>';
    e.piano.forEach(function (p, i) {
      var r = a.ramoDi[p[0]];
      h += '<button class="step" data-c="' + r.col + '" data-step="' + i + '"' + (S.step === i ? ' aria-current="true"' : '') + '><i>' + (i + 1) + '</i>' + esc(a.nodi[p[0]].nome) + '</button>' + (i < e.piano.length - 1 ? '<span class="ar">→</span>' : '');
    });
    h += '<span class="ar">=</span><span class="fin">' + F(e.ris) + '</span></div><div class="nota">' + T(e.piano[S.step][1]) + '</div></div>';
    box.innerHTML = h;
  }

  function render() {
    var a = A();
    document.body.classList.toggle('vista-griglia', S.vista === 'griglia');
    el('v-mappa').setAttribute('aria-pressed', S.vista === 'mappa'); el('v-griglia').setAttribute('aria-pressed', S.vista === 'griglia');
    var any = a.rami.some(function (r) { return S.chiusi[a.id + r.id]; });
    el('tutto').textContent = any ? 'Apri rami' : 'Chiudi rami';
    el('arg').innerHTML = DATI.map(function (d, i) { return '<button role="tab" data-arg="' + i + '" aria-pressed="' + (i === S.a) + '">' + esc(d.nome) + '<small>' + esc(d.ingresso) + '</small></button>'; }).join('');
    el('guida').innerHTML = '<span class="ing">' + esc(a.ingresso) + '</span><span>' + a.guida + '</span>';
    el('chips').innerHTML = a.esercizi.map(function (e, i) { return '<button class="chip" data-ex="' + i + '" aria-pressed="' + (S.ex === i) + '">' + F(e.f) + '</button>'; }).join('');
    renderPiano(); renderMappa(); renderGriglia();
    var d = el('det'), apri = !!S.sel;
    d.hidden = !apri; el('stage').classList.toggle('apri', apri);
    if (apri) d.innerHTML = dettaglio(S.sel);
    fit();
  }

  function scegli(id) {
    S.sel = id;
    if (S.ex !== null) { var i = A().esercizi[S.ex].piano.findIndex(function (p) { return p[0] === id; }); if (i >= 0) S.step = i; }
    var r = A().ramoDi[id]; S.chiusi[A().id + r.id] = false;
    render();
    var d = el('det'); if (d) d.scrollTop = 0;
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    var D = t.dataset;
    if (D.id) scegli(D.id);
    else if (D.chiudi) { S.sel = null; render(); }
    else if (D.ramo) { var k = A().id + D.ramo; S.chiusi[k] = !S.chiusi[k]; render(); }
    else if (D.arg !== undefined) { S.a = +D.arg; S.sel = null; S.ex = null; S.step = 0; S.z = 1; render(); }
    else if (D.ex !== undefined) {
      var i = +D.ex;
      if (S.ex === i) { S.ex = null; S.sel = null; } else { S.ex = i; S.step = 0; S.sel = A().esercizi[i].piano[0][0]; A().rami.forEach(function (r) { S.chiusi[A().id + r.id] = false; }); }
      render();
    }
    else if (D.step !== undefined) { S.step = +D.step; S.sel = A().esercizi[S.ex].piano[S.step][0]; render(); }
    else if (t.id === 'v-mappa') { S.vista = 'mappa'; render(); }
    else if (t.id === 'v-griglia') { S.vista = 'griglia'; render(); }
    else if (t.id === 'tutto') { var a = A(), any = a.rami.some(function (r) { return S.chiusi[a.id + r.id]; }); a.rami.forEach(function (r) { S.chiusi[a.id + r.id] = !any; }); render(); }
    else if (t.id === 'z-piu') { S.z = Math.min(1.8, S.z + 0.2); fit(); }
    else if (t.id === 'z-meno') { S.z = Math.max(0.5, S.z - 0.2); fit(); }
    else if (t.id === 'z-fit') { S.z = 1; fit(); }
  });
  el('cerca').addEventListener('input', function (ev) { S.q = ev.target.value.trim(); if (S.q) S.ex = null; render(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.sel) { S.sel = null; render(); } });

  var vp = el('vp'), drag = null;
  vp.addEventListener('pointerdown', function (e) { if (e.target.closest('button')) return; drag = { x: e.clientX, y: e.clientY, l: vp.scrollLeft, t: vp.scrollTop }; vp.classList.add('drag'); });
  window.addEventListener('pointermove', function (e) { if (!drag) return; vp.scrollLeft = drag.l - (e.clientX - drag.x); vp.scrollTop = drag.t - (e.clientY - drag.y); });
  window.addEventListener('pointerup', function () { drag = null; vp.classList.remove('drag'); });
  window.addEventListener('resize', fit);
  render();
})();
</script>
