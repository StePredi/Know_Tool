   if(c==='·'){var nx=s[i+1];o+=(isL(last)&&/[A-Za-z(′]/.test(nx||'')&&!/[0-9]/.test(last))?'<span class="th"></span>':'<span class="op dot">·</span>';i++;last='·';continue}
   if(c===' '){o+=' ';i++;continue}
   o+=esc(c);last=c;i++}return o}
 function F(s){s=String(s).replace(/->/g,'→').replace(/>=/g,'≥').replace(/<=/g,'≤').replace(/!=/g,'≠').replace(/\+-/g,'±').replace(/\binf\b/g,'∞').replace(/\bpi\b/g,'π').replace(/\*/g,'·').replace(/-/g,'−').replace(/'/g,'′');return parse(s)}
 function T(s){return String(s).replace(/`([^`]+)`/g,function(m,a){return '<span class="m">'+F(a)+'</span>'})}
 var w=document.getElementById('w');document.getElementById('tt').textContent='Formulario · '+D.titolo;document.getElementById('gd').textContent=D.guida;
 D.rami.forEach(function(r,ri){var sec=document.createElement('section');sec.className='ramo';sec.setAttribute('data-c',r.c);
  var h='<h2><i>'+(ri+1)+'</i>'+esc(r.n)+'</h2>';
  r.s.forEach(function(id){var s=D.sc[id];var t=(s.n+' '+s.v+' '+s.f.join(' ')+' '+s.c).toLowerCase().replace(/[`^_*]/g,' ');
   h+='<button class="r" data-t="'+esc(t)+'"><span class="n">'+esc(s.n)+'</span><span class="f">'+s.f.map(F).join('<br>')+'</span><span class="v">'+T(s.v)+'</span><span class="more">'+(s.a.length?'<ul>'+s.a.map(function(a){return '<li>'+T(a)+'</li>'}).join('')+'</ul>':'')+(s.x.length?'<div class="ex">Es. '+F(s.x[0].da)+' → '+F(s.x[0].ris)+'</div>':'')+(s.e?'<div class="t">Errore: '+T(s.e)+'</div>':'')+'</span></button>'});
  sec.innerHTML=h;w.appendChild(sec)});
 w.addEventListener('click',function(e){var b=e.target.closest('.r');if(b)b.classList.toggle('open')});
 function filtra(){var q=document.getElementById('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  document.querySelectorAll('.r').forEach(function(b){var ok=q.every(function(x){return b.getAttribute('data-t').indexOf(x)>=0});b.classList.toggle('dim',!ok)});
  document.querySelectorAll('.ramo').forEach(function(s){s.classList.toggle('dim',!s.querySelector('.r:not(.dim)'))})}
 document.getElementById('q').addEventListener('input',filtra);
 function modo(m){w.className='wrap'+(m?' ric':'');document.getElementById('b1').setAttribute('aria-pressed',!m);document.getElementById('b2').setAttribute('aria-pressed',m)}
 document.getElementById('b1').onclick=function(){modo(false)};document.getElementById('b2').onclick=function(){modo(true)};
 document.getElementById('st').onclick=function(){window.print()};
})();
