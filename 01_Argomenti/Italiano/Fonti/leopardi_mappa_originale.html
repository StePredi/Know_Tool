 ["Vita","Quale formazione culturale predispose il padre per Leopardi?","Non è nelle tue pagine (conoscenza generale): una formazione tradizionale, religiosa e classica, nell'ambiente conservatore della casa paterna. Precettori ecclesiastici e poi la ricca biblioteca del padre, dove Leopardi studia da solo.",["fam","formaz","padre"]],
 ["Vita","Quali stati d'animo spinsero Leopardi a dedicarsi alla poesia?","Infelicità e insoddisfazione, insieme al bisogno di realizzare qualcosa di grande e di assoluto: portarono alla conversione «dall'erudizione al bello», dallo studio passivo alla poesia.",["conv1"]],
 ["Vita","Quale evento determinò l'allontanamento dagli ideali conservatori e l'avvicinamento al patriottismo liberale e laico?","Il rapporto (dal 1817) con Pietro Giordani, intellettuale classicista contrario alla Restaurazione, suo primo amico e sostenitore culturale.",["gior"]],
 ["Vita","Quali implicazioni ideologiche comportò la «conversione alla filosofia»?","Definitivo distacco dalla religione, adesione alla filosofia sensistica e materialistica ed elaborazione di un pensiero fortemente pessimistico.",["convfil"]],
 ["Vita","Elenca le tappe dei viaggi di Leopardi e le loro peculiarità.","Roma (1822-23, delusione), ritorno a Recanati, Milano (1825, Stella), Bologna (Petrarca, Malvezzi), Firenze (Antologia, Ranieri), Pisa (clima e ispirazione), ultimo ritorno a Recanati, Firenze dal 1830, Napoli dal 1833. Sono viaggi alla ricerca di autonomia, lavoro, clima più mite, con ritorni a Recanati.",["roma","mil","bol","fir1","pisa","fir2","nap"]],
 ["Vita","Quali poesie sono il testamento spirituale? Dove furono composte?","Il tramonto della luna e La ginestra, a Villa Ferrigni, fra Torre del Greco e Torre Annunziata, ai piedi del Vesuvio (1836-37).",["ginestra","tramonto","ferr"]],
 ["Zibaldone","Perché lo Zibaldone è uno strumento indispensabile per capire la produzione leopardiana?","Perché testimonia il percorso intellettuale e spirituale del poeta: contiene i principi fondamentali della sua poetica, i temi filosofici delle Operette e l'approfondimento del pessimismo.",["zib"]],
 ["Zibaldone","Quali aspetti stilistici lo caratterizzano?","Frammentario e scorrevole, a volte schematico; ogni riflessione è datata; abbreviazioni, annotazioni, frasi sospese; scrittura non rivista, a uso personale.",["zib"]],
 ["Canti","Secondo quali criteri sono ordinate le liriche dei Canti nell'edizione del 1845?","Ordine cronologico di stesura (dal 1817 al 1837), genere (canzoni, idilli) ed elementi stilistici e tematici.",["cstr","canti45"]],
 ["Canti","Elenca le caratteristiche tematico-strutturali delle sezioni dei Canti.","Canzoni civili e filosofiche (1817-22): passato esaltato, presente condannato, stile ricercato. Piccoli idilli (1819-21): paesaggio e riflessione su destino individuale e universale. Grandi idilli (1828-30): pessimismo cosmico e rimembranza. Ciclo di Aspasia (1831-36) e ultimi: impegno morale, solidarietà, satira.",["cpat","pidilli","gi","aspasia","ginestra"]],
 ["Canti","Perché Leopardi colloca Il primo amore tra le Canzoni e i Piccoli idilli invece che per cronologia?","È un'elegia-cerniera: conclude la prima fase e fa da passaggio dai temi civili e filosofici al soggettivismo degli Idilli.",["pamore"]],
 ["Canti","In che cosa l'idillio leopardiano si differenzia da quello classico?","Nei greci è descrizione del paesaggio in armonia con la natura; in Leopardi la percezione del paesaggio suscita immaginazione, sentimento, rimembranza e indefinito, con paesaggio interiore e riflessione filosofica.",["pidilli"]],
 ["Canti","Che cosa suscita nel poeta la percezione della realtà (Piccoli idilli)?","Sensazioni visive e uditive indefinite, innescate soprattutto da notte e luna, che stimolano l'immaginazione e la riflessione.",["indef","inf"]],
 ["Canzoni","Che rapporto c'è tra il tema civile e il pessimismo storico? Perché i grandi del passato sono un modello?","Il passato eroico e le virtù degli antichi, ricchi di illusioni, sono modello di educazione contro la decadenza presente: è la fase del pessimismo storico.",["cpat","psto"]],
 ["Canzoni","Di quali valori sono emblemi Bruto e Saffo?","Bruto: libertà e giustizia, suicidio come scelta titanica. Saffo: ribellione al destino che l'ha esclusa da armonia, bellezza, amore.",["csuic"]],
 ["Grandi idilli","Qual è la fonte del sentimento poetico dei Canti pisano-recanatesi?","La «rimembranza», dolce ma dolorosa, unita alla cognizione del presente e delle illusioni perdute.",["gi"]],
 ["Grandi idilli","Quale valore simbolico ha la protagonista di A Silvia?","La speranza di felicità delusa dall'amara realtà: fanciulla morta prematuramente.",["silvia"]],
 ["Grandi idilli","Quale aspetto hanno in comune La quiete dopo la tempesta e Il sabato del villaggio?","La teoria del piacere: nella Quiete il piacere è figlio d'affanno (momentanea cessazione di un dolore); nel Sabato l'attesa è superiore al raggiungimento.",["quiete","sabato"]],
 ["Grandi idilli","Con quale animale il poeta si identifica ne Il passero solitario e perché?","Con il passero solitario: come lui, giovane, non partecipa alla festa e all'amore; ma il passero non avrà rimpianti, il poeta rimpiangerà la giovinezza.",["passero"]],
 ["Ultima fase","Perché le poesie del Ciclo di Aspasia sono «anti-idilliche»?","Non sono più basate su sogni e desideri ingannevoli della giovinezza recuperati dalla memoria, ma sono combattive ed energiche e più coscienti del proprio valore.",["aspasia"]],
 ["Ultima fase","Nella Ginestra quale atteggiamento propone Leopardi per contrastare la natura matrigna?","Accettare con coraggio la propria insignificanza e stringersi in solidarietà: la «social catena».",["ginestra"]],
 ["Ultima fase","Perché la ginestra è allegoria della vita umana?","Fiorisce nei deserti di lava, consola gli esseri perseguitati dalla natura, resiste alla distruzione, accetta dignitosamente la morte ma sa rifiorire: è la pietà, la vita che resiste e l'atteggiamento dell'intellettuale.",["ginestra"]],
 ["Operette","In quale anno Leopardi scrisse la maggior parte delle Operette morali? Quante sono nell'edizione del 1845?","Nel 1824 (gennaio-novembre, a Recanati). 24 testi.",["oper"]],
 ["Operette","Qual è la principale fonte letteraria delle Operette?","La satira greca e latina, in particolare Luciano di Samòsata (Dialoghi).",["luciano"]],
 ["Operette","Perché le Operette sottolineano il passaggio dal pessimismo storico al cosmico?","Nascono nel silenzio poetico 1823-28 con la nuova concezione pessimistica della natura: dall'analisi dell'«arido vero» si conclude che il male è intrinseco all'esistenza.",["oper","pcosm"]],
 ["Operette","Quale logica ha guidato la scelta dei protagonisti?","Comunicare il pensiero con personaggi vari: individui comuni, esseri fantastici, animali, scrittori, personaggi d'invenzione, mitologia, scienza, storia, filosofia, personificazioni.",["oper"]]

    ns.forEach(function(n){n.y0=L.top+8+n.row*ROWH;n.cy=n.y0+NH/2;n.cx=n.x+NW/2;});
  });

}
function build(){

function drawEdges(){

function mark(){

function reveal(n,center){

/* ---- scheda ---- */
function trunc(s,k){return s.length>k?s.slice(0,k-1)+"…":s;}
function connBlock(n){
  var ids=adj[n.id].slice().sort(function(a,b){return bySort(byId[a],byId[b]);});
  if(!ids.length)return"";
  if(ids.length>10){
    var g={};ids.forEach(function(id){var m=byId[id];(g[m.l]=g[m.l]||[]).push(m);});
    var h='<h3>Collegato a</h3>';
    LANES.forEach(function(L){
      if(!g[L.k])return;
      h+='<div class="cg-cap">'+esc(L.n)+'</div><div class="chips" style="margin-bottom:8px">'+g[L.k].map(function(m){return'<button class="chip l-'+m.l+'" data-go="'+m.id+'">'+esc(m.s)+'</button>';}).join("")+'</div>';
    });
    return h;
  }
  var Lf=[],Rt=[];
  ids.forEach(function(id){(byId[id].y<n.y?Lf:Rt).push(id);});
  var rowH=36,pw=146,W=360,cxm=W/2,rows=Math.max(Lf.length,Rt.length,1),top=22;
  var H=top+rows*rowH+4,cy=top+rows*rowH/2;
  function ypos(i,count){return top+(rows*rowH-count*rowH)/2+i*rowH+3;}
  var s='<svg class="cg l-'+n.l+'" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Collegamenti di questa scheda">';
  if(Lf.length)s+='<text class="h" x="0" y="13">Prima</text>';
  if(Rt.length)s+='<text class="h" x="'+W+'" y="13" text-anchor="end">Dopo</text>';
  function pill(id,x,y,side){
    var m=byId[id];
    var lx=side==="L"?pw:x,ex=cxm+(side==="L"?-14:14);
    return'<line x1="'+lx+'" y1="'+(y+15)+'" x2="'+ex+'" y2="'+cy+'"/>'+
      '<g class="l-'+m.l+'" data-go="'+id+'" tabindex="0" role="button" aria-label="'+esc(m.t)+'"><rect class="b" x="'+x+'" y="'+y+'" width="'+pw+'" height="30" rx="7"/><rect class="s" x="'+x+'" y="'+y+'" width="5" height="30" rx="2"/><text x="'+(x+13)+'" y="'+(y+19)+'">'+esc(trunc(m.s,22))+'</text></g>';
  }
  Lf.forEach(function(id,i){s+=pill(id,0,ypos(i,Lf.length),"L");});
  Rt.forEach(function(id,i){s+=pill(id,W-pw,ypos(i,Rt.length),"R");});
  s+='<circle cx="'+cxm+'" cy="'+cy+'" r="13"/></svg>';
  return'<h3>Collegamenti</h3><p class="cg-cap">Toccane uno per passare alla sua scheda. A sinistra ciò che viene prima, a destra ciò che viene dopo.</p>'+s;
}
function sheetHtml(n){
  var h='<button class="x" aria-label="Chiudi la scheda" id="sx">×</button>';
  h+='<div class="l-'+n.l+'"><span class="tag">'+esc(LN[n.l])+'</span></div>';
  h+='<h2>'+esc(n.t)+'</h2><div class="yl">'+esc(n.yl)+'</div>';
  h+='<div class="key l-'+n.l+'"><small>Da ricordare</small><p>'+esc(n.r)+'</p></div>';

  h+=connBlock(n);
  if(n.tm.length){h+='<h3>Temi</h3><div class="tags">'+n.tm.map(function(k){var t=THEMES.filter(function(x){return x.k===k;})[0];return'<button class="tchip" data-th="'+k+'">'+esc(t.n)+'</button>';}).join("")+'</div>';}
  h+='<h3>Dettagli</h3><ul>'+n.d.map(function(x){return'<li>'+md(x)+'</li>';}).join("")+'</ul>';
  if(n.rows){h+='<h3>Le 24 operette, nell\'ordine dell\'edizione del 1845</h3><div class="rows">'+n.rows.map(function(r){return'<div><b>'+esc(r[0])+'</b>'+esc(r[1])+'</div>';}).join("")+'</div>';}
  if(TX[n.id]){var x=TX[n.id];h+='<h3>Testo chiave</h3><div class="tx l-'+n.l+'"><blockquote>'+x.v.map(esc).join("<br>")+'</blockquote>'+(x.m?'<div class="m">'+md(x.m)+'</div>':'')+'<ul>'+x.a.map(function(t){return'<li>'+md(t)+'</li>';}).join("")+'</ul><small>Versi e note di metrica non sono nelle tue pagine: controllali sulla tua antologia.</small></div>';}
  if(n.w)h+='<div class="warn"><strong>Attenzione.</strong> '+esc(n.w)+'</div>';
  if(n.pg)h+='<div class="pg">Dal libro: '+esc(n.pg)+'</div>';

}

function plBuild(){P.pl=NODES.filter(function(n){if(P.lane==="all")return true;if(P.lane==="filter")return !$("q").value.trim()&&!theme?true:!!hitMap[n.id];return n.l===P.lane;}).sort(bySort);if(!P.pl.length)P.pl=NODES.slice().sort(bySort);}
function plBtn(){$("pPlay").textContent=P.playing?"Pausa":(P.i>=P.pl.length-1&&P.pl.length>0?"Ricomincia":"Riprendi");}
function pausePl(){if(P.t){clearTimeout(P.t);P.t=null;}P.playing=false;if(P.open)plBtn();}
function plSched(){if(P.t)clearTimeout(P.t);P.t=null;if(P.playing)P.t=setTimeout(plTick,P.ms);}
function plShow(i){
  if(!P.pl.length)return;
  if(i<0)i=0;if(i>=P.pl.length)i=P.pl.length-1;
  P.i=i;var n=P.pl[i];
  sel=n.id;mark();reveal(n,true);
  var cap=$("pCap");cap.className="pcap l-"+n.l;
  cap.innerHTML='<small>'+esc(n.yl)+' — '+esc(LN[n.l])+'</small><strong>'+esc(n.t)+'</strong><p>'+esc(n.r)+'</p><button class="chip l-'+n.l+'" id="pOpen">Apri la scheda</button>';
  $("pProg").style.width=((i+1)/P.pl.length*100)+"%";
  $("pCount").textContent=(i+1)+" di "+P.pl.length;
  plBtn();
}
function plTick(){
  if(!P.playing)return;
  if(P.i>=P.pl.length-1){P.playing=false;plBtn();return;}
  plShow(P.i+1);plSched();
}
function plPlay(){
  if(P.i>=P.pl.length-1)plShow(0);
  P.playing=true;plBtn();plSched();
}
function plStart(){
  closeSheet();
  P.open=true;$("pStart").hidden=true;$("pBox").hidden=false;$("v-map").classList.add("playing");
  plBuild();
  var idx=-1;
  if(sel){for(var i=0;i<P.pl.length;i++)if(P.pl[i].id===sel){idx=i;break;}}
  plShow(idx>=0?idx:0);plPlay();
}
function plClose(){
  pausePl();P.open=false;P.i=-1;
  $("pBox").hidden=true;$("pStart").hidden=false;$("v-map").classList.remove("playing");
  sel=null;mark();
}
$("pStart").addEventListener("click",plStart);

$("pLane").addEventListener("change",function(e){

var lastHits=[],hitMap={},theme=null;
function fOK(n,qq){return (!qq||matches(n,qq))&&(!theme||n.tm.indexOf(theme)>=0);}
function matches(n,qq){
  var t=n.t+" "+n.s+" "+n.yl+" "+n.r+" "+n.d.join(" ")+(n.rows?" "+n.rows.map(function(r){return r.join(" ");}).join(" "):"")+(TX[n.id]?" "+TX[n.id].v.join(" ")+" "+TX[n.id].a.join(" "):"");
  return t.toLowerCase().indexOf(qq)>=0;
}
function applySearch(){
  var qq=$("q").value.trim().toLowerCase();
  var active=!!(qq||theme);
  hitMap={};lastHits=[];
  NODES.forEach(function(n){if(active&&fOK(n,qq)){hitMap[n.id]=1;lastHits.push(n);}});
  lastHits.sort(bySort);
  scroller.classList.toggle("has-q",active);
  NODES.forEach(function(n){var e=$("n-"+n.id);if(e)e.classList.toggle("hit",!!hitMap[n.id]);});
  var tb=$("themes").querySelectorAll(".tchip");
  for(var i=0;i<tb.length;i++)tb[i].classList.toggle("on",tb[i].getAttribute("data-th")===theme);
  var h="";
  if(active){
    var tn="";THEMES.forEach(function(t){if(t.k===theme)tn=t.n;});
    if(!lastHits.length)h='<span class="cnt">Nessun risultato con questi filtri.</span>';
    else{
      h='<span class="cnt">'+lastHits.length+(lastHits.length===1?" scheda":" schede")+(tn?" sul tema «"+esc(tn)+"»":"")+'</span>';
      if(mode==="map")h+=lastHits.slice(0,30).map(function(n){return'<button class="chip l-'+n.l+'" data-go="'+n.id+'">'+esc(n.s)+'</button>';}).join("");
    }
    h+='<button class="chip l-v" data-clear="1">Togli i filtri</button>';
  }
  $("results").innerHTML=h;
  renderList();
}

  if(e.key==="Enter"&&lastHits.length&&mode==="map"){e.preventDefault();$("q").blur();reveal(lastHits[0],true);}
});

function setTheme(k){theme=(theme===k)?null:k;applySearch();}

/* ---- ripasso: quiz veloce ---- */
var wrong=ls("leo_wrong",[]).filter(function(id){return byId[id];});
var VQ={list:[],i:0,score:0,chosen:-1,finished:false,started:false,mode:"new"};
function yearOK(n){return /^\d{4}$/.test(n.yl)&&!/\d/.test(n.s);}
function makeQ(n){
  if(yearOK(n)&&Math.random()<0.5){
    var c=+n.yl,ds=[];
    [-3,-2,-1,1,2,3].forEach(function(d){var y=c+d;if(y>=1798&&y<=1845)ds.push(y);});
    if(ds.length>=3){
      ds=shuffle(ds).slice(0,3);
      var o=shuffle([c].concat(ds)).map(String);
      return{id:n.id,q:"In che anno si colloca «"+n.s+"»?",opts:o,ok:o.indexOf(String(c))};
    }
  }
  var same=NODES.filter(function(m){return !m.ext&&m.id!==n.id&&m.l===n.l&&m.r!==n.r;});
  var pool=same.length>=3?same:NODES.filter(function(m){return !m.ext&&m.id!==n.id&&m.r!==n.r;});
  var o2=shuffle([n.r].concat(shuffle(pool).slice(0,3).map(function(m){return m.r;})));
  return{id:n.id,q:"Che cosa ricordi di «"+n.s+"»?",opts:o2,ok:o2.indexOf(n.r)};
}
function startQuiz(m){
  VQ.mode=m;VQ.i=0;VQ.score=0;VQ.chosen=-1;VQ.finished=false;VQ.started=true;
  var src=m==="errors"?wrong.map(function(id){return byId[id];}):NODES.filter(function(n){return !n.ext;});
  VQ.list=shuffle(src).slice(0,10).map(makeQ);
  renderVQ();
}
function renderVQ(){
  var el=$("vq"),h="";
  if(!VQ.started){
    h='<div class="vq"><h3>Quiz veloce</h3><p style="margin:0 0 12px">10 domande a risposta multipla generate dalle schede della mappa: anni, opere, persone e concetti.</p><div class="act"><button class="btn" data-a="new">Inizia il quiz</button>';
    if(wrong.length)h+='<button class="btn alt" data-a="errors">Ripeti i miei errori ('+wrong.length+')</button>';
    h+='</div></div>';
    el.innerHTML=h;return;
  }
  if(VQ.finished){
    h='<div class="vq"><small style="color:var(--mute);font-weight:700">Risultato</small><div class="score">'+VQ.score+' su '+VQ.list.length+'</div><p style="margin:0 0 6px">'+(VQ.score===VQ.list.length?"Perfetto.":VQ.score>=VQ.list.length*0.7?"Buon risultato: ripassa le schede che hai sbagliato.":"Ripassa le schede degli errori e riprova.")+'</p><div class="act"><button class="btn" data-a="new">Nuovo quiz</button>';
    if(wrong.length)h+='<button class="btn alt" data-a="errors">Ripeti i miei errori ('+wrong.length+')</button>';
    h+='</div></div>';
    el.innerHTML=h;return;
  }
  var q=VQ.list[VQ.i],n=byId[q.id];
  h='<div class="vq"><small style="color:var(--mute);font-weight:700">Domanda '+(VQ.i+1)+' di '+VQ.list.length+(VQ.mode==="errors"?" (i tuoi errori)":"")+'</small><h3>'+esc(q.q)+'</h3>';
  q.opts.forEach(function(o,i){
    var c="o";
    if(VQ.chosen>=0){if(i===q.ok)c+=" right";else if(i===VQ.chosen)c+=" wrong";}
    h+='<button class="'+c+'" data-o="'+i+'"'+(VQ.chosen>=0?" disabled":"")+'>'+esc(o)+'</button>';
  });
  if(VQ.chosen>=0){
    var good=VQ.chosen===q.ok;
    h+='<div class="fb"><strong>'+(good?"Corretto.":"Non proprio.")+'</strong>'+esc(n.t)+': '+esc(n.r)+'</div><div class="act"><button class="btn" data-a="next">'+(VQ.i>=VQ.list.length-1?"Vedi il risultato":"Avanti")+'</button><button class="btn alt" data-go="'+n.id+'">Apri la scheda</button></div>';
  }
  h+='</div>';
  el.innerHTML=h;
}
$("vq").addEventListener("click",function(e){
  var go=e.target.closest("[data-go]");
  if(go){openNode(go.getAttribute("data-go"),false);return;}
  var a=e.target.closest("[data-a]");
  if(a){
    var act=a.getAttribute("data-a");
    if(act==="new"||act==="errors")startQuiz(act);
    else if(act==="next"){VQ.chosen=-1;if(VQ.i>=VQ.list.length-1)VQ.finished=true;else VQ.i++;renderVQ();}
    return;
  }
  var o=e.target.closest("[data-o]");
  if(o&&VQ.chosen<0){
    var i=+o.getAttribute("data-o"),q=VQ.list[VQ.i];
    VQ.chosen=i;
    var good=i===q.ok;
    if(good){VQ.score++;var k=wrong.indexOf(q.id);if(k>=0)wrong.splice(k,1);}
    else if(wrong.indexOf(q.id)<0)wrong.push(q.id);
    ss("leo_wrong",wrong);
    renderVQ();
  }
});

/* ---- ripasso: domande del libro ---- */
var qState=ls("leo_book",[]);
if(!Array.isArray(qState)||qState.length!==QUIZ.length)qState=QUIZ.map(function(){return 0;});
function renderQuiz(){
  var h="",last="";
  QUIZ.forEach(function(q,i){
    if(q[0]!==last){h+='<div class="qg">'+esc(q[0])+'</div>';last=q[0];}
    var st=qState[i];
    var cls="q"+(st===1?" ok":st===2?" again":"");
    var ch=q[3].filter(function(id){return byId[id];}).map(function(id){var m=byId[id];return'<button class="chip l-'+m.l+'" data-go="'+id+'">'+esc(m.s)+'</button>';}).join("");
    h+='<div class="'+cls+'" data-i="'+i+'"><button data-open="1">'+esc(q[1])+'</button><div class="ans"><div>'+esc(q[2])+'</div>'+(ch?'<div class="chips" style="margin-top:10px">'+ch+'</div>':'')+'<div class="btns"><button data-r="1">Lo sapevo</button><button data-r="2">Da ripassare</button></div></div></div>';
  });
  $("quiz").innerHTML=h;
  var ok=qState.filter(function(x){return x===1;}).length;
  $("bar").style.width=(ok/QUIZ.length*100)+"%";
  $("barTxt").textContent=ok+" su "+QUIZ.length+" già sicure";
}
$("quiz").addEventListener("click",function(e){
  var go=e.target.closest("[data-go]");
  if(go){openNode(go.getAttribute("data-go"),false);return;}
  var box=e.target.closest(".q");if(!box)return;
  var i=+box.getAttribute("data-i");
  var r=e.target.closest("[data-r]");
  if(r){qState[i]=+r.getAttribute("data-r");ss("leo_book",qState);renderQuiz();
    var nb=$("quiz").querySelector('.q[data-i="'+i+'"]');if(nb)nb.classList.add("open");return;}
  if(e.target.closest("[data-open]"))box.classList.toggle("open");
});
$("qseg").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var m=b.getAttribute("data-qm");
  var bs=$("qseg").querySelectorAll("button");
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i]===b);
  $("qfast").style.display=m==="fast"?"":"none";
  $("qbook").style.display=m==="book"?"":"none";
});

/* ---- note ---- */
function renderNotes(){
  var h='<h2 class="sec" style="margin-top:0">Pagine che mancano</h2><div class="note w"><ul>'+NOTES_MISSING.map(function(x){return'<li>'+esc(x)+'</li>';}).join("")+'</ul></div>';
  h+='<h2 class="sec">Cosa non viene dalle tue pagine</h2><div class="note w"><ul>'+NOTES_EXT.map(function(x){return'<li>'+md(x)+'</li>';}).join("")+'</ul></div>';
  h+='<h2 class="sec">Punti in cui è facile sbagliare</h2>';
  h+=NOTES_TRAPS.map(function(t){return'<div class="note"><h3>'+esc(t[0])+'</h3><p>'+esc(t[1])+'</p></div>';}).join("");
  h+='<h2 class="sec">Come usare la mappa</h2><div class="note"><ul><li>Cinque corsie: vita e luoghi, persone e influenze, pensiero, Canti, prose e edizioni. In orizzontale scorre il tempo, dal 1798 al 1837, poi le edizioni postume.</li><li>Tocca una card: si apre la scheda con «Da ricordare», lo schema dei collegamenti (prima a sinistra, dopo a destra) e i dettagli.</li><li>Cerca un nome o un anno: le card che lo contengono si accendono. I tasti dei periodi ti portano subito a quel momento.</li><li>«Riproduci in ordine cronologico» scorre le card una alla volta, in ordine di anno. Puoi seguire solo una corsia.</li><li>«Lista» mostra le stesse schede in colonna, con filtri per corsia.</li><li>I tasti «Temi» accendono tutte le schede su un argomento (natura, noia, amore, morte...).</li><li>«Luoghi» mostra i viaggi su una mappa; «Confronti» mette a fianco fasi, autori e opere.</li></ul></div>';
  $("notes").innerHTML=h;
}

/* ---- confronti ---- */
function renderCmp(){
  $("cmp").innerHTML=CMP.map(function(c){
    var th='<tr>'+c.cols.map(function(x){return'<th>'+esc(x)+'</th>';}).join("")+'</tr>';
    var tr=c.rows.map(function(r){return'<tr>'+r.map(function(x){return'<td>'+esc(x)+'</td>';}).join("")+'</tr>';}).join("");
    var ch=c.k.filter(function(id){return byId[id];}).map(function(id){var m=byId[id];return'<button class="chip l-'+m.l+'" data-go="'+id+'">'+esc(m.s)+'</button>';}).join("");
    return'<div class="cmp"><h3>'+esc(c.t)+'</h3><div class="i">'+esc(c.i)+'</div><div class="tbl"><table><thead>'+th+'</thead><tbody>'+tr+'</tbody></table></div><div class="chips">'+ch+'</div><div class="pg">Dal libro: '+esc(c.pg)+'</div></div>';
  }).join("");
}
$("cmp").addEventListener("click",function(e){var c=e.target.closest("[data-go]");if(c)openNode(c.getAttribute("data-go"),false);});

/* ---- luoghi ---- */
var G={i:0,city:null,t:null};
var GW=438,GH=508;
function proj(lat,lon){return[(lon-6.3)*0.74*44+14,(47.3-lat)*44+14];}
function poly(pts){return pts.map(function(p){var q=proj(p[1],p[0]);return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");}
function pxy(id){var p=PLACES[id],q=proj(p.lat,p.lon);return[q[0]+(p.dx||0),q[1]+(p.dy||0)];}
function renderGeo(){
  var s='<svg class="geo" viewBox="0 0 '+GW+' '+GH+'" role="img" aria-label="Mappa dei luoghi di Leopardi">';
  s+='<polygon class="land" points="'+poly(ITALY)+'"/><polygon class="land" points="'+poly(SICILY)+'"/><polygon class="land" points="'+poly(SARD)+'"/>';
  STATES.forEach(function(t){var q=proj(t[1],t[2]);s+='<text class="st" x="'+q[0].toFixed(1)+'" y="'+q[1].toFixed(1)+'">'+esc(t[0])+'</text>';});
  for(var i=1;i<STEPS.length;i++){
    var a1=STEPS[i-1].p,b1=STEPS[i].p;if(a1===b1)continue;
    var p1=pxy(a1),p2=pxy(b1);
    s+='<line class="seg'+(G.i===i?" act":"")+'" x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'"/>';
  }
  var cur=STEPS[G.i].p;
  Object.keys(PLACES).forEach(function(id){
    var p=PLACES[id],q=pxy(id),right=p.side==="r";
    s+='<g data-city="'+id+'" tabindex="0" role="button" aria-label="'+esc(p.n)+'"><circle class="hit" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="18"/><circle class="pt'+(id===cur?" act":"")+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(id===cur?9:7)+'"/><text class="cn" x="'+(q[0]+(right?13:-13)).toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" text-anchor="'+(right?"start":"end")+'">'+esc(p.n)+'</text></g>';
  });
  s+='</svg>';
  $("geo").innerHTML=s;
}
function renderSteps(){
  var st=STEPS[G.i],pl=PLACES[st.p];
  var chs=st.k.filter(function(id){return byId[id];}).map(function(id){var m=byId[id];return'<button class="chip l-'+m.l+'" data-go="'+id+'">'+esc(m.s)+'</button>';}).join("");
  var cap='<div class="gcap"><small>Tappa '+(G.i+1)+' di '+STEPS.length+' — '+esc(st.y)+'</small><strong>'+esc(st.t)+'</strong><div style="font-size:13px;color:var(--mute)">'+esc(pl.n)+'</div>'+(chs?'<div class="chips" style="margin-top:8px">'+chs+'</div>':'')+'</div>';
  if(G.city){
    var vs=[];STEPS.forEach(function(s,i){if(s.p===G.city)vs.push(i);});
    cap+='<div style="font-size:13px;margin:0 0 8px"><strong>'+esc(PLACES[G.city].n)+'</strong>: '+vs.length+(vs.length===1?" tappa":" tappe")+' (tocca per saltare)</div><div class="chips" style="margin-bottom:10px">'+vs.map(function(i){return'<button class="chip l-v" data-step="'+i+'">'+(i+1)+'. '+esc(STEPS[i].y)+'</button>';}).join("")+'</div>';
  }
  $("gcap").innerHTML=cap;
  $("steps").innerHTML=STEPS.map(function(s,i){return'<button data-step="'+i+'"'+(i===G.i?' class="on"':'')+'><b>'+(i+1)+'</b><span>'+esc(s.t)+'<small>'+esc(PLACES[s.p].n)+' · '+esc(s.y)+'</small></span></button>';}).join("");
}
function gSet(i){G.i=Math.max(0,Math.min(STEPS.length-1,i));renderGeo();renderSteps();}
function gStop(){if(G.t){clearInterval(G.t);G.t=null;}var b=$("gPlay");if(b)b.textContent="Segui il viaggio";}
$("gPrev").addEventListener("click",function(){gStop();gSet(G.i-1);});
$("gNext").addEventListener("click",function(){gStop();gSet(G.i+1);});
$("gPlay").addEventListener("click",function(){
  if(G.t){gStop();return;}
  if(G.i>=STEPS.length-1)gSet(0);
  $("gPlay").textContent="Pausa";
  G.t=setInterval(function(){if(G.i>=STEPS.length-1){gStop();return;}gSet(G.i+1);},3000);
});
$("geo").addEventListener("click",function(e){
  var c=e.target.closest("[data-city]");if(!c)return;
  gStop();G.city=c.getAttribute("data-city");
  var first=-1;for(var i=0;i<STEPS.length;i++)if(STEPS[i].p===G.city){first=i;break;}
  gSet(first);
});
function gClick(e){
  var s=e.target.closest("[data-step]");
  if(s){gStop();G.city=null;gSet(+s.getAttribute("data-step"));return;}
  var g=e.target.closest("[data-go]");if(g)openNode(g.getAttribute("data-go"),false);
}
$("steps").addEventListener("click",gClick);
$("gcap").addEventListener("click",gClick);

build();renderCmp();renderGeo();renderSteps();setMode("map");renderGloss();renderQuiz();renderVQ();renderNotes();

</script>
