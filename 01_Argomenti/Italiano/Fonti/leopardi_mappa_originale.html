<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leopardi: mappa di vita, pensiero e opere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#15202b; --mute:#566473; --line:#d8dee6; --axis:#eaeef3;
  --v:#2a6bb5; --p:#a5670b; --f:#7843b3; --c:#1c8657; --r:#c0412c; --x:#0d7686; --hit:#e8a800;
  --warn-bg:#fff4dc; --warn-ink:#5b3d00; --on:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151c; --card:#18212b; --ink:#e7ecf1; --mute:#9aa7b4; --line:#2a3645; --axis:#1b2530;
    --v:#6ea9ec; --p:#e3a544; --f:#b98df2; --c:#52c48d; --r:#f28a75; --x:#4cc3d1;
    --warn-bg:#3a2d10; --warn-ink:#f3d9a0; --on:#0f151c;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151c; --card:#18212b; --ink:#e7ecf1; --mute:#9aa7b4; --line:#2a3645; --axis:#1b2530;
  --v:#6ea9ec; --p:#e3a544; --f:#b98df2; --c:#52c48d; --r:#f28a75; --x:#4cc3d1;
  --warn-bg:#3a2d10; --warn-ink:#f3d9a0; --on:#0f151c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:8px 14px 2px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
nav.tabs{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1 0 auto;background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--mute)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,.node:focus-visible,.card:focus-visible,.cg g:focus-visible{outline:2px solid var(--v);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block}
#v-map.on{display:flex;flex-direction:column;overflow:hidden}
/* toolbar */
#tb{flex:none;padding:6px 0 2px;border-bottom:1px solid var(--line)}
#tb .r1{display:flex;gap:8px;padding:0 10px 4px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
input[type=search]{flex:1;min-width:0;box-sizing:border-box;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.rowchips{display:flex;gap:6px;overflow-x:auto;padding:3px 10px;white-space:nowrap;-webkit-overflow-scrolling:touch}
.rowchips:empty{display:none}
.rowchips .chip{flex:none}
.pchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.cnt{flex:none;align-self:center;font-size:12.5px;font-weight:600;color:var(--mute);padding-right:4px}
#v-map.playing #periods,#v-map.playing #results{display:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:3px 10px}
.filters:empty{display:none}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--mute)}
.filters button.on{background:color-mix(in srgb,var(--lc) 18%,var(--card));border-color:var(--lc);color:var(--ink)}
/* map */
#scroller{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#axis{position:sticky;top:0;height:26px;z-index:6;background:var(--axis);border-bottom:1px solid var(--line)}
#axis span{position:absolute;top:5px;font-size:11px;font-weight:600;color:var(--mute)}
#axis span.cut{color:var(--r)}
#body{position:relative}
.lane{position:absolute;left:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--lc) 5%,transparent)}
.lane .lab{position:sticky;left:0;z-index:5;width:26px;height:100%;background:color-mix(in srgb,var(--lc) 16%,var(--bg));color:var(--lc);font-size:11.5px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.55}
#edges{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.node{position:absolute;z-index:4;width:200px;height:108px;box-sizing:border-box;padding:0;border-radius:9px;text-align:left;background:var(--card);border:1.5px solid color-mix(in srgb,var(--lc) 55%,var(--line));overflow:hidden;display:flex;flex-direction:column;transition:opacity .15s,box-shadow .15s}
.node i.hd{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--lc);color:var(--on);padding:2px 8px;font-size:10.5px;font-style:normal;line-height:1.5;flex:none}
.node i.hd b{font-weight:700}
.node i.hd em{font-style:normal;font-weight:500;opacity:.92}
.node strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.2;font-weight:700;padding:5px 8px 0}
.node span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;line-height:1.3;font-weight:400;color:var(--mute);padding:2px 8px 4px}
.l-v{--lc:var(--v)} .l-p{--lc:var(--p)} .l-f{--lc:var(--f)} .l-c{--lc:var(--c)} .l-r{--lc:var(--r)} .l-x{--lc:var(--x)}
#scroller.has-q .node{opacity:.2}
#scroller.has-q .node.hit{opacity:1;box-shadow:0 0 0 3px var(--hit)}
#scroller.has-sel .node{opacity:.28}
#scroller.has-sel .node.nb,#scroller.has-sel .node.sel{opacity:1}
.node.sel{box-shadow:0 0 0 3px var(--ink);z-index:5}
.node.nb{box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 70%,transparent)}
#edges path{fill:none;stroke:var(--ink);stroke-width:1.8;opacity:.6}
/* list */
#listv{flex:1;min-height:0;overflow:auto;padding:10px 12px 40px;-webkit-overflow-scrolling:touch}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lc);border-radius:10px;padding:10px 12px;margin:0 0 9px}
.card small{display:block;font-size:12px;font-weight:600;color:var(--lc)}
.card strong{display:block;font-size:15px;margin:1px 0 2px;line-height:1.3}
.card p{margin:0;font-size:13.5px;color:var(--mute)}
/* player */
#player{flex:none;border-top:1px solid var(--line);background:var(--card);padding:8px 10px}
.pstart{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;font-size:15px}
.pmeta{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
#pCount{font-size:12.5px;font-weight:600;color:var(--mute);flex:none}
.pcap{border-left:5px solid var(--lc,var(--ink));padding:6px 10px 8px;margin:8px 0;background:color-mix(in srgb,var(--lc,var(--ink)) 9%,var(--card));border-radius:0 8px 8px 0}
.pcap small{color:var(--lc,var(--ink));font-weight:700;font-size:12px}
.pcap strong{display:block;font-size:15px;line-height:1.3}
.pcap p{margin:2px 0 6px;font-size:13.5px}
.pctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pctl button,.pctl select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600}
.pctl .main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid color-mix(in srgb,var(--lc) 45%,var(--line));background:color-mix(in srgb,var(--lc) 10%,var(--card));border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500}
/* modal */
#scrim{position:fixed;inset:0;z-index:19;background:rgba(10,16,24,.5);opacity:0;visibility:hidden;transition:opacity .2s}
#scrim.on{opacity:1;visibility:visible}
#sheet{position:fixed;left:50%;top:50%;z-index:20;width:min(92%,560px);box-sizing:border-box;background:var(--card);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);max-height:82%;overflow:auto;transform:translate(-50%,-46%) scale(.97);opacity:0;visibility:hidden;transition:transform .2s ease,opacity .2s ease,visibility .2s;padding:18px 18px 20px;overscroll-behavior:contain}
#sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
#sheet .x{position:absolute;top:8px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
#sheet .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--lc);margin-bottom:2px}
#sheet h2{margin:0 44px 2px 0;font-size:20px;line-height:1.25;letter-spacing:-.01em}
#sheet .yl{font-size:12.5px;color:var(--mute);margin-bottom:10px}
.key{border-left:5px solid var(--lc);background:color-mix(in srgb,var(--lc) 10%,var(--card));border-radius:0 10px 10px 0;padding:9px 12px;margin:2px 0 4px}
.key small{display:block;font-size:12px;font-weight:700;color:var(--lc)}
.key p{margin:1px 0 0;font-size:16px;font-weight:600;line-height:1.4}
#sheet h3{font-size:13px;margin:16px 0 6px;color:var(--mute);font-weight:700}
#sheet ul{margin:8px 0 0;padding-left:19px}
#sheet li{margin:8px 0;font-size:15.5px;line-height:1.5}
.warn{margin-top:12px;padding:9px 11px;border-radius:9px;background:var(--warn-bg);color:var(--warn-ink);font-size:13.5px}
.rows{margin-top:10px;border-top:1px solid var(--line)}
.rows div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rows div b{display:block;font-weight:600}
.pg{margin-top:12px;font-size:12px;color:var(--mute)}
.cg{width:100%;height:auto;display:block}
.cg g[data-go]{cursor:pointer}
.cg rect.b{fill:color-mix(in srgb,var(--lc) 13%,var(--card));stroke:color-mix(in srgb,var(--lc) 55%,var(--line))}
.cg rect.s{fill:var(--lc)}
.cg text{fill:var(--ink);font-size:11.5px;font-family:inherit}
.cg text.h{fill:var(--mute);font-size:11px;font-weight:600}
.cg line{stroke:var(--mute);stroke-width:1.4;opacity:.7}
.cg circle{fill:var(--lc);stroke:var(--ink);stroke-width:2}
.cg-cap{font-size:12px;color:var(--mute);margin:0 0 2px}

.tchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.tchip.on{background:var(--hit);border-color:var(--hit);color:#1a1300}
.rowlab{flex:none;align-self:center;font-size:12px;font-weight:700;color:var(--mute);padding-right:2px}
#v-map.playing #themes{display:none}
.tx{margin-top:4px}
.tx blockquote{margin:6px 0;padding:8px 12px;border-left:4px solid var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--card));border-radius:0 8px 8px 0;font-style:italic;font-size:15px;line-height:1.55}
.tx .m{font-size:13px;color:var(--mute);margin:2px 0 4px}
.tx li{font-size:14.5px}
.tx small{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.cmp h3{margin:0;padding:12px 14px 2px;font-size:16px}
.cmp .i{padding:0 14px 8px;font-size:13px;color:var(--mute)}
.cmp .tbl{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;min-width:440px;font-size:13.5px}
.cmp th,.cmp td{border-top:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.cmp th{background:var(--axis);font-weight:700;font-size:12.5px}
.cmp td:first-child{font-weight:700;background:color-mix(in srgb,var(--axis) 60%,var(--card));width:18%}
.cmp .chips{padding:10px 14px}
.cmp .pg{padding:0 14px 10px;margin:0}
.geo{display:block;width:100%;height:auto;max-height:52vh;background:var(--axis);border-radius:12px;border:1px solid var(--line)}
.geo .land{fill:color-mix(in srgb,var(--ink) 7%,var(--card));stroke:var(--line);stroke-width:1.2}
.geo .st{fill:var(--mute);font-size:9.5px;opacity:.7;text-anchor:middle;pointer-events:none}
.geo .seg{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 4;opacity:.6;fill:none}
.geo .seg.act{stroke:var(--r);stroke-width:2.8;stroke-dasharray:none;opacity:1}
.geo .pt{fill:var(--v);stroke:var(--card);stroke-width:2}
.geo .pt.act{fill:var(--r);stroke:var(--ink)}
.geo text.cn{fill:var(--ink);font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--axis);stroke-width:3px}
.geo g[data-city]{cursor:pointer}
.geo .hit{fill:transparent}
.gctl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.gctl button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}
.gctl .main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gcap{border-left:5px solid var(--v);padding:8px 12px;background:color-mix(in srgb,var(--v) 9%,var(--card));border-radius:0 10px 10px 0;margin-bottom:10px}
.gcap small{display:block;font-weight:700;font-size:12px;color:var(--v)}
.gcap strong{font-size:16px}
.steps button{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;margin:0 0 6px;align-items:flex-start}
.steps button.on{border-color:var(--r);background:color-mix(in srgb,var(--r) 8%,var(--card))}
.steps b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--v);color:var(--on);text-align:center;line-height:24px;font-size:12px}
.steps span{font-size:14px}
.steps small{display:block;color:var(--mute);font-size:12px}

/* other tabs */
.pad{padding:12px 14px 40px}
.tools{margin-bottom:12px;display:flex}
.gl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 9px}
.gl h3{margin:0 0 3px;font-size:15.5px}
.gl p{margin:0 0 8px;font-size:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 9px;overflow:hidden}
.q>button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:11px 13px;font-size:14.5px;font-weight:600}
.q .ans{display:none;padding:0 13px 12px;font-size:14px}
.q.open .ans{display:block}
.q .btns{display:flex;gap:8px;margin-top:10px}
.q .btns button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-size:13px;font-weight:600}
.q.ok{border-color:var(--c)} .q.again{border-color:var(--r)}
.qg{margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .25s}
.vq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.vq h3{margin:4px 0 12px;font-size:17px;line-height:1.35}
.vq .o{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;margin:0 0 8px;font-size:14.5px;line-height:1.4}
.vq .o.right{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.vq .o.wrong{border-color:var(--r);background:color-mix(in srgb,var(--r) 15%,var(--card))}
.vq .fb{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px}
.vq .fb strong{display:block;margin-bottom:2px}
.vq .act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.score{font-size:34px;font-weight:700;margin:2px 0}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:0 0 10px}
.note h3{margin:0 0 4px;font-size:15px}
.note p,.note ul{margin:4px 0;font-size:14px}
.note ul{padding-left:18px}
.note.w{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
h2.sec{font-size:15px;margin:18px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Leopardi: vita, pensiero e opere</h1></header>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" aria-selected="true" data-t="map">Mappa</button>
  <button role="tab" aria-selected="false" data-t="places">Luoghi</button>
  <button role="tab" aria-selected="false" data-t="cmp">Confronti</button>
  <button role="tab" aria-selected="false" data-t="gloss">Glossario</button>
  <button role="tab" aria-selected="false" data-t="quiz">Ripasso</button>
  <button role="tab" aria-selected="false" data-t="notes">Attenzione</button>
</nav>
<main>
  <section class="view on" id="v-map">
    <div id="tb">
      <div class="r1">
        <div class="seg" id="seg"><button data-m="map" class="on">Mappa</button><button data-m="list">Lista</button></div>
        <input type="search" id="q" placeholder="Cerca: Ranieri, Pisa, 1829, noia" aria-label="Cerca nella mappa">
      </div>
      <div class="rowchips" id="periods"></div>
      <div class="rowchips" id="themes"></div>
      <div class="rowchips" id="results"></div>
      <div class="filters" id="lf" style="display:none"></div>
    </div>
    <div id="scroller"><div id="axis"></div><div id="body"><svg id="edges"></svg></div></div>
    <div id="listv" style="display:none"><div id="list"></div></div>
    <div id="player">
      <button class="pstart" id="pStart">Riproduci in ordine cronologico</button>
      <div id="pBox" hidden>
        <div class="pmeta"><div class="pbar"><i id="pProg"></i></div><span id="pCount"></span></div>
        <div class="pcap" id="pCap"></div>
        <div class="pctl">
          <button id="pPrev">‹ Indietro</button>
          <button id="pPlay" class="main">Pausa</button>
          <button id="pNext">Avanti ›</button>
          <select id="pSpeed" aria-label="Velocità"><option value="12000">Lenta</option><option value="6000" selected>Normale</option><option value="3000">Veloce</option></select>
          <select id="pLane" aria-label="Cosa seguire"><option value="all">Tutto</option><option value="filter">Solo i filtrati</option><option value="x">Solo contesto</option><option value="v">Solo vita</option><option value="p">Solo persone</option><option value="f">Solo pensiero</option><option value="c">Solo Canti</option><option value="r">Solo prose</option></select>
          <button id="pClose" aria-label="Chiudi il percorso">Chiudi</button>
        </div>
      </div>
    </div>
  </section>
  <section class="view" id="v-places"><div class="pad">
    <p style="margin:0 0 10px">Gli spostamenti di Leopardi nell'ordine in cui sono avvenuti. Tocca una tappa o una città. Gli Stati sono quelli della mappa del libro (semplificata).</p>
    <div id="geo"></div>
    <div class="gctl"><button id="gPrev">‹ Tappa prima</button><button id="gPlay" class="main">Segui il viaggio</button><button id="gNext">Tappa dopo ›</button></div>
    <div id="gcap"></div>
    <div class="steps" id="steps"></div>
  </div></section>

function N(id,l,y,yl,s,t,d,o){NODES.push(Object.assign({id:id,l:l,y:y,yl:yl,s:s,t:t,d:d,k:[],w:"",pg:"",rows:null},o||{}));}

/* ---------- VITA E LUOGHI ---------- */
N("nasc","v",1798,"1798","Nasce a Recanati","Nascita a Recanati",[
 "Nasce a **Recanati** (sulla mappa del libro: Stato della Chiesa).",
 "Ambiente provinciale e disagio familiare: con il dolore fisico contribuiscono alla sua **visione pessimistica** della condizione umana."
],{k:["stud","padre","piacere"],w:"Famiglia e prima formazione non sono nelle tue pagine: le trovi nelle schede «La famiglia» e «Infanzia e prime letture», scritte da me da conoscenze generali.",pg:"p. 679, 683"});

N("stud","v",1809,"1809-1816","Studio «matto e disperatissimo»","Formazione erudita (1809-1816)",[
 "Riceve una **formazione erudita**: «studio matto e disperatissimo».",
 "1812-1815 scrive saggi eruditi. Nel 1816 traduzioni e prime poesie.",
 "Gli intensi anni di studio indeboliscono il fisico, già colpito da una precoce **patologia delle ossa**: sviluppa una doppia gobba e si ammala gravemente agli occhi.",
 "Il suo orizzonte culturale si apre ed entra in conflitto con l'**ambiente gretto e soffocante** in cui è costretto a vivere."
],{k:["nasc","conv1","padre"],pg:"p. 677, 679"});

N("conv1","v",1816,"1816-1818","Conversione dall'erudizione al bello","Prima conversione: «dall'erudizione al bello» (1816-1818)",[
 "Infelicità, insoddisfazione e bisogno di realizzare qualcosa di grande e di assoluto lo spingono, come scrive lui stesso, a una conversione «dall'erudizione al bello»: dallo **studio passivo alla poesia**.",
 "Continua a tradurre i classici greci e latini (il poeta greco **Mòsco**, II secolo a.C., e la **Batracomiomachia** attribuita a Omero) e compone i **primi esperimenti poetici**.",
 "Legge i classici italiani (Dante, Petrarca, Tasso) e i moderni (Alfieri, Foscolo, Berchet, Byron, Goethe). Inizia a scrivere riflessioni e appunti personali, poi raccolti nello Zibaldone.",
 "Nel 1816 scoppia la **polemica tra classicisti e romantici**: a luglio invia alla «Biblioteca italiana» una lettera in risposta a Madame de Staël, che però non viene pubblicata."
],{k:["stael","gior","antirom","zib","stud"],pg:"p. 677"});

N("gita18","v",1818.7,"Sett. 1818","Gita a Macerata con Giordani","Settembre 1818: Giordani a Recanati",[
 "Giordani va in visita a Recanati e fa una gita a **Macerata** con Leopardi.",
 "È la **prima volta che Giacomo viaggia senza essere accompagnato da un familiare**."
],{k:["gior"],pg:"p. 677"});

N("fuga","v",1819.5,"1819","Malattia agli occhi, fuga mancata","1819: l'anno difficile e la fuga mancata",[
 "Grave **malattia agli occhi**: gli impedisce «qualunque lettura o studio». Con l'insofferenza verso l'ambiente familiare lo porta a meditare spesso il suicidio.",
 "A luglio prepara **in segreto la fuga da Recanati** chiedendo un passaporto per Milano: il piano è scoperto e rinuncia a partire.",
 "Cade in una **disperazione ancora più cupa**; mentre approfondisce il pensiero filosofico (lo Zibaldone) dà avvio al periodo della **grande poesia**: Idilli e altre Canzoni.",
 "Si mette alla ricerca di un lavoro che gli permetta di lasciare Recanati, ma la richiesta del posto di «scrittore di lingua latina» alla Biblioteca Vaticana non viene accolta."
],{k:["convfil","inf","pidilli","zib","padre"],w:"Nel libro il periodo dopo il 1819 è collegato alla richiesta in Vaticana senza una data precisa: non attribuirle un anno.",pg:"p. 677-678"});

N("roma","v",1822.9,"Nov. 1822 - mag. 1823","Roma dagli zii Antici","Roma (novembre 1822 - maggio 1823)",[
 "Ottiene finalmente dal **padre** il permesso di trasferirsi dagli zii Antici a Roma.",
 "Città che lo delude profondamente (lettere al fratello **Carlo**): ambiente letterario romano **mediocre, chiuso e arretrato**.",
 "Delusa anche la speranza di un posto di bibliotecario nella Cancelleria papale.",
 "Maggio 1823: ritorno a Recanati con la consapevolezza di non poter sfuggire alla propria condizione. Il pessimismo si accentua: **Zibaldone** e **Operette morali**, prose e dialoghi filosofici composti in gran parte nel 1824."
],{k:["padre","zib","oper","silenzio","pcosm"],pg:"p. 678"});

N("mil","v",1825.5,"Lug.-sett. 1825","Milano: l'editore Stella","Milano (luglio - settembre 1825)",[
 "L'editore milanese **Stella** gli offre la direzione dell'edizione completa delle opere di **Cicerone**.",
 "Parte a luglio, sostando a **Bologna**, dove rivede Giordani. Resta a Milano fino a fine settembre e visita il vecchio **Vincenzo Monti**."
],{k:["stella","gior","monti","bol"],pg:"p. 678"});

N("bol","v",1825.9,"1825-1826","Bologna (circa un anno)","Bologna (circa un anno, 1825-1826)",[
 "Si ferma circa un anno a Bologna: lavora a un **commento alle Rime di Petrarca** commissionato da Stella.",
 "Frequenta Giordani e vari letterati bolognesi, tra cui il conte **Carlo Pepoli** e la contessa **Teresa Carniani Malvezzi**, della quale si innamora senza essere corrisposto.",
 "Inverno 1826: nuovo ritorno a Recanati. Primavera 1827: seconda permanenza a Bologna."
],{k:["stella","pepoli","malv","gior","silenzio"],pg:"p. 678, 709"});

N("fir1","v",1827.35,"1827","Firenze: Antologia, Manzoni","Firenze (1827)",[
 "Si trasferisce a Firenze: contatti con intellettuali **cattolico-liberali** del gruppo dell'**«Antologia»**, rivista del ricco commerciante ginevrino Giovan Pietro **Vieusseux**.",
 "Conosce l'esule politico napoletano **Antonio Ranieri**, incontra **Alessandro Manzoni** (impegnato nella nuova stesura dei *Promessi sposi*) e lo scrittore francese **Stendhal**.",
 "Giugno 1827: escono a Milano le **Operette morali**, pubblicate da Stella."
],{k:["vieus","ranieri","manzoni","oper27","stella"],pg:"p. 678"});

N("pisa","v",1827.9,"Nov. 1827 - 1828","Pisa: ritrova l'ispirazione","Pisa (da novembre 1827)",[
 "Alla fine del 1827 si stabilisce a **Pisa**: il **clima più mite** e la cordiale accoglienza riducono i suoi disturbi di salute.",
 "**Ritrova l'ispirazione poetica**: nell'aprile 1828 scrive *Il risorgimento* e *A Silvia*, con cui si apre il ciclo dei **Canti pisano-recanatesi**, detti anche **Grandi idilli**."
],{k:["risorg","silvia","gi","silenzio"],pg:"p. 678, 695, 709"});

N("rec3","v",1828.5,"Giu. 1828 - 1830","Ultimo ritorno a Recanati","Ultimo ritorno a Recanati (giugno 1828 - 1830)",[
 "Torna per l'**ultima volta a Recanati**: tra il 1829 e il 1830 compone gli altri Grandi idilli (*Le ricordanze*, *La quiete dopo la tempesta*, *Il sabato del villaggio*, *Canto notturno di un pastore errante dell'Asia*).",
 "Grazie al **gruppo Vieusseux**, che gli offre per un anno un **assegno mensile** in segno di stima, nel 1830 può lasciare definitivamente Recanati."
],{k:["vieus","ricord","quiete","sabato","pastore","fir2"],pg:"p. 678"});

N("fir2","v",1830.5,"1830-1833","Firenze: Canti 1831, Fanny","Firenze (dal 1830)",[
 "Lascia **definitivamente Recanati** e va a Firenze, dove nel **1831** pubblica la raccolta dei **Canti** (prima edizione).",
 "Rafforza l'amicizia con **Ranieri** e si innamora senza fortuna della bellissima ventinovenne **Fanny Targioni Tozzetti** (1801-1889): l'amore ispira il **Ciclo di Aspasia**.",
 "Il secondo soggiorno fiorentino coincide con l'**ultima fase** della sua produzione letteraria."
],{k:["canti31","ranieri","fanny","aspasia","vieus"],pg:"p. 678, 737"});

N("nap","v",1833.8,"Ott. 1833 - 1836","Napoli con Ranieri","Napoli (ottobre 1833)",[
 "In cerca di un **clima più mite**, si stabilisce a Napoli con l'amico Ranieri.",
 "**1835**: firma un contratto per la pubblicazione delle *Opere* in sei volumi. A settembre esce il primo volume con la **seconda edizione dei Canti**; a gennaio 1836 il secondo, con le *Operette morali*.",
 "Entrambi i volumi vengono **sequestrati per ordine del governo borbonico**."
],{k:["ranieri","canti35","oper36","peroico"],pg:"p. 678, 679"});

N("ferr","v",1836.4,"1836-1837","Villa Ferrigni (Vesuvio)","Villa Ferrigni ai piedi del Vesuvio (1836-1837)",[
 "Afflitto da problemi respiratori e per sfuggire a un'**epidemia di colera**, abita a lungo nella **Villa Ferrigni**, fra Torre del Greco e Torre Annunziata, con Ranieri e sua sorella Paolina.",
 "Nel paesaggio di lave vulcaniche e fiori mediterranei scrive il suo **testamento spirituale**: *Il tramonto della luna* e *La ginestra*."
],{k:["ranieri","ginestra","tramonto","morte"],w:"La Paolina di Villa Ferrigni è la sorella di Ranieri, non la sorella di Leopardi (quella delle «Nozze della sorella Paolina»).",pg:"p. 679"});

N("morte","v",1837.45,"14 giu. 1837","Muore a Napoli","Morte (14 giugno 1837)",[
 "Muore **improvvisamente a Napoli** mentre era in procinto di ripartire per Torre del Greco.",
 "Sepolto nella chiesa di **San Vitale a Fuorigrotta**; nel **1839** la salma è traslata a **Mergellina** (Napoli), dove tuttora si trova."
],{k:["ferr","tramonto","ed1845"],pg:"p. 679"});

/* ---------- PERSONE E INFLUENZE ---------- */
N("padre","p",1812,"—","Il padre","Il padre di Leopardi",[
 "Rappresenta le **posizioni politiche conservatrici** da cui Giacomo si distacca, avvicinandosi al patriottismo laico e liberale grazie a Giordani.",
 "Nel novembre 1822 concede finalmente il permesso di andare a Roma dagli zii Antici."
],{k:["gior","roma","cpat","stud"],w:"La formazione voluta dal padre non è nelle tue pagine: vedi la scheda «Infanzia e prime letture» (conoscenza generale).",pg:"p. 677-678, 697"});

N("stael","p",1816.4,"1816","Madame de Staël","Madame de Staël",[
 "Autrice di *Sulla maniera e l'utilità delle traduzioni*, scritto a cui Leopardi risponde con una lettera alla «Biblioteca italiana» (luglio 1816, **non pubblicata**).",
 "Nella lettera Leopardi polemizza con lei esaltando il valore dei classici e il diverso rapporto degli antichi con la natura."
],{k:["conv1","antirom"],pg:"p. 677, 682"});

N("gior","p",1817,"1817","Pietro Giordani","Pietro Giordani",[
 "Scrittore **classicista, contrario alla Restaurazione**. Si accorge del talento del giovane Leopardi nonostante la lettera non pubblicata: nel **1817** inizia tra i due un **rapporto epistolare**.",
 "È il suo **primo amico e sostenitore culturale**. Con lui Leopardi mostra crescente interesse per la letteratura e **abbandona le posizioni politiche del padre**, avvicinandosi al **patriottismo laico e liberale**.",
 "Settembre 1818: visita Recanati (gita a Macerata). Rivisto a Bologna nel 1825 e nel 1826-1827. In una lettera del 1821 Leopardi gli confessa il desiderio di scrivere dialoghi e novelle."
],{k:["conv1","gita18","padre","cpat","mil","bol","oper"],pg:"p. 677, 709, 752"});

N("cassi","p",1817.95,"Dic. 1817","Geltrude Cassi Lazzari","Geltrude Cassi Lazzari",[
 "Cugina del padre, ventiseienne, in visita a Recanati nel dicembre 1817: gli fa **scoprire l'amore**.",
 "Gli ispira l'*Elegia I* (poi *Il primo amore*) e il *Diario del primo amore*."
],{k:["pamore"],pg:"p. 677, 699"});

N("mai","p",1820,"1820","Angelo Mai","Angelo Mai (1782-1854)",[
 "Cardinale, direttore della **Biblioteca Vaticana**: ritrova il *De republica* di **Cicerone**.",
 "Il ritrovamento ispira la canzone *Ad Angelo Mai* (1820). Nel 1821 Leopardi gli scrive anche una lettera per chiedergli un favore (il manoscritto riprodotto nel libro)."
],{k:["cpat"],pg:"p. 694, 697"});

N("didimi","p",1821.7,"1821","Carlo Didimi","Carlo Didimi",[
 "Sportivo recanatese a cui è dedicata *A un vincitore nel pallone* (1821)."
],{k:["cpat"],pg:"p. 697"});

N("paolina","p",1821.8,"1821 e 1828","Paolina, sorella di Leopardi","Paolina, la sorella di Leopardi",[
 "Il suo progetto di matrimonio (poi fallito) ispira la canzone *Nelle nozze della sorella Paolina* (1821).",
 "Il 2 maggio 1828 Leopardi le scrive di aver fatto versi «veramente all'antica» quell'aprile: si riferisce a *Il risorgimento*."
],{k:["cpat","risorg"],w:"Non confonderla con Paolina, sorella di Ranieri (Villa Ferrigni).",pg:"p. 697, 709"});

N("monti","p",1825.6,"1825","Vincenzo Monti","Vincenzo Monti",[
 "Vecchio poeta che Leopardi visita a Milano nell'estate 1825 (il libro rimanda a p. 287)."
],{k:["mil"],pg:"p. 678"});

N("stella","p",1825.4,"1825-1827","Editore Stella","L'editore milanese Stella",[
 "1825: gli offre la direzione dell'**edizione completa delle opere di Cicerone**.",
 "Gli commissiona il **commento alle Rime di Petrarca** (Bologna).",
 "Pubblica a Milano le **Operette morali** (giugno 1827)."
],{k:["mil","bol","oper27"],pg:"p. 678, 752"});

N("pepoli","p",1826,"1826","Conte Carlo Pepoli","Conte Carlo Pepoli (1796-1881)",[
 "Letterato bolognese frequentato nel soggiorno a Bologna.",
 "Destinatario dell'**epistola in endecasillabi** *Al conte Carlo Pepoli* (1826), tra le due sole poesie del periodo di silenzio poetico."
],{k:["bol","silenzio"],pg:"p. 678, 695, 709"});

N("malv","p",1826.2,"1826","Teresa Carniani Malvezzi","Contessa Teresa Carniani Malvezzi (1785-1859)",[
 "Contessa bolognese di cui Leopardi si innamora **senza essere corrisposto**.",
 "L'amore per lei è tra le esperienze che maturano il poeta prima dei Grandi idilli."
],{k:["bol","gi"],pg:"p. 678, 709"});

N("vieus","p",1827.4,"1827-1830","Vieusseux e l'«Antologia»","Giovan Pietro Vieusseux e il gruppo dell'«Antologia»",[
 "**Vieusseux**: ricco commerciante ginevrino, fondatore della rivista **«Antologia»** a Firenze. Nel gruppo, intellettuali **cattolico-liberali**.",
 "Il gruppo offre a Leopardi per un anno un **assegno mensile** «in segno di stima»: nel 1830 può lasciare Recanati per sempre."
],{k:["fir1","rec3","fir2"],pg:"p. 678"});

N("manzoni","p",1827.5,"1827","Manzoni e Stendhal","Alessandro Manzoni e Stendhal",[
 "Incontrati a Firenze. Manzoni è impegnato nella **nuova stesura dei Promessi sposi**; Stendhal è lo scrittore francese.",
 "**Manzoni** è il primo tra i romantici lombardi che concepiscono la poesia con **utilità sociale, educativa e morale**: opposto a Leopardi, per cui la poesia non deve educare."
],{k:["fir1","funz"],pg:"p. 678, 683"});

N("ranieri","p",1827.6,"1827-1845","Antonio Ranieri","Antonio Ranieri (1806-1888)",[
 "**Esule politico napoletano**, conosciuto a Firenze nel 1827. L'amicizia si rafforza a Firenze; nell'**ottobre 1833** Leopardi si stabilisce con lui a **Napoli**.",
 "Nel 1836-1837 vive con lui e con sua sorella Paolina a **Villa Ferrigni**.",
 "Leopardi gli lascia il manoscritto dello **Zibaldone** (circa 4000 pagine in sette taccuini), ma **Ranieri non lo pubblica**.",
 "Cura le **edizioni definitive del 1845**: i **Canti** (41 testi) e le **Operette morali** (24 testi, con la struttura indicata dal poeta prima di morire)."
],{k:["fir1","fir2","nap","ferr","zib","canti45","oper36","ed1845"],w:"Ranieri NON ha pubblicato lo Zibaldone: prima edizione a stampa 1898-1900 (commissione governativa).",pg:"p. 678, 688, 694, 752"});

N("fanny","p",1830.9,"1830-1833","Fanny Targioni Tozzetti","Fanny Targioni Tozzetti (1801-1889)",[
 "Affascinante donna fiorentina di cui Leopardi si innamora senza essere corrisposto. La canta con il nome di **Aspasia**, raffinata cortigiana del V secolo a.C. amata dall'ateniese Pericle.",
 "Non fu una vera relazione amorosa: fu **nuovo lo stato d'animo del poeta**, che riconosce all'amore l'estremo potere (poi rivelatosi illusorio) di riscattare una vita di affanni.",
 "Il **Ciclo di Aspasia** nasce da qui."
],{k:["fir2","aspasia","amorte"],pg:"p. 678, 737"});

N("rousseau","p",1820.5,"Influenza","Rousseau","Jean-Jacques Rousseau",[
 "Secondo lui il **progresso** ha portato **decadenza e corruzione morale**, e la **ragione** è causa dell'infelicità del genere umano perché ci ha allontanato dalla natura.",
 "Leopardi ne subisce l'influsso nella fase del **pessimismo storico** (fino al 1822 circa)."
],{k:["psto"],pg:"p. 683 (rimando a p. 125)"});

N("vico","p",1818.9,"Influenza","Vico","Giambattista Vico",[
 "Filosofo napoletano: per lui l'**arte si associa all'età storica caratterizzata da fantasia e sentimento**.",
 "Influenza le affermazioni di Leopardi sulla superiorità della poesia antica nel *Discorso*."
],{k:["antmod"],pg:"p. 682 (rimando a p. 26)"});

N("schiller","p",1818.95,"Influenza","Schiller","Friedrich Schiller",[
 "Nel trattato *Sulla poesia ingenua e sentimentale* (1796) aveva già distinto i **due tipi di poesia**, antica e moderna."
],{k:["antmod"],pg:"p. 682 (rimando a p. 287)"});

N("schop","p",1820.8,"Confronto","Schopenhauer","Arthur Schopenhauer",[
 "Filosofo tedesco spesso accostato a Leopardi. In *Il mondo come volontà e rappresentazione* (1818) afferma che il **piacere è solo una momentanea cessazione del dolore**, a cui però subentra la **noia** o altro dolore.",
 "Riflessione molto vicina alla teoria del piacere di Leopardi."
],{k:["piacere"],pg:"p. 684"});

N("luciano","p",1823.6,"Fonte","Luciano di Samòsata","Luciano di Samòsata (121-181 circa)",[
 "Scrittore greco, noto per i **Dialoghi**: scenette ambientate sull'Olimpo o nell'Ade per deridere i vizi umani. Tono umoristico e satirico.",
 "Da lui Leopardi riprende **sarcasmo pungente**, gusto per il **paradosso**, invenzione fantastica, varietà di registri.",
 "Altre fonti delle Operette: saggistica e narrativa filosofica degli **illuministi francesi** (Diderot, Voltaire), raccolte di detti memorabili, elogio, frammento apocrifo."
],{k:["oper"],pg:"p. 752, 756"});

/* ---------- PENSIERO ---------- */
N("antirom","f",1816.6,"1816-1818","Antiromantico e anticlassicista","Antiromantico e anticlassicista (1816-1818)",[
 "La lettera del **18 luglio 1816** anticipa il *Discorso di un italiano intorno alla poesia romantica* (1818).",
 "**Contro i romantici**: condanna l'introduzione in Italia dei modelli della letteratura nordica.",
 "**Contro i classicisti**: respinge il principio di imitazione, l'abuso della mitologia, le regole dei generi letterari; esalta ciò che è **spontaneo e originario**.",
 "**Punti in comune con i romantici**: esaltazione dell'io, vita come dolore, aspirazione a una dimensione infinita che si scontra con la limitatezza della realtà, **titanismo** (soprattutto nell'ultima fase)."
],{k:["stael","conv1","antmod","funz","cpat"],pg:"p. 682"});

N("antmod","f",1818.5,"1818","Poesia antica e moderna","Poesia degli antichi e dei moderni",[
 "**Antichi** (vicini alla natura incontaminata, liberi dalla ragione): poesia di **fantasia e immaginazione**, qualità dei primitivi e dei fanciulli. Hanno creato miti e favole, cioè le **«illusioni»** che rivestono la dura realtà e nascondono il **«vero»**.",
 "La **ragione** ha rotto l'equilibrio tra uomo e natura: le illusioni sono cadute e si è svelata l'inutilità dell'esistenza. Ragione e «vero» sono diventati oggetto della poesia e hanno distrutto l'immaginazione.",
 "**Moderni**: compito di tornare a una poesia **«sentimentale»**, legata alla realtà interiore, che recupera attraverso il **ricordo** la poeticità delle sensazioni della fanciullezza.",
 "Ciò che si presenta in **modo indeterminato** stimola la fantasia. La **«rimembranza»** rende vaga e lirica la realtà vissuta, anche se dolorosa."
],{k:["antirom","vico","schiller","indef","piacere","inf"],pg:"p. 682-683"});

N("funz","f",1820,"Funzione","Funzione della poesia","La funzione della poesia",[
 "Per **Manzoni** e i romantici lombardi la letteratura deve avere utilità sociale, educativa e morale, ispirarsi alla verità, alla storia e alle tradizioni nazionali e popolari (forme narrative).",
 "Per **Leopardi** l'adesione al «vero» spegne ogni fantasia: la poesia più «vera» nasce dal **ricordo del passato, dell'infanzia e della giovinezza**.",
 "**La poesia non deve educare, ma illudere e dare piacere.** Per questo privilegia la **poesia lirica**, espressione naturale e immediata degli stati d'animo dell'io."
],{k:["manzoni","antirom"],pg:"p. 683"});

N("indef","f",1819.3,"1819-1821","Poetica dell'indefinito","Poetica dell'indefinito e della rimembranza",[
 "Sensazioni **visive e uditive indefinite**, suscitate soprattutto dalla **notte e dalla luna**, alimentano l'immaginazione.",
 "Stile ricco di **parole vaghe e indefinite** (per esempio «infinito», «immensità», «lontan»). Nello Zibaldone spiega che esistono parole più poetiche perché rimandano all'idea di vago e di indefinito, e le elenca.",
 "Il paesaggio esterno diventa **paesaggio interiore** a cui si associa la riflessione filosofica."
],{k:["antmod","inf","lluna","sera","pidilli","zib"],pg:"p. 699-700"});

N("convfil","f",1819.6,"1819-1821","Conversione «dal bello al vero»","Seconda conversione: «dal bello al vero» (1819-1821)",[
 "È la **conversione filosofica**: passaggio dalla poesia alla filosofia.",
 "Porta al **definitivo distacco dalla religione**, all'adesione alla **filosofia sensistica e materialistica** e all'elaborazione di un pensiero **fortemente pessimistico**.",
 "Tra il 1819 e il 1823 prende definitivamente le distanze dalla religione e aderisce al **materialismo**: pensa che il cristianesimo, nonostante la grande forza illusoria, non abbia reso l'umanità meno infelice, e che l'etica cristiana (umiltà, rassegnazione) abbia come conseguenza l'annullamento delle energie vitali."
],{k:["fuga","piacere","psto","zib","conv1"],pg:"p. 677, 737-738"});

N("piacere","f",1820.55,"Da luglio 1820","Teoria del piacere","La teoria del piacere (esposta nello Zibaldone)",[
 "Nasce da dolore fisico, disagio familiare e insofferenza per Recanati; formulata **dal luglio 1820**.",
 "Il materialismo settecentesco negava la dimensione spirituale; Leopardi cerca di **conciliare bisogni materiali e aspirazione alla felicità assoluta**.",
 "La natura genera l'**amore di sé**: l'individuo aspira a un **piacere infinito** in durata ed estensione. Ma il piacere reale è sempre **finito** (limitato in quantità o qualità).",
 "Da questa **«contraddizione spaventevole»** deriva che l'unico piacere è **immaginare la realizzazione dei desideri** più che ottenerla. Conseguenza: la **noia**, il vuoto prodotto da una tensione inappagata."
],{k:["zib","sabato","quiete","venditore","schop","oper","nasc","antmod"],pg:"p. 683-684, 753"});

N("psto","f",1820.9,"Fino al 1822","Pessimismo storico","Pessimismo storico: la natura «benigna» (fino al 1822 circa)",[
 "La decadenza della società moderna come **effetto di un processo storico** (influsso di **Rousseau**).",
 "La **natura** è «benigna» e protettiva: dà vigore fisico e mentale, suscita generose e magnanime **illusioni**, è alla base delle virtù morali e civili. Si contrappone alla **ragione** e alla società corrotta, dominata da egoismo e ricerca dei beni materiali.",
 "Gli **antichi**, in comunione con la natura, vivevano di illusioni e sentimenti generosi ed erano capaci di azioni eroiche e disinteressate.",
 "Opere: **Piccoli idilli** (il dolore è alleviato dalle illusioni fornite dalla natura, come immaginazione e ricordo) e **Canzoni civili** (passato eroico come modello)."
],{k:["rousseau","crisi","cpat","coro","pidilli","convfil"],pg:"p. 683-684, 697"});

N("crisi","f",1821.6,"1821-1822","Da natura benigna a matrigna","Crisi del pessimismo storico: da «benigna» a «matrigna»",[
 "Cambia la concezione della natura, da madre **«benigna»** a **«matrigna»**.",
 "Dall'opposizione **natura-ragione** (età dell'oro contrapposta alla modernità) all'opposizione **natura-umanità**: gli esseri umani sono vittime innocenti di un inganno crudele.",
 "Cadono le illusioni: anche l'eroico passato di Grecia e Roma è ricondotto al **comune destino di dolore** del genere umano.",
 "La grandezza d'animo si misura nelle **scelte eroiche**: **Bruto** e **Saffo**."
],{k:["psto","pcosm","csuic","cpat"],pg:"p. 697-698"});

N("pcosm","f",1823.3,"1823-1828","Pessimismo cosmico","Pessimismo cosmico: la natura indifferente (1823-1828)",[
 "Tra il 1823 e il 1828, lungo **silenzio poetico** e scrittura delle **Operette morali**: visione filosofica ancora più sconsolata. Il ritorno alla poesia con i **Grandi idilli** è segnato dal passaggio dal pessimismo storico a quello cosmico.",
 "Il **male è intrinseco all'esistenza** («arido vero»). La natura è **matrigna e indifferente**: il dolore riguarda l'intero genere umano, specie non privilegiata e trascurabile nell'universo.",
 "Respinge ogni conforto derivante da una concezione **finalistica o provvidenziale**.",
 "L'antitesi natura-ragione diventa **natura-umanità**: gli esseri umani sono vittime innocenti di un inganno crudele (vedi «Da natura benigna a matrigna»)."
],{k:["silenzio","oper","gi","crisi","peroico","ricord","pastore"],w:"Il passaggio dall'antitesi natura-ragione a natura-umanità è chiarito a p. 698: vedi la scheda «Da natura benigna a matrigna».",pg:"p. 684, 709, 738, 752"});

N("peroico","f",1832.3,"1832-1837","Pessimismo eroico e satira","L'ultimo Leopardi: pessimismo eroico, satira, solidarietà",[
 "A Napoli (1833-1837) unisce la **satira** per criticare l'**ottimismo ideologico** del suo tempo, «superbo e sciocco».",
 "Rifiuta l'assolutismo delle idee metafisiche e i facili miti della scienza. Li sostituisce con una **moralità laica di solidarietà sociale**, senza i tratti eroici e individualistici di una sfida, ma come atteggiamento comune di tutta l'umanità.",
 "**Progresso fondato sul pessimismo**, con nuova vitalità e volontà di lotta: la **«social catena»**.",
 "Anticipato dal *Dialogo di Tristano e di un amico* (1832), che coincide con il **«pessimismo eroico»**."
],{k:["tristano","palin","parali","ginestra","pcosm","nap"],pg:"p. 738-739"});

/* ---------- CANTI ---------- */
N("cstr","c",1817,"1817-1837","I Canti: struttura","I Canti (1817-1837): la raccolta e la struttura",[
 "Raccolta delle poesie, **capolavoro** di Leopardi. Le liriche sono ordinate sia per **ordine cronologico di stesura** (dal 1817, *Il primo amore*, alle ultime settimane di vita, *Il tramonto della luna*) sia per **genere** (canzoni, idilli) e per **elementi stilistici e tematici**.",
 "**Sezioni**: Canzoni civili e filosofiche (1817-1822), Piccoli idilli (1819-1821), Grandi idilli (1828-1830), Ciclo di Aspasia (1831-1836) e ultimi componimenti (impegno morale, solidarietà, satira contro la cultura contemporanea).",
 "Tre edizioni curate: 1831 (Firenze, 23 liriche), 1835 (Napoli, 39), 1845 (postuma, 41)."
],{k:["canti31","canti35","canti45","cpat","pidilli","gi","aspasia","ginestra"],pg:"p. 694-695"});

N("pamore","c",1817.9,"1817","Il primo amore","Il primo amore (1817)",[
 "**Elegia-cerniera** tra Canzoni e Piccoli idilli: primo componimento in ordine cronologico, ma posto tra le *Canzoni civili e filosofiche* e i *Piccoli idilli*, che hanno carattere più **soggettivo** con protagonista l'io lirico.",
 "Esprime la **delusione per l'amore impossibile** per la cugina **Geltrude Cassi**. Conclude la prima fase dell'attività letteraria."
],{k:["cassi","cpat","pidilli","cstr"],pg:"p. 699-700"});

N("cpat","c",1818,"1818-1821","Canzoni patriottiche","Canzoni civili e filosofiche: le patriottiche (1818-1821)",[
 "Leopardi si rammarica per la **decadenza dell'Italia** e vuole valorizzare le **virtù degli antichi** come modelli per l'educazione. Stile ricercato e classicheggiante, temi storico-mitologici o politici.",
 "***All'Italia*** (1818): sottomissione al **dominio straniero**, confronto tra presente e passato eroico di Grecia e Roma. In piena Restaurazione: distacco dal padre e adesione alle **idee democratiche e repubblicane**. Poesia **eternatrice** di ideali; titanismo.",
 "***Sopra il monumento di Dante*** (1818): lamenta le miserie dell'Italia e sprona a prendere esempio dai grandi del passato.",
 "***Ad Angelo Mai*** (1820): ispirata dal ritrovamento del *De republica* di Cicerone; confronta il coraggio degli intellettuali del passato (Dante, Petrarca, Colombo, Ariosto, Tasso, Alfieri) con il torpore della Restaurazione, «secol di fango».",
 "Autunno 1821: ***Nelle nozze della sorella Paolina*** (donne italiche: preferire figli infelici ma forti, pronti a combattere per la libertà) e ***A un vincitore nel pallone*** (i giochi ginnici dei greci erano addestramento alle armi)."
],{k:["mai","didimi","paolina","padre","psto","antirom","cstr","pamore"],pg:"p. 694, 697-698"});

N("csuic","c",1821.5,"1821-1822","Canzoni del suicidio","Le canzoni del suicidio: Bruto minore e Ultimo canto di Saffo",[
 "*Bruto minore* (1821) e *Ultimo canto di Saffo* (1822): composte quando matura il cambiamento nella concezione della natura, da «benigna» a «matrigna» (**crisi del pessimismo storico**).",
 "**Bruto**: nel 44 a.C. guida la congiura contro Giulio Cesare, nemico dei valori della Roma repubblicana; due anni dopo è sconfitto a Filippi da Ottaviano e Antonio e si uccide davanti al crollo degli ideali di libertà e giustizia. Suicidio come **scelta titanica di libertà e di giustizia**.",
 "**Saffo** (VII-VI secolo a.C.): animo stupendo in un brutto corpo, ama Faone senza essere ricambiata. Suicidio come **ribellione al destino** che l'ha esclusa da armonia, bellezza, amore e piaceri della vita."
],{k:["crisi","psto","coro"],pg:"p. 697-698"});

N("coro","c",1822,"1822","Canzoni dell'età dell'oro","Le canzoni sull'età dell'oro (1822)",[
 "*Alla Primavera, o delle favole antiche* (in prospettiva classica) e *Inno ai Patriarchi, o de' principii del genere umano* (in chiave cristiana).",
 "Celebrano la mitica **età dell'oro**, quando la natura era incontaminata e gli esseri umani vivevano in armonia con essa.",
 "Idea comune: la **felicità appartiene all'età dell'immaginazione e dell'infanzia**; i moderni hanno perso quella visione fanciullesca. Testimonianze del pessimismo storico."
],{k:["psto","csuic","antmod"],pg:"p. 697-698"});

N("pidilli","c",1819,"1819-1821","Piccoli idilli","I Piccoli idilli (1819-1821)",[
 "Abbandonata l'ispirazione classica per temi più **personali e intimi**, alla ricerca di un nuovo stile. Leopardi li definì «esperimenti, situazioni, affezioni, avventure storiche del mio animo».",
 "Scritti nello stesso periodo delle Canzoni civili e filosofiche. Al posto dei miti eroici e dello stile solenne: **discorso lirico-soggettivo, intimo e quotidiano**, componimenti più brevi e strutture più agili. Ricchi di **motivi paesaggistici** e **riflessioni autobiografiche**.",
 "Rielabora con originalità il genere dell'idillio (per i greci solo descrizione del paesaggio in armonia con la natura): in Leopardi la percezione visiva e uditiva è occasione per una poesia dell'**immaginazione, del sentimento, della rimembranza e dell'indefinito**. Subentra il **paesaggio interiore**, con riflessione filosofica.",
 "Il poeta si rappresenta attraverso il ricordo dei luoghi e dei momenti vissuti a **Recanati**: riflessioni esistenziali serene e pacate; la lontananza temporale addolcisce il ricordo.",
 "*Il passero solitario* (1831-1835), composto dopo, doveva essere inserito prima di questo gruppo nell'edizione definitiva perché riconducibile agli anni giovanili."
],{k:["inf","lluna","sera","sogno","vitasol","indef","pamore","psto","passero","cstr"],pg:"p. 694, 699-700"});

N("inf","c",1819.1,"1819","L'infinito","L'infinito (1819)",[
 "Una **siepe** impedisce di vedere parte del paesaggio e spinge il poeta a **immaginare un mondo lontano, sconfinato e immobile**.",
 "Il fruscio del vento tra le foglie stimola il confronto tra il tempo presente e le età passate sepolte nel **silenzio infinito**."
],{k:["pidilli","indef","antmod"],pg:"p. 700 (testo T3, p. 701)"});

N("lluna","c",1819.3,"1819","Alla luna","Alla luna (1819)",[
 "La contemplazione della luna abbellisce poeticamente le **riflessioni sul ricordo**, che come l'immaginazione abbellisce il passato, anche se è stato triste."
],{k:["pidilli","indef"],pg:"p. 700 (testo T4, p. 705)"});

N("sera","c",1820,"1820","La sera del dì di festa","La sera del dì di festa (1820)",[
 "Si apre con la descrizione del **notturno lunare**, in stile vago e indeterminato. Sulle note di un canto solitario che si spegne a poco a poco sviluppa il motivo dell'**infelicità e della solitudine** e medita sulla vanità delle cose umane."
],{k:["pidilli","indef"],pg:"p. 700 (testo T1, p. 673)"});

N("sogno","c",1820.3,"1820","Il sogno","Il sogno (1820)",[
 "Immagina l'incontro con una **fanciulla morta** e amata in passato, simbolo del **crollo delle speranze giovanili**."
],{k:["pidilli"],pg:"p. 700"});

N("vitasol","c",1821,"1821","La vita solitaria","La vita solitaria (1821)",[
 "L'io lirico cammina **solitario nei boschi** al chiaror della luna, riflettendo sulla propria **condizione esistenziale**."
],{k:["pidilli"],pg:"p. 700"});

N("silenzio","c",1823.5,"1823-1828","Silenzio poetico","Il silenzio poetico (1823-1828)",[
 "Tra i Piccoli idilli e i Canti pisano-recanatesi, Leopardi compone solo due poesie: *Alla sua donna* (1823) e l'epistola in endecasillabi *Al conte Carlo Pepoli* (1826). Si concentra sulla **prosa delle Operette morali**.",
 "Intanto matura una **trasformazione umana e culturale**: allontanamento provvisorio da Recanati e deludente esperienza romana; incontri a Bologna con Giordani e amore per la Malvezzi; ampliamento delle relazioni sociali e frequentazione del gruppo dell'Antologia a Firenze; riflessione ideologica e stesura della maggior parte delle Operette; trasferimento a Pisa.",
 "La nuova concezione pessimistica della natura impediva l'espressione dei sentimenti e dell'immaginazione: nasce così la prosa filosofica."
],{k:["roma","bol","pepoli","malv","fir1","oper","pisa","pcosm","gi"],w:"Il libro data il silenzio 1823-1828 (p. 752) e «dal 1822 al 1828 solo due poesie» (p. 695): stesso periodo, conteggio diverso perché Saffo è del 1822.",pg:"p. 695, 709, 752"});

N("gi","c",1828.2,"1828-1830","Grandi idilli","I Grandi idilli, o Canti pisano-recanatesi (1828-1830)",[
 "**Fonte del sentimento poetico**: la **«rimembranza»**, in sé dolce ma anche dolorosa. Alla dolcezza del ricordo si unisce la cognizione del presente e delle **perdute illusioni giovanili**.",
 "Immagini liete create dalla memoria, ma accompagnate dalla crudezza dell'**«acerbo vero»** e da un sistema filosofico di **pessimismo cosmico**: il dolore non riguarda più solo l'individuo, ma l'intero genere umano, vittima dell'indifferenza della natura.",
 "**Forma**: **canzone libera**, mista di endecasillabi e settenari, e più lunghi dei Piccoli idilli (da qui «Grandi»).",
 "Comprende: *Il risorgimento*, *A Silvia* (1828), *Le ricordanze*, *La quiete dopo la tempesta*, *Il sabato del villaggio* (1829), *Canto notturno* (1830); fase a cui appartiene anche *Il passero solitario*.",
 "**Maturazione** dovuta a: allontanamento da Recanati e delusione romana; Giordani e Malvezzi a Bologna; gruppo dell'Antologia a Firenze; stesura delle Operette; Pisa."
],{k:["pisa","risorg","silvia","ricord","quiete","sabato","pastore","passero","pcosm","silenzio","malv"],pg:"p. 695, 709, 711"});

N("risorg","c",1828.3,"Apr. 1828","Il risorgimento","Il risorgimento (aprile 1828)",[
 "Il 2 maggio 1828 scrive alla sorella Paolina: «dopo due anni ho fatto dei versi quest'aprile».",
 "Rivivono nel cuore del poeta le **speranze**, i «dolci affanni», il sentimento del dolore. Enumera le sventure dell'**«infausta verità»** (indifferenza della natura, assenza di pietà, ignoranza del «tristo secolo», silenzio degli spazi siderali), ma nota con stupore che sente ancora rivivere in sé gli inganni.",
 "**Rinascita delle emozioni**."
],{k:["gi","pisa","paolina"],pg:"p. 709, 711"});

N("silvia","c",1828.45,"1828","A Silvia","A Silvia (1828)",[
 "Uno dei capolavori: sintesi di **autobiografia, meditazione e incanto lirico**.",
 "Rievoca una fanciulla contenta «di quel vago avvenir», **morta prematuramente**: simbolo della **speranza di felicità delusa dall'amara realtà** («All'apparir del vero»). Tema: la **rimembranza** e la caduta delle illusioni giovanili."
],{k:["gi","pisa","ricord"],pg:"p. 709, 711 (testo T5, p. 712)"});

N("ricord","c",1829,"1829","Le ricordanze","Le ricordanze (1829)",[
 "Il poeta osserva dalle finestre del **palazzo paterno** le stelle dell'Orsa Maggiore ed è assalito dai **ricordi dell'infanzia**, che si sovrappongono alle immagini del presente.",
 "Amare riflessioni sulla **caducità della speranza** e **rimpianto di un passato perduto**: la morte della giovanissima amata **Nerina** (probabilmente un altro nome della Silvia dell'idillio precedente).",
 "Resta la **consolazione della poesia**, che nasce dal ricordo e dall'atmosfera di vaghezza."
],{k:["gi","silvia","rec3","pcosm"],pg:"p. 710-711"});

N("quiete","c",1829.2,"1829","La quiete dopo la tempesta","La quiete dopo la tempesta (1829)",[
 "Apre con quadri di vita paesana (il borgo che riprende dopo un temporale). La strofa conclusiva svela la **teoria del piacere negativo**: il piacere è **«figlio d'affanno»**.",
 "Come la «quiete» dopo la «tempesta», la **fine di un dolore** procura una **momentanea consolazione**, un effimero conforto."
],{k:["gi","piacere","sabato"],pg:"p. 710-711 (testo T6, p. 719)"});

N("sabato","c",1829.4,"1829","Il sabato del villaggio","Il sabato del villaggio (1829)",[
 "Incentrato sulla **felicità del sabato**, che risulterà vana quando arriverà la domenica con la noia e il pensiero già rivolto alle fatiche del lunedì.",
 "Rappresentazione della teoria del piacere: **l'attesa del piacere è superiore al suo raggiungimento**."
],{k:["gi","piacere","quiete","venditore"],pg:"p. 710-711 (testo T7, p. 722)"});

N("pastore","c",1830,"1830","Canto notturno di un pastore","Canto notturno di un pastore errante dell'Asia (1830)",[
 "Al motivo della ricordanza subentra l'**aspirazione universale a comprendere il significato dell'esistenza**.",
 "Un umile **pastore**, portavoce del poeta, chiede alla silenziosa **Luna** quale senso abbia la vita, che si svolge sempre uguale come il cammino dell'astro, comincia nel dolore della nascita e finisce nel nulla della morte. Non ci sono risposte.",
 "Si rivolge al **gregge** per conoscere la ragione della sua serenità inconsapevole; ipotizza che sarebbe stato più felice da uccello, ma respinge subito l'idea: tutti gli esseri viventi sono condannati a un **viaggio senza senso in un universo indifferente**."
],{k:["gi","pcosm","rec3"],pg:"p. 710-711 (testo T8, p. 727)"});

N("passero","c",1833,"1831-1835","Il passero solitario","Il passero solitario (1831-1835)",[
 "Posto dal poeta prima dei Piccoli idilli, ma appartiene alla fase dei Grandi idilli per estensione e per la **canzone libera**. Canto della **solitudine giovanile**, con corrispondenza tra ambiente esterno e condizione dell'animo.",
 "Il poeta si immedesima in un **passero solitario** che canta da un'antica torre: come lui non partecipa alla vita gioiosa e all'amore dei ragazzi del borgo durante la festa.",
 "Ma la solitudine del passero è **istinto naturale** e non avrà rimpianti; il poeta sa che **rimpiangerà la giovinezza** di cui non ha goduto.",
 "Riconducibile agli anni giovanili: dolore inteso come **destino personale** e non inevitabile sorte per tutti, come il poeta riterrà a partire dal 1824."
],{k:["pidilli","gi"],pg:"p. 694, 710-711 (testo T9, p. 733)"});

N("aspasia","c",1831,"1831-1834","Ciclo di Aspasia","Il Ciclo di Aspasia: poesia anti-idillica (1831-1834)",[
 "Cinque canti ispirati all'amore, mai corrisposto, per **Fanny Targioni Tozzetti**, cantata come Aspasia.",
 "**Poesia anti-idillica**: non più basata su sogni e desideri ingannevoli della giovinezza recuperati dalla memoria, ma **combattiva ed energica**, sempre più cosciente del proprio valore artistico ed esistenziale.",
 "L'amore come **estremo potere**, poi rivelatosi illusorio, di riscattare una vita di affanni (già affermato nella *Storia del genere umano*, prima delle Operette).",
 "I cinque canti: *Il pensiero dominante*, *Amore e Morte*, *Consalvo*, *A se stesso*, *Aspasia*."
],{k:["fanny","fir2","pdom","amorte","consalvo","asestesso","aspasia34","sgu"],w:"Nel testo di p. 695 il Ciclo comprende anche *Il tramonto della luna*; a p. 737 i canti sono cinque, senza il Tramonto.",pg:"p. 695, 700, 737, 739"});

N("pdom","c",1831,"1831","Il pensiero dominante","Il pensiero dominante (1831)",[
 "L'**amore** è visto come l'**unica potenza capace di sconfiggere il tempo**."
],{k:["aspasia"],pg:"p. 737, 739"});

N("amorte","c",1832,"1832","Amore e Morte","Amore e Morte (1832)",[
 "Le due entità sono **fratelli** che generano coraggio ed **eroica determinazione** («le sole cose belle che ha il mondo», scrisse a Fanny nel 1831).",
 "La **Morte** è una fanciulla bellissima che fa cessare ogni dolore a chi ha il coraggio di contemplarla senza viltà; l'**Amore**, sempre unito a lei, è l'unica consolazione concessa al genere umano.",
 "L'amore non è più un'illusione giovanile, ma un sentimento che dà la forza di affrontare natura, destino e morte."
],{k:["aspasia","fanny"],pg:"p. 737"});

N("consalvo","c",1832.3,"1832","Consalvo","Consalvo (1832)",[
 "**Novella in versi** di intonazione patetica e sentimentale: culmine nel **bacio** che l'innamorato, morente, ottiene confessando alla donna il proprio amore."
],{k:["aspasia"],pg:"p. 737"});

N("asestesso","c",1833,"1833","A se stesso","A se stesso (1833)",[
 "**Brusca interruzione del sentimento** verso una donna concreta: **morte le speranze** dell'amore e il desiderio di altri inganni. L'io lirico invita il proprio cuore a **riposare per sempre**, in una **virile rinuncia a ogni desiderio vitale**.",
 "Linguaggio **duro, aspro e spezzato**."
],{k:["aspasia"],pg:"p. 737 (testo T13, p. 773)"});

N("aspasia34","c",1834,"1834","Aspasia","Aspasia (1834)",[
 "Leopardi si rivolge alla donna un tempo amata e ne evoca il volto. Emerge la **consapevolezza negativa di aver amato** non una donna vera, ma una sua **«eccelsa imago»**, una rappresentazione creata dal proprio cuore.",
 "Al sorriso amaro per la propria infelicità si accompagna la **rivendicazione della propria solitaria libertà**."
],{k:["aspasia","fanny"],pg:"p. 737"});

N("sepolcrali","c",1834.1,"1834","Canzoni sepolcrali","Le canzoni sepolcrali (1834)",[
 "*Sopra un bassorilievo antico sepolcrale* e *Sopra il ritratto di una bella donna*.",
 "Manifestano una **tensione agonistica**, tipica dell'ultima fase."
],{k:["peroico"],pg:"p. 695, 738"});

N("palin","c",1835.3,"1835","Palinodia a Gino Capponi","Palinodia al marchese Gino Capponi (1835)",[

],{k:["peroico","tristano","parali"],pg:"p. 695, 738-739"});

N("parali","r",1836,"1831-1842","Paralipomeni della Batracomiomachia","Paralipomeni della Batracomiomachia (1831-1842)",[
 "Poemetto **non incluso nei Canti**: iniziato a Firenze nel 1831, ultimato poco prima della morte, **pubblicato postumo a Parigi nel 1842**.",
 "**Satira politica** contro l'assolutismo borbonico e gli intellettuali liberali, e **satira metafisica** contro la fede in una vita oltremondana. Aspra derisione dell'intero sistema sociale, della storia, dell'agire umano.",
 "La battaglia tra topi e rane allude allo scontro tra i **liberali italiani e l'esercito austriaco**. Prosegue la *Batracomiomachia* omerica che Leopardi aveva tradotto."
],{k:["peroico","palin","conv1"],pg:"p. 738-739"});

N("ginestra","c",1836.3,"Primavera 1836","La ginestra","La ginestra o il fiore del deserto (primavera 1836)",[
 "**Ultima grande composizione**: il **testamento spirituale** e il **testamento letterario e filosofico**. Canto polemico contro ogni forma di **fiducia religiosa** e contro la vana e folle **superbia antropocentrica**.",
 "Idea di **progresso fondata non sull'ottimismo ma sul pessimismo**, animata da nuova vitalità e volontà di lotta. Bisogna accettare con coraggio la verità della propria mancanza di significato nell'universo e stringersi in una **«social catena»**: un **patto di solidarietà** contro la minaccia della natura, le sopraffazioni e le ingiustizie sociali.",
 "**Allegoria**: la ginestra fiorisce anche nei deserti di lava del Vesuvio. È la **pietà** che consola gli esseri perseguitati dalla natura; la **vita che resiste** alla distruzione; il **giusto atteggiamento dell'intellettuale**: accetta dignitosamente la morte ma sa tornare a rifiorire tra la lava.",
 "Chiude idealmente la raccolta dei Canti."
],{k:["peroico","ferr","tramonto","cstr"],pg:"p. 695, 738-739 (testo T10, p. 740)"});

N("tramonto","c",1837.3,"1837","Il tramonto della luna","Il tramonto della luna (1837)",[

],{k:["ferr","ginestra","morte","cstr"],pg:"p. 679, 694-695"});

/* ---------- PROSE E EDIZIONI ---------- */
N("zib","r",1817,"1817-1832","Zibaldone","Lo Zibaldone (1817-1832)",[
 "Contemporaneamente **cronaca e autobiografia**, raccolta di appunti e pensieri: critica letteraria, schede filologiche sui classici e sulle letterature moderne, progetti di opere, abbozzi di componimenti poetici, dubbi e ricerche.",
 "**Manoscritto**: circa **4000 pagine in sette taccuini**, lasciato a Ranieri che però non lo pubblicò.",
 "**Fasi**: 1819-1821 principi fondamentali della poetica; 1822-1824 annotazioni filologico-linguistiche (soprattutto etimologiche) e temi filosofici ed etici per le Operette; 1826-1828 approfondimento del problema dell'**infelicità umana** (pessimismo radicale, sofferenza fisica e psicologica).",
 "**Stile**: scorrevole, a volte schematico; ogni riflessione è datata (anno, mese, giorno); abbreviazioni («ec. ec. ec.», «p. e.», «v.»), annotazioni, frasi sospese: scrittura non rivista, **a uso esclusivamente personale**.",
 "**Titoli**: *Pensieri di varia filosofia e di bella letteratura* (prima edizione a stampa, commissione governativa 1898-1900); *Zibaldone di pensieri*, titolo dato dal poeta nel 1827, compare per la prima volta nell'edizione del **1937**: indica «un piatto fatto con molti ingredienti», cioè il carattere disorganico e miscellaneo."
],{k:["conv1","ranieri","piacere","indef","oper","zib1898","zib1937","convfil"],pg:"p. 688-689 (testo T2, p. 689)"});

N("oper","r",1824,"1824","Operette morali","Le Operette morali (1824)",[
 "Dopo Canzoni civili e Piccoli idilli inizia un periodo di **silenzio poetico (1823-1828)**: la nuova concezione pessimistica della natura impediva l'espressione dei sentimenti e dell'immaginazione. Nasce così la **prosa filosofica**: attraverso l'analisi dell'**«arido vero»** Leopardi arriva a concludere che il **male è intrinseco all'esistenza**.",
 "Scritte in gran parte tra **gennaio e novembre 1824 a Recanati**: **24 testi in prosa** di argomento filosofico, prevalentemente satirici, in forma di **dialogo**, ma anche di discorso o narrazione. Espongono in modo organico le riflessioni sparse nello Zibaldone.",
 "**Fonti**: la satira greca e latina (**Luciano di Samòsata**), la saggistica e la narrativa filosofica degli illuministi francesi (Diderot, Voltaire), i detti memorabili, l'elogio, il frammento apocrifo.",
 "**Temi**: elogio del mondo antico e natura «matrigna»; teoria del piacere e noia; derisione dell'ottimismo antropocentrico; solidarietà tra gli esseri umani e rifiuto del suicidio; morte come cessazione del dolore; difesa della propria opera e rifiuto di ogni inganno intellettuale. Atteggiamento dignitoso e coraggioso (*Tristano*) o ironico distacco (*Venditore d'almanacchi*).",
 "**Personaggi**: individui comuni, esseri fantastici (folletto, gnomo), animali, scrittori (Tasso, Parini), personaggi d'invenzione (Malambruno, Farfarello), mitologia (Ercole, Atlante, Prometeo), scienza (Copernico), storia (Colombo), filosofia (Plotino, Porfirio), personificazioni (Natura, Morte, Moda).",
 "**Struttura**: opera unitaria, collegata da rinvii tematici; l'ordine del 1845 è quello previsto da Leopardi e segue quasi la cronologia di stesura."
],{k:["silenzio","pcosm","luciano","roma","oper27","oper34","oper36","ed1845","sgu","isl","plot","copernico","venditore","tristano","gior","piacere","zib"],pg:"p. 752-756",rows:[
 ["Storia del genere umano (1824)","Narrazione allegorica e mitica delle vicende dell'umanità, in varie epoche, tutte segnate dalla tragica ricerca della felicità."],
 ["Dialogo di Ercole e di Atlante (1824)","Atlante confida che il mondo si è fatto leggero: l'umanità ha perso ogni peso morale e non si sveglia dal torpore intellettuale."],
 ["Dialogo della Moda e della Morte (1824)","Sorelle: entrambe mirano «a disfare e rimutare» la vita umana; la Moda fa patire torture materiali e spirituali."],
 ["Proposta di premi fatta dall'Accademia dei Sillografi (1824)","Ironia sul progresso: si propone l'invenzione di «automati», creature dotate di amicizia e fedeltà, virtù predicate ma di cui gli uomini sono privi."],
 ["Dialogo di un Folletto e di uno Gnomo (1824)","Illusione antropocentrica: l'estinzione umana non ha avuto conseguenze e la natura prosegue come se nulla fosse."],
 ["Dialogo di Malambruno e di Farfarello (1824)","Impossibilità della felicità: per attenuare le sofferenze resta solo estraniarsi dalla vita e rinunciare all'amore di sé."],
 ["Dialogo della Natura e di un'Anima (1824)","Più grande è l'individuo, più intensa la ricerca di piacere e l'infelicità."],
 ["Dialogo della Terra e della Luna (1824)","Gli esseri umani si illudono che tutto sia fatto a loro misura: unica certezza è l'infelicità che non risparmia nessuna creatura."],
 ["La scommessa di Prometeo (1824)","Prometeo scommette con Momo che l'uomo è l'essere più perfetto; osservando gli uomini riconosce la sconfitta."],
 ["Dialogo di un Fisico e di un Metafisico (1824)","Un sistema per prolungare la vita è inutile: gli umani aspirano a un'esistenza felice, ricca di sentimenti e sensazioni, non a una lunga."],
 ["Dialogo di Torquato Tasso e del suo Genio familiare (1824)","La felicità non è mai nel presente: è solo sogno, illusione, e noia."],
 ["Dialogo della Natura e di un Islandese (1824)","La Natura risponde all'islandese in fuga dal dolore di essere indifferente alla sorte di tutte le creature."],
 ["Il Parini ovvero della Gloria (1824)","Trattatello in 12 capitoli: il vecchio Parini mostra a un giovane discepolo l'insensatezza della realtà sociale e culturale."],
 ["Dialogo di Federico Ruysch e delle sue mummie (1824)","Funzione positiva della morte: attenua o elimina la sensibilità e quindi l'infelicità del desiderio di piacere irrealizzato."],
 ["Detti memorabili di Filippo Ottonieri (1824)","In sette brevi capitoli, sentenze sarcastiche sui vizi e sulla corruzione della società."],
 ["Dialogo di Cristoforo Colombo e di Pietro Gutierrez (1824)","Affrontare infelicità e noia rendendo l'esistenza più intensa e vitale con l'esplorazione dell'ignoto e l'azione."],
 ["Elogio degli uccelli (1824)","Amelio, filosofo solitario, elogia gli uccelli: felici per natura, senza noia grazie all'immaginazione."],
 ["Cantico del gallo silvestre (1824)","Riprende i temi centrali: assenza di felicità, prevalenza del dolore, natura materialistica e meccanicistica della vita, auspicio della morte."],
 ["Frammento apocrifo di Stratone da Lampsaco (1825)","Finta traduzione di un manoscritto del filosofo Stratone: nascita e fine del mondo in ottica materialistica."],
 ["Dialogo di Timandro e di Eleandro (1824)","Accettare con dignità l'infelicità è preferibile agli inganni di religione e filosofie ottimistiche."],
 ["Il Copernico (1827)","Attacco all'antropocentrismo e alla fiducia nel progresso."],
 ["Dialogo di Plotino e di Porfirio (1827)","Per solidarietà Plotino cerca di dissuadere Porfirio dal suicidio: insieme si può rendere l'esistenza più sopportabile."],
 ["Dialogo di un venditore d'almanacchi e di un passeggere (1832)","L'unico piacere possibile è nel futuro: attesa, speranza, illusioni."],
 ["Dialogo di Tristano e di un amico (1832)","Tristano finge di accettare l'ottimismo, poi polemizza: vanità delle illusioni, valore della verità, attesa della morte."]
]});

/* ---------- GLOSSARIO ---------- */
var GLOSS=[
 ["Idillio","Dal greco eidyllion, «quadretto» o «piccola veduta»: brevi componimenti lirici di tema agreste o pastorale di poeti greci e latini. Leopardi lo rielabora: il paesaggio diventa occasione per rimembranza, sentimento e indefinito.",["pidilli","inf"]],
 ["Canzone libera (canzone leopardiana)","Componimento che riprende dalla canzone classica l'alternanza di endecasillabi e settenari, ma con struttura più aperta: nessuno schema di rime né numero di versi fisso. Usata nei Grandi idilli.",["gi","passero"]],
 ["Palinodia","Componimento scritto o discorso composto per ritrattare e smentire affermazioni precedenti. In Leopardi è spesso finta e ironica (Tristano, Palinodia a Capponi).",["palin","tristano"]],
 ["Paralipomeni","Dal greco: opera che integra un componimento precedente. Leopardi riprende e prosegue la Batracomiomachia.",["parali"]],
 ["Batracomiomachia","Dal greco bàtrachos «rana», mys «topo», màche «battaglia»: poemetto attribuito a Omero (La guerra dei topi e delle rane), che Leopardi tradusse.",["conv1","parali"]],
 ["Filologia","Disciplina che mira a eliminare dai testi gli errori di trascrizione accumulati nei secoli, riportandoli alla forma originaria. Il filologo si occupa anche dell'attribuzione di un testo a un autore e a un'epoca (dal greco philos e logos, «amico della parola»).",["zib"]],
 ["Età dell'oro","Nei miti greco-romani, epoca in cui l'uomo viveva in armonia con la natura e i suoi simili, libero dalla fatica; eterna primavera, niente miseria, malattia, vecchiaia. Evocata dai poeti come primitiva felicità dopo la quale l'umanità si era degradata.",["coro","psto"]],
 ["Luciano di Samòsata","Scrittore greco (121-181 circa) dei Dialoghi satirici che condannano con tono derisorio la falsità e la stupidità umane. Modello per le Operette.",["luciano","oper"]],
 ["Noia","Senso di vuoto prodotto da una tensione inappagata e da un'impotente aspirazione a una felicità irraggiungibile. Conseguenza della teoria del piacere.",["piacere","schop"]],
 ["Illusioni","Miti, favole, immaginazione che rivestono la dura realtà e nascondono il «vero». Gli antichi le avevano; la ragione le ha distrutte.",["antmod","psto"]],
 ["Vero, «arido vero», «acerbo vero»","La verità filosofica sull'esistenza (il male è intrinseco alla vita) che smaschera le illusioni. «Arido vero» nelle Canzoni e nelle Operette; «acerbo vero» nei Grandi idilli.",["oper","gi","antmod"]],
 ["Rimembranza (ricordanza)","Ricordo di un'esperienza ormai lontana che rende vaga e lirica la realtà vissuta, anche se dolorosa. Fonte del sentimento poetico dei Grandi idilli.",["antmod","gi","ricord"]],
 ["Indefinito","Ciò che si presenta in modo indeterminato (siepe, notte, luna, parole vaghe) e stimola la fantasia e l'immaginazione.",["indef","inf"]],
 ["Piacere","Dal latino placere: andare a genio, riuscire gradito, ma anche desiderare, volere. In Leopardi il piacere reale è finito, il vero piacere è immaginare, attendere o cessazione di un dolore.",["piacere","quiete","sabato"]],
 ["Edonismo ed epicureismo","Temi antichi del piacere come fine dell'esistenza: per l'edonismo (edoné, «piacere») è soddisfazione dei desideri corporei; per l'epicureismo (IV secolo a.C.) assenza di dolore.",["piacere","schop"]],
 ["Utilitarismo","Tesi etica perfezionata tra XVIII e XIX secolo nella cultura anglosassone: base del comportamento è la ricerca dell'utile, cioè soddisfacimento dei bisogni e ricerca del piacere.",["piacere"]],
 ["Sensismo e materialismo","Filosofia a cui Leopardi aderisce con la conversione «dal bello al vero» (1819-1821): nega la religione e riconduce la realtà a natura materiale.",["convfil"]],
 ["Natura benigna e natura matrigna","Benigna: madre protettiva che dà vigore e illusioni (pessimismo storico). Matrigna: indifferente o crudele, inganna gli esseri umani (dal 1821-1822, poi pessimismo cosmico).",["psto","crisi","pcosm"]],
 ["Pessimismo storico, cosmico, eroico","Storico (fino al 1822): infelicità causata dalla ragione e dal progresso. Cosmico (1823-1828): il male è intrinseco all'esistenza e la natura è indifferente. Eroico (ultimo Leopardi): lotta e solidarietà pur nella consapevolezza del dolore.",["psto","pcosm","peroico"]],
 ["Antropocentrismo","Convinzione che l'essere umano sia al centro dell'universo, padrone e artefice del proprio destino, destinato a migliorare la propria condizione. Bersaglio della satira leopardiana.",["ginestra","copernico","peroico"]],
 ["Titanismo","Atteggiamento eroico di sfida, indicato dal libro tra i motivi che avvicinano Leopardi ai romantici, soprattutto nell'ultima fase e in All'Italia.",["antirom","cpat"]],
 ["Poesia ingenua e sentimentale","Distinzione di Schiller (1796) ripresa da Leopardi: poesia degli antichi (spontanea, fantasia) contro poesia dei moderni (sentimentale, legata alla realtà interiore).",["schiller","antmod"]],
 ["Poesia eternatrice","Concezione della poesia che rende eterni ideali grandi e virtuosi (All'Italia).",["cpat"]],
 ["Anti-idillico","Poesia del Ciclo di Aspasia: non più basata su sogni e desideri ingannevoli della giovinezza recuperati dalla memoria, ma combattiva ed energica.",["aspasia"]],

 ["Aspasia","Raffinata cortigiana del V secolo a.C. amata dall'ateniese Pericle: nome con cui Leopardi canta Fanny Targioni Tozzetti.",["fanny","aspasia"]],
 ["«Eccelsa imago»","Nella poesia Aspasia: la donna amata è solo una rappresentazione creata dal cuore del poeta, non una donna vera.",["aspasia34"]],
 ["«Social catena»","Nella Ginestra: patto di solidarietà tra gli esseri umani contro la minaccia della natura, le sopraffazioni e le ingiustizie sociali.",["ginestra","peroico"]],
 ["Alter ego","Secondo sé del poeta: Tristano è l'alter ego di Leopardi.",["tristano"]],
 ["Elogio, detti memorabili, frammento apocrifo","Generi letterari alla base delle Operette: biografie celebrative di un personaggio illustre; raccolte di sentenze di uomini celebri; estratti finti da opere antiche perdute.",["oper","luciano"]],
