cosa: 'Guerra contro i **boeri**, coloni di origine olandese del **Transvaal** e dell''**Orange**. Londra
  contava di vincere rapidamente: fu insidiosa e lunga, anche per l''appoggio che i boeri ricevettero
  dalla Germania, e si concluse nel 1902 con una sofferta vittoria britannica.'
conta: Mostra alle altre potenze, e soprattutto alla Germania, che la Gran Bretagna è vulnerabile; e convince
  Londra a modernizzare l'esercito e a **uscire dall'isolamento** in cui stava dai tempi della regina
  Vittoria, cercando alleati in funzione antitedesca.
