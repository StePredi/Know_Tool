id: capitalismo-finanziario
titolo: Il capitalismo finanziario
sigla: Capitalismo finanziario
genere: concetto
quando: dal 1850
cosa: 'Solo le banche più grandi possono finanziare le industrie più innovative: nasce un intreccio strettissimo
  fra industria e finanza. Le banche acquistano quote azionarie delle imprese, i capitani d''industria siedono nei
  consigli d''amministrazione delle banche.'
conta: 'È la seconda delle **tre forme storiche del capitalismo**: industriale (fine ''700 - metà ''800, produzione
  su larga scala), **finanziario** (dal 1850), di Stato (dal ''900, sistema condizionato dal potere statale).'
