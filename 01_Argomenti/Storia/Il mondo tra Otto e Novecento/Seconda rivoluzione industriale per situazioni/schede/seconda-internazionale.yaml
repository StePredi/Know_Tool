titolo: La Seconda Internazionale
sigla: II Internazionale
genere: evento
quando: 1889-1916
dove: Parigi
cosa: 'Federazione dei partiti e sindacati socialisti nazionali, ormai legalmente riconosciuti. Programma: sostegno
  reciproco, riforme economiche e sociali, **rifiuto del militarismo e della guerra**.'
conta: 'Sopravvive ufficialmente fino al 1916, ma lo scoppio della guerra nel 1914 ne decreta di fatto la fine:
  i partiti socialisti votano i crediti di guerra nei rispettivi paesi.'
