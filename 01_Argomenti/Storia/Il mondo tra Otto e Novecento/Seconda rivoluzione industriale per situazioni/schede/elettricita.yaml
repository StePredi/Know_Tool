id: elettricita
titolo: L'energia elettrica
sigla: Elettricità
genere: concetto
quando: Ottocento
cosa: L'elettricità **non è una fonte primaria**, ma una forma di distribuzione dell'energia prodotta altrove.
conta: È ciò che si sbaglia più spesso. Dopo la pila di Volta, Faraday e Maxwell dimostrano il rapporto fra elettricità
  e magnetismo; nasce il motore elettrico, superiore alla macchina a vapore, e con la lampadina il confine fra giorno
  e notte si fa sfumato.
