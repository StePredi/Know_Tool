id: prima-internazionale
titolo: La Prima Internazionale
sigla: I Internazionale
genere: evento
quando: 1864-1876
dove: Londra
cosa: L'**Associazione Internazionale dei Lavoratori**, centro di coordinamento della lotta sindacale. Vi confluiscono
  sindacalisti riformisti, cartisti, la maggioranza delle Trade Unions britanniche, anarchici (divisi fra Proudhon
  e Bakunin), i seguaci di Marx ed Engels, democratici nazionalisti ispirati a Mazzini.
conta: 'Battaglia comune: la riduzione dell''orario a **otto ore**. Ma i contrasti diventano insanabili quando i
  marxisti impongono la loro visione: escono i proudhoniani (1871) e i riformisti britannici, gli anarchici bakuniniani
  vengono espulsi (1872). Nel 1876 viene sciolta.'
