titolo: La Seconda rivoluzione industriale
sigla: Seconda rivoluzione
genere: concetto
quando: seconda metà dell’Ottocento
cosa: 'Tre componenti: **innovazione tecnologica** applicata a molti più settori, **nuove fonti di energia**, **nuove
  forme di organizzazione** delle aziende. Il risultato è un modello di produzione e consumo di massa.'
conta: 'Cambia anche il modo di inventare: le novità non nascono più da intuizioni di singoli geni ma da **ricerca
  scientifica collettiva**, in scuole superiori e politecnici. Molti inventori fondano imprese che esistono ancora:
  Edison, Bayer, Siemens, Solvay, Dunlop, Bell.'
