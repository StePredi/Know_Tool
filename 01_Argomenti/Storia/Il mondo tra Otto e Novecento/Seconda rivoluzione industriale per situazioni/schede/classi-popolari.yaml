genere: concetto
quando: Ottocento
cosa: La maggioranza della popolazione resta formata da **contadini e operai**, con condizioni di vita molto dure,
  aggravate durante la Grande depressione dai licenziamenti in massa.
conta: 'Il mondo operaio è variegato: qualificati e non, operai di lungo corso e apprendisti (il lavoro minorile
  è diffuso), uomini e donne — queste ultime con contratti peggiori e salari inferiori. Le **rivendicazioni** portano
  scioperi e manifestazioni, e conquiste importanti nella seconda metà del secolo.'
