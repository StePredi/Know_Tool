id: turismo
titolo: La nascita del turismo moderno
sigla: Turismo
genere: processo
quando: ultimi decenni dell’Ottocento
cosa: Dalla villeggiatura in campagna si passa alle vacanze al mare e in montagna, riscoperti come luoghi ameni;
  treni, battelli, grandi navi e automobili rendono le mete raggiungibili.
conta: Thomas **Cook** fonda nel 1845 la prima agenzia di viaggi moderna con tour «confezionati»; col tempo anche
  la classe media destina risparmi ai viaggi di piacere. Verne racconta un mondo che «si rimpicciolisce» in *Il
  giro del mondo in 80 giorni* (1872); nel 1889 la giornalista Nellie Bly lo fa in 72.
