cosa: 'L''agricoltura europea è poco meccanizzata, a differenza di quella di Stati Uniti e Canada. Ferrovie e navigazione
  transoceanica abbattono i costi: tonnellate di **grano americano a basso prezzo** invadono i porti europei.'
conta: Eccesso di offerta, prezzi giù fino al **30%**, profitti e salari agricoli in crollo, disoccupazione bracciantile
  e flussi migratori verso altri continenti.
