titolo: La crescita degli Stati Uniti
sigla: Crescita USA
genere: processo
quando: 1865-1900
dove: Stati Uniti
cosa: 'Dopo la guerra civile (1861-1865) gli Stati Uniti crescono in modo massiccio, anche grazie all''immigrazione
  europea, e diventano una **grande potenza economica**: ingenti investimenti in infrastrutture, una rete ferroviaria
  di circa **300.000 km**, un grande mercato interno.'
conta: 'È la base della potenza che si affaccerà sullo scacchiere mondiale: prima l''economia, poi la politica estera.'
