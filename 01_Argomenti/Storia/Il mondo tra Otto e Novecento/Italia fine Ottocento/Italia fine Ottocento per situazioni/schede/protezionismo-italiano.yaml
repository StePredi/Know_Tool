id: protezionismo-italiano
titolo: Il protezionismo italiano
sigla: Protezionismo
genere: concetto
quando: anni Ottanta
dove: Italia
cosa: 'La Sinistra inverte la rotta rispetto alla Destra: abbandona il libero scambio e adotta una **politica protezionistica**,
  come ormai tutti i maggiori paesi europei tranne la Gran Bretagna, per mitigare gli effetti della Grande depressione.'
conta: 'È la stessa risposta che danno gli altri Stati europei: la crisi internazionale arriva anche in Italia e
  orienta la politica economica.'
