cosa: Il **Partito socialdemocratico (SPD)** incontra larghi consensi fra la classe operaia. Bismarck aveva tentato
  di arrestarne la crescita sia con misure repressive sia varando un sistema di **assistenza e previdenza sociali
  all'avanguardia in Europa**.
conta: 'Mostra la doppia strategia dello Stato verso il movimento operaio: reprimere e insieme concedere, per togliergli
  consenso.'
