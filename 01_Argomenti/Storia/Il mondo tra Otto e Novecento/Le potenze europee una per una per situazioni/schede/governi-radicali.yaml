cosa: Dopo l'Affaire prevale una coalizione di democratici, repubblicani e radicali; il **movimento radicale**,
  partito dal 1901, ha fra i suoi fondamenti l'**anticlericalismo** e la laicità dello Stato.
conta: 'Porta due cose destinate a durare: la **separazione fra Chiesa e Stato (1905)**, che abolisce il Concordato
  napoleonico del 1801, e le prime riforme sociali (pensione di vecchiaia, limitazione dell''orario, riposo settimanale).'
elementi:
