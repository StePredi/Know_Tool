tipo: voce
id: borghesia
titolo: Alta e media borghesia
sigla: Borghesia
genere: concetto
quando: Ottocento
cosa: 'L''Ottocento è **il secolo della borghesia**. L''alta borghesia: ricchi imprenditori, grandi banchieri, professionisti,
  alti funzionari; valori: intraprendenza, operosità, capacità di creare e redistribuire filantropicamente ricchezza.
  La media: piccoli imprenditori, commercianti, tecnici, impiegati, desiderosi di elevarsi e imitare gli altoborghesi.'
conta: Il valore condiviso è essere percepiti come **«persone per bene»**, solide e moralmente irreprensibili —
  «che poi lo si fosse davvero era meno importante». Negli USA si afferma il mito del *self-made man*, in Europa
  la borghesia si imparenta spesso con l'aristocrazia.
