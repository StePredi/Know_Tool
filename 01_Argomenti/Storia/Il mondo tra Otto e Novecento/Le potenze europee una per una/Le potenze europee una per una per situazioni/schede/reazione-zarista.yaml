titolo: Il trionfo della reazione
sigla: Reazione zarista
genere: processo
quando: 1881-1917
dove: Russia
chi:
- Alessandro III
- Nicola II
cosa: 'Dopo la parentesi riformista di Alessandro II, i regni di **Alessandro III (1881-1894)** e **Nicola II (1894-1917)**
  riportano un orientamento **reazionario** e **autoritario**: lo zar esercita il potere in modo esclusivo, appoggiandosi
  alla Chiesa ortodossa e all''alta nobiltà.'
conta: 'Il paese resta immobile mentre la società cambia: è l''origine dell''opposizione che esploderà nel 1905
  e nel 1917.'
