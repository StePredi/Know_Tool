tipo: voce
id: stolypin
titolo: La riforma agraria di Stolypin
sigla: Stolypin
genere: persona
quando: 1906-1911
dove: Russia
chi:
- Pëtr Stolypin
cosa: 'Primo ministro dal 1906 al 1911, cerca di risolvere l''arretratezza delle campagne: mette in vendita ampi
  terreni statali e pone fine all''**obščina**, l''organizzazione tradizionale dei villaggi fondata sulla proprietà
  collettiva.'
conta: Nasce un ceto di agricoltori autonomi, i **kulaki**, ma la maggior parte dei contadini resta in estrema povertà.
  Conservatore e nazionalista, Stolypin usa il pugno di ferro con i movimenti rivoluzionari, istituendo tribunali
  speciali; cade vittima di un attentato nel 1911.
da:
- l: Q
  c: 2
  p: 6
parole: obščina, kulaki, riforma agraria
