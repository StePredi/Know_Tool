id: questione-irlandese
titolo: La questione irlandese
sigla: Irlanda
genere: processo
quando: 1886-1922
dove: Irlanda
cosa: 'La richiesta di **Home Rule**, cioè di autogoverno, viene bocciata più volte: nel 1886, nel 1893 dalla Camera
  dei Lord (419 voti contro 41) e di nuovo nel 1912.'
conta: Nel 1905 nasce il **Sinn Féin** («Noi stessi»); nel 1916, in piena guerra, la **rivolta di Pasqua** proclama
  la Repubblica. Dal 1919 al 1922 il conflitto porta allo Stato libero irlandese, con lo status di *dominion*; sei
  contee dell'**Ulster** restano unite alla Gran Bretagna e formano l'Irlanda del Nord.
