titolo: Il «programma massimo» dei rivoluzionari
sigla: Programma massimo
genere: concetto
quando: primi anni del Novecento
chi:
- Arturo Labriola
cosa: Al contrario dei riformisti, i socialisti della corrente rivoluzionaria, capeggiata dal napoletano **Arturo
  Labriola**, **rigettavano completamente l'idea di un compromesso** con i governi borghesi-liberali.
conta: A loro avviso la visione socialista avrebbe potuto trovare realizzazione solo attraverso un **«programma
  massimo»**, vale a dire con una **rivoluzione** contro la borghesia che conducesse al potere le classi lavoratrici.
