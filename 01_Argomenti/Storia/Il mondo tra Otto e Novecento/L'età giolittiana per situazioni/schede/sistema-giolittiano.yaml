titolo: Il sistema giolittiano
sigla: Sistema giolittiano
genere: concetto
quando: 1903-1914
dove: Italia
chi:
- Giovanni Giolitti
cosa: Il rifiuto non scoraggiò Giolitti dal cercare i propri ministri **all'interno di altri schieramenti**. Era
  sua convinzione che fosse utile coinvolgere nel governo il più ampio numero possibile di componenti **politico-culturali**,
  indipendentemente dalle ideologie e dalla loro aderenza al programma enunciato dal presidente del Consiglio.
conta: Così riuscì a mantenere un ruolo di grande potere nella vita politica italiana per **circa un decennio**.
