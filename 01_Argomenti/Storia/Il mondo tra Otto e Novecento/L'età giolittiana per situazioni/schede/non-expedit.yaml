tipo: voce
id: non-expedit
titolo: Il non expedit
sigla: Non expedit
genere: concetto
quando: dal 1870
dove: Italia
chi:
- Pio IX
cosa: Quando nel **1870** l'Italia aveva occupato Roma con la forza, papa **Pio IX** aveva rifiutato ogni rapporto
  con il nuovo Stato e aveva **proibito ai cattolici di partecipare alle elezioni** e di impegnarsi direttamente
  in politica. La formula apostolica era *non expedit*, cioè «**non conviene**».
conta: Col tempo fu evidente che il divieto **danneggiava soprattutto la Chiesa**, allontanandola dai cittadini
  del nuovo Regno d'Italia ed estromettendola dalle decisioni prese all'interno dei palazzi del potere.
da:
- l: Q
  c: 3
  p: 2
parole: non expedit, Pio IX, presa di Roma
