titolo: Il suffragio universale maschile
sigla: Suffragio 1912
genere: evento
quando: 1911-1912
dove: Italia
chi:
- Giolitti
cosa: Nel solco del processo di progressiva democratizzazione, Giolitti ritenne maturi i tempi per un **allargamento
  del diritto di voto** e nel **1911** propose il **suffragio universale maschile**, approvato nel **1912**. La
  legge concedeva il voto a tutti i cittadini maschi **ventenni in possesso della licenza elementare** e anche agli
  **analfabeti sopra i 30 anni**.
conta: Il corpo elettorale passò **dal 9% al 24%** della popolazione italiana. Le **donne continuavano a essere
  escluse**.
svolta: true
