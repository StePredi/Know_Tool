cosa: Come nel Partito socialista, anche nel mondo cattolico esistevano **diverse correnti**. Gli **intransigenti**,
  che si opponevano al tentativo d'integrazione dei cattolici nello Stato liberale, col tempo avevano perso terreno
  a vantaggio dei **moderati**, aperti alla partecipazione alla vita pubblica **in accordo con i liberali**.
conta: 'Lo scopo principale dei moderati era **arginare i socialisti**: è da qui che nascerà il patto Gentiloni.'
