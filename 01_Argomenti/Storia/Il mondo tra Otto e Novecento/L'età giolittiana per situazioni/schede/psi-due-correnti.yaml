genere: evento
quando: '1892'
dove: Italia
chi:
- Filippo Turati
- Arturo Labriola
cosa: Il **Partito socialista italiano** era nato nel 1892 — inizialmente col nome di *Partito dei lavoratori* —
  su iniziativa del giovane avvocato milanese **Filippo Turati**. **Primo partito di massa** a essere fondato in
  Italia, in poco tempo divenne il principale riferimento politico per la classe operaia.
conta: Restò però **privo di seguito nel Meridione** e si affermò soprattutto al Nord, fra gli operai delle grandi
  città e i lavoratori delle campagne. Come stava avvenendo negli altri partiti socialisti europei, al suo interno
  si crearono presto **due correnti** — **riformista** e **rivoluzionaria** — replicando le divisioni nate nella
  Seconda internazionale.
