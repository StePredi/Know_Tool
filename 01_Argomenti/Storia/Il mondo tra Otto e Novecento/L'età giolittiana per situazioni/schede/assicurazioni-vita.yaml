titolo: Il monopolio statale delle assicurazioni
sigla: Assicurazioni 1912
genere: evento
quando: '1912'
dove: Italia
cosa: Sempre nel 1912 fu approvato il **monopolio statale delle assicurazioni sulla vita**, nell'ottica di un'**affermazione
  del primato dello Stato sul privato**.
conta: Giolitti intendeva dar vita a un **fondo utile per la previdenza sociale e le pensioni**, rendendo più organico
  il sistema nato con il governo Zanardelli.
