tipo: voce
id: giolitti-turati
titolo: Perché Giolitti cerca i socialisti
sigla: Giolitti e Turati
genere: concetto
quando: '1903'
dove: Italia
chi:
- Giovanni Giolitti
- Filippo Turati
cosa: Anziché ritenerli dei pericolosi e inevitabili antagonisti dello Stato liberale, lo statista piemontese considerava
  i socialisti come **una delle forze vive della nazione**. Si rivolse a Turati, leader della corrente riformista,
  perché entrassero nel governo.
conta: 'Due obiettivi. Economico: un loro coinvolgimento avrebbe consentito di **regolare dall''alto i processi
  economici e produttivi**, favorendo il decollo del capitalismo in Italia. Politico: **assorbire il PSI nel sistema
  costituzionale e parlamentare**, ottenere l''**adesione delle masse allo Stato liberale** e colmare il distacco
  storico fra governanti e governati — isolando al tempo stesso la frangia rivoluzionaria.'
