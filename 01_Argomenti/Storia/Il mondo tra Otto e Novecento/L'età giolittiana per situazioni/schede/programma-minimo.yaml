titolo: Il «programma minimo» dei riformisti
sigla: Programma minimo
genere: concetto
quando: '1900'
chi:
- Filippo Turati
- Claudio Treves
cosa: I **riformisti**, capeggiati da Turati, affermavano la necessità di **prendere parte alla vita parlamentare**
  in accordo con le altre forze politiche, per varare riforme politiche e sociali di basilare importanza e realizzare
  il socialismo solo in una fase successiva.
conta: 'Il compromesso con la borghesia liberale sarebbe stato **provvisorio**, finalizzato soltanto a rendere effettive
  e irreversibili quelle riforme. I quattro punti elaborati da Turati e **Claudio Treves**: **suffragio universale**,
  **libertà di organizzazione sindacale**, **rinuncia alla politica coloniale**, **obbligo di istruzione elementare**.'
