cosa: L'accordo stipulato fra l'Italia e la Francia stabiliva le **reciproche sfere di influenza in Nordafrica**.
conta: Il governo italiano vedeva riconosciute le sue **aspirazioni sulla Libia**; quello francese otteneva **libertà
  di azione in Marocco**. È il patto che nove anni dopo renderà possibile la guerra.
