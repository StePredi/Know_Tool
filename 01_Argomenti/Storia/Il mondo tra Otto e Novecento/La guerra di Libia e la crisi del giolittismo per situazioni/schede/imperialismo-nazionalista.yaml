tipo: voce
id: imperialismo-nazionalista
titolo: L’imperialismo nazionalista
sigla: Imperialismo naz.
genere: concetto
quando: dal 1912
dove: Italia
cosa: 'A spingere per la guerra erano stati soprattutto i **nazionalisti**: furono proprio loro a trarre dalla vittoria
  il maggiore vantaggio, e da quel momento l''imperialismo nazionalista guadagnò l''adesione di **strati sempre
  più vasti della società e della cultura italiane**.'
conta: Fondata sull'interpretazione dello **Stato come organismo unitario**, questa concezione si contrapponeva
  al socialismo e all'idea di una **lotta tra classi**; allo stesso tempo, però, **respingeva con altrettanta nettezza
  l'ideologia liberale**, di cui Giolitti era considerato il simbolo. Non aveva alleati né a sinistra né al centro.
