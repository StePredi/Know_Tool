cosa: Con il cambio di rotta impresso alla politica estera dopo il 1896 l'Italia dimostrava di aver riconquistato
  una certa **libertà di azione sullo scenario internazionale**, rispetto alla necessità di restare legata unicamente
  alla Triplice alleanza.
conta: Questo nuovo corso era favorito anche da **Vittorio Emanuele III**, che non nutriva grandi simpatie per la
  Germania di Guglielmo II.
