  - modernizzazione e sviluppo del Mezzogiorno
  - nazionalizzazione della rete ferroviaria; suffragio universale maschile
- nome: Politica estera
  risposte:
  - —
  - conferma dell’alleanza con Germania e Impero austro-ungarico; avvicinamento alla Francia e ad altre potenze
    europee
  - 'ripresa della politica coloniale: guerra di Libia e occupazione del Dodecaneso'
  - —
