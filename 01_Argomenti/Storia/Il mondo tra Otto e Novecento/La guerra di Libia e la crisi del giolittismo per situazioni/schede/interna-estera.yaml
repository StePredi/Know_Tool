titolo: 'Le azioni di Giolitti: interna ed estera'
sigla: Interna / estera
domande:
- Verso i socialisti e i cattolici
- Verso le alleanze
- Verso il Mezzogiorno e le colonie
- Verso il diritto di voto e le infrastrutture
casi:
- nome: Politica interna
  risposte:
  - apertura verso i movimenti socialisti; alleanza con il mondo cattolico
