titolo: La svolta in politica estera dopo Adua
sigla: Svolta 1896
genere: concetto
quando: dopo il 1896
dove: Italia
cosa: Dopo la sconfitta di **Adua** l'espansionismo coloniale aveva subito una battuta d'arresto che aprì un **nuovo
  corso** in politica estera. L'Italia da un lato scelse di continuare a far parte della **Triplice alleanza**,
  ma con un'**attenuazione delle posizioni filo-tedesche** che avevano caratterizzato gli anni di Crispi.
conta: Dall'altro decise di **stabilire rapporti di amicizia e di collaborazione con altre potenze europee** — Francia,
  Gran Bretagna, Russia — per tutelare gli interessi nazionali nell'area mediterranea e nei Balcani.
