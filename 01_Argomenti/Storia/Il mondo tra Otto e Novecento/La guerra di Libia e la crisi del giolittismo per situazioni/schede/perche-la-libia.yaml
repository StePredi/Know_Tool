tipo: voce
id: perche-la-libia
titolo: Perché Giolitti non può ignorarli
sigla: Perché la Libia
genere: concetto
quando: '1911'
dove: Italia
chi:
- Giolitti
cosa: 'Le istanze nazionaliste andavano **contro il sistema giolittiano** di bilanciamento fra borghesia industriale
  e proletariato: avevano l''effetto di **unire i conservatori ai cattolici** e di **isolare i socialisti**, tradizionalmente
  ostili al colonialismo e al militarismo.'
conta: A ogni modo Giolitti, **per mantenere l'egemonia sullo schieramento conservatore, non poteva ignorarle**.
  Fu così che decise di riprendere una politica imperialista, indirizzandola verso il **Mediterraneo** e in particolare
  verso la **Libia**, che apparteneva all'Impero ottomano sempre più indebolito e su cui all'Italia erano stati
  riconosciuti **diritti di priorità** dai principali paesi europei.
