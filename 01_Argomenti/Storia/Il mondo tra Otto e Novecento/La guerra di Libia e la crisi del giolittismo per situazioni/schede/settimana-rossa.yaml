id: settimana-rossa
titolo: La settimana rossa
sigla: Settimana rossa
genere: evento
quando: 7-14 giugno 1914
dove: Italia centro-settentrionale, Marche e Romagna
cosa: L'inasprimento dello scontro sociale esplose nella cosiddetta «**settimana rossa**», in seguito alla **morte
  di alcuni anarchici** durante una manifestazione antimilitarista. L'Italia centro-settentrionale fu attraversata
  da **scioperi e manifestazioni**, violente soprattutto nelle **Marche** e in **Romagna**, e non mancò chi cercò
  di attribuire loro il significato di un'**insurrezione**.
conta: '**Privo di un vero programma**, il moto fu oggetto di una dura repressione e fallì. Quel vuoto però chiarì
  la **distanza ormai incolmabile tra masse e istituzioni liberali**, nonché il **fallimento del tentativo giolittiano
  di realizzare una loro conciliazione**.'
