tipo: voce
id: chi-spinge
titolo: Chi spinge per la guerra
sigla: Chi spinge
genere: concetto
quando: '1911'
dove: Italia
cosa: Il progetto trovò l'appoggio, oltre che dei **nazionalisti**, di alcuni **gruppi industriali**, che in caso
  di guerra avrebbero tratto vantaggio dalle spese militari.
conta: 'Nella stessa direzione spinsero infine diversi **gruppi finanziari**, in particolare il cattolico **Banco
  di Roma**, da tempo interessato a imporre la propria presenza sul mercato nordafricano: questa eventualità spinse
  la **Chiesa di Roma** a dare il proprio appoggio all''intervento in Libia.'
