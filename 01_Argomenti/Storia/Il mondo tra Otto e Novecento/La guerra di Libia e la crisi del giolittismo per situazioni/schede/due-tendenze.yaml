tipo: voce
id: due-tendenze
titolo: Due tendenze che non possono convivere
sigla: Due tendenze
genere: concetto
quando: 1912-1914
dove: Italia
cosa: '**Imperialismo nazionalista** e **socialismo rivoluzionario** non potevano convivere con il giolittismo:
  **aggressivo il primo, intransigente il secondo**, entrambi stridevano con la **tendenza alla mediazione parlamentare**
  che aveva rappresentato la cifra della politica di Giolitti.'
conta: Nel **1913**, inoltre, ci fu una nuova **crisi economica** che, per quanto meno dura rispetto a quella del
  1907, determinò un diffuso malcontento. In questa situazione, governare il paese attraverso l'**arte del compromesso**
  diventò più difficile.
