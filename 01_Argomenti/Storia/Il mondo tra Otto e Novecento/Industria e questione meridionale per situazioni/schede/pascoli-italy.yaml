cosa: 'La terza edizione dei *Poemetti* di **Giovanni Pascoli**, uscita nel 1904 e ribattezzata *Primi poemetti*,
  contiene un componimento dal titolo singolare: *Italy*. Il poemetto narra, in **450 versi**, il ritorno di due
  emigrati in America al loro paese natio, **Castelvecchio** in Garfagnana.'
conta: 'La particolarità principale è l''uso dell''«**italiese**», un misto di italiano, dialetto e inglese (*ticchetta*,
  fusione di *ticket* e biglietto): una scelta che destò perplessità e che **Benedetto Croce criticò ferocemente**,
  ma con cui Pascoli intendeva riprodurre il linguaggio — e il pensiero — di quegli italiani sospesi tra le due
  sponde dell''Atlantico. Il **primo canto** si focalizza su **Molly**, la figlia dei due emigrati, nata in America
  e portata in Italia perché malata di tisi: non capisce l''italiano né il dialetto della nonna. Nel **secondo canto**
  emergono gli ideali del poeta, che paragona gli emigrati a **rondini** costrette a lasciare l''Italia e a perdere
  la loro identità — il loro **nido**.'
