titolo: Il «primo miracolo economico italiano»
sigla: Primo miracolo
genere: concetto
quando: fine Ottocento - 1914
dove: Italia
cosa: La crescita della produzione industriale italiana tra la fine dell'Ottocento e lo scoppio della Prima guerra
  mondiale fu **così robusta** che si è soliti parlare di «**primo miracolo economico italiano**».
conta: Il secondo si avrà fra gli anni Cinquanta e Sessanta del Novecento.
