titolo: Salvemini e le cause dell’arretratezza
sigla: Salvemini
genere: persona
quando: età giolittiana
dove: Mezzogiorno
chi:
- Gaetano Salvemini
cosa: '**Gaetano Salvemini**, professore di storia e militante socialista di origini pugliesi, avversario di Giolitti,
  individuò le cause nella **permanenza del latifondo**, cioè delle grandi proprietà terriere in mano a ricchissimi
  notabili locali.'
conta: 'Costoro non solo erano poco interessati a rendere le loro terre più produttive, ma le lasciavano spesso
  **incolte** o le cedevano in affitto a contadini poverissimi e privi di mezzi. In altre parole la questione meridionale
  affondava le sue radici nella **mancata riforma agraria**, «sempre attesa e sempre negata». Per Salvemini occorreva:
  **porre fine al latifondo**, consentire la formazione di una **piccola e media proprietà** e realizzare il **decentramento
  amministrativo**, così da portare più democrazia nella società rurale.'
