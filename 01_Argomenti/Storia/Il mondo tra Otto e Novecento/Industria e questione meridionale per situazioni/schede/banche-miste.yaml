tipo: voce
id: banche-miste
titolo: Il riordino del sistema bancario
sigla: Banche miste
genere: concetto
quando: dagli anni Novanta
dove: Italia
cosa: 'Accanto all''intervento statale, un secondo fattore fece da volano all''industria: il **riordino del sistema
  bancario italiano**. Anzitutto fu fondata la **Banca d''Italia**, che svolse un ruolo di controllo e di coordinamento
  dell''intero sistema. Furono poi create le cosiddette «**banche miste**», istituti che si occupavano contemporaneamente
  del **credito ordinario e del finanziamento delle imprese**.'
conta: Dal **Credito Italiano** ricevettero una spinta decisiva i settori chimico e siderurgico; la **Banca Commerciale**
  diede il proprio appoggio all'industria elettrica. È l'**intreccio fra industria e finanza** caratteristico dell'Italia.
