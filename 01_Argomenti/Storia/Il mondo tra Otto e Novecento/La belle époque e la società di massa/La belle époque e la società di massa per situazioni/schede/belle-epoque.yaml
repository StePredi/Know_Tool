cosa: Il periodo di **benessere economico** e fiducia nel progresso che precede la Prima guerra mondiale, reso possibile
  da innovazione tecnologica, nuove fonti di energia e **produzione di massa**.
conta: 'È il clima in cui matura tutto il resto: il consumo di massa, la politica di massa e, sotto la superficie,
  il nazionalismo aggressivo che porterà alla guerra.'
