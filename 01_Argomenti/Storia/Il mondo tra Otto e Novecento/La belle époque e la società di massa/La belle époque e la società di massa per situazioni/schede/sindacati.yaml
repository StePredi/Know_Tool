titolo: I sindacati
sigla: Sindacati
genere: concetto
quando: fine Ottocento
dove: Europa
cosa: Organizzazioni dei lavoratori per ottenere salari migliori, orari più corti e tutele. In Gran Bretagna le
  **Trade Unions**, in Francia la **CGT**, in Italia le Camere del lavoro e le leghe.
conta: Insieme ai partiti sono il modo in cui le masse entrano nella vita pubblica; e lo sciopero diventa un'arma
  riconosciuta.
