tipo: voce
id: spartizione-cina
titolo: La spartizione della Cina
sigla: Cina spartita
genere: processo
quando: fine XIX secolo
dove: Cina
cosa: 'La Cina è un impero immenso ma antiquato, senza industrie e senza un esercito moderno, governato dal 1644
  dalla **dinastia Qing** (o Manciù). Le potenze occidentali non riescono a spartirsela del tutto e si accontentano
  delle **concessioni**: zone con i porti e le città commerciali più ricche, che il governo cinese «concede» occupare
  militarmente e sfruttare.'
conta: È il caso di un paese enorme che subisce l'imperialismo senza essere formalmente colonizzato.
da:
