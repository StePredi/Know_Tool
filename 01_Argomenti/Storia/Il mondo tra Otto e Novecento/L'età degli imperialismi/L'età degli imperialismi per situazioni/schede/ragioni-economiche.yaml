tipo: voce
id: ragioni-economiche
titolo: Le ragioni economiche
sigla: 'Perché: economia'
genere: concetto
quando: 1870-1914
cosa: Le potenze hanno bisogno di **nuovi mercati** dove dirottare il surplus delle industrie e di **materie prime
  a basso costo** — ferro, carbone, petrolio, lana, cotone — per sostenere una produzione crescente. La conquista
  promette anche di assorbire la disoccupazione e contenere i conflitti sociali interni.
conta: 'Spiega l''affanno della corsa: non è solo orgoglio nazionale, è la nuova società industrializzata che chiede
  spazio.'
