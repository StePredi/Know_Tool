cosa: Guglielmo II invia un **telegramma di solidarietà** a Paul Kruger, presidente della Repubblica boera
  del **Transvaal**, con cui la Gran Bretagna era in guerra.
conta: 'Un gesto che incrina i rapporti con Londra senza portare alla Germania alcun vantaggio concreto:
  è la Weltpolitik all''opera, e il modo in cui si costruisce da sola i nemici.'
svolgimento:
