- quando: '1897'
  passo: in cambio di una concessione alle imprese tedesche per una linea ferroviaria nell'Impero ottomano,
    la Germania fornisce supporto ai turchi nel conflitto con la Grecia, mentre le truppe elleniche contano
    sul sostegno britannico
