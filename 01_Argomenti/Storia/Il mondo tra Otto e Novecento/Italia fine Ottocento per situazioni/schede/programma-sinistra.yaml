tipo: voce
id: programma-sinistra
titolo: Il programma della Sinistra
sigla: Programma Sinistra
genere: concetto
quando: '1876'
dove: Italia
cosa: 'Il nucleo originario veniva dalle file mazziniane e garibaldine, di simpatie repubblicane; ma al momento
  di governare la connotazione radicale e antimonarchica si era già stemperata: la compagine è composita e in prevalenza
  **moderata**.'
conta: 'Quattro punti: estensione del **diritto di voto**, dialogo con i **ceti popolari**, riforma dell''**istruzione
  elementare** (gratuita e obbligatoria davvero), **decentramento amministrativo** — l''unico presto accantonato.'
da:
- l: T
  c: 18
  p: 1
parole: Sinistra storica, moderata
