cosa: Patto dal **carattere difensivo** fra Russia, Francia e Gran Bretagna, nato per **arginare la potenza
  tedesca** e la Triplice alleanza.
conta: Gli equilibri diplomatici europei si irrigidiscono pericolosamente in **due blocchi contrapposti**,
  anticipando gli schieramenti che di lì a pochi anni avrebbero caratterizzato la Prima guerra mondiale.
