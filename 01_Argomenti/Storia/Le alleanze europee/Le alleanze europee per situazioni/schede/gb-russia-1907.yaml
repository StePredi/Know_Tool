cosa: 'Accordo per appianare i contrasti coloniali in Asia: i britannici ottengono il controllo sull''**Afghanistan**,
  i russi su parte della **Persia**.'
conta: Cade l'ultima rivalità fra i tre futuri alleati. L'esito della guerra russo-giapponese aveva già
  frenato l'espansionismo russo a oriente, e Londra guardava ormai alla Russia come a un possibile baluardo
  contro l'ascesa dirompente della Germania.
