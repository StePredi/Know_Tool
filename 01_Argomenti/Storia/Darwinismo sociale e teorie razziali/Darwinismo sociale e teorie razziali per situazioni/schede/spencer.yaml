cosa: In *Social Statics* sostiene che l'evoluzione è progresso, una legge universale; anche nella sfera
  sociale vige una spietata competizione individuale che non va ostacolata con leggi o istituzioni a favore
  dei più deboli, perché alla fine prevarranno i migliori.
conta: 'Mostra che il darwinismo sociale non nasce da Darwin: l''idea c''era già, e il nome di Darwin
  le è stato appiccicato dopo.'
nota: 'La data conta: 1851, otto anni prima dell''«Origine delle specie».'
