titolo: I valori dell'AHT20 sono strani
sigla: Valori AHT20
comando: misura ogni 2 s
frase: sensore che si scalda
fonte: Introduzione ESP32 · TPSIT 2026/27
parole: aht20 valori errati strani temperatura alta umidità errore riscaldamento autoriscaldamento frequenza
