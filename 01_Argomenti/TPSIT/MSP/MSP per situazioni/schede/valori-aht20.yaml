quando: Quando temperatura o umidità del sensore sembrano sbagliate.
fasi:
- nome: Cause possibili
  righe:
  - codice: misure troppo frequenti
    commento: il sensore si riscalda e falsa la misura
    trappola: 'Per stare sotto 0,1 °C di riscaldamento l''attività deve essere ≤ 10 % del tempo: una misura
      ogni 2 secondi.'
  - codice: umidità > 80 % a lungo
    commento: dopo 60 ore può dare +3 % RH; torna normale in condizioni normali
  - codice: temperatura di lavoro
    commento: l'accuratezza dell'umidità dipende dalla temperatura
