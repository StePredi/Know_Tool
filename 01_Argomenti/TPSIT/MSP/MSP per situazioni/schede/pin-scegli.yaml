id: pin-scegli
tipo: ricetta
titolo: Scegliere un pin libero
sigla: Quale pin uso?
comando: GPIO senza trappole
frase: i pin più tranquilli
fonte: 'Introduzione ESP32 · TPSIT 2026/27, schema dei pin (p. 14) · nota: regole d''uso'
parole: scegliere pin libero gpio evitare strapping avvio flash solo ingresso 34 35 36 39 0 2 5 12 15
  1 3 led pulsante
quando: Quando devi collegare un LED, un pulsante o un modulo e vuoi evitare problemi.
fasi:
- nome: Più tranquilli
  righe:
  - codice: GPIO 13 · 14 · 16 · 17 · 18 · 19 · 21 · 22 · 23 · 25 · 26 · 27 · 32 · 33
    commento: ingressi e uscite normali
    trappola: '21 e 22 sono l''I2C, 18 · 19 · 23 sono l''SPI, 16 e 17 la seconda seriale: toglili dalla
      lista se usi quelle funzioni.'
- nome: Da evitare o con attenzione
  righe:
  - codice: GPIO 0 · 2 · 5 · 12 · 15
    commento: 'pin di avvio: il livello all''accensione influisce sull''avvio (nota)'
    trappola: Il GPIO12 alto all'accensione può impedire l'avvio.
  - codice: GPIO 1 · 3
    commento: 'seriale di USB e monitor: disturbano Serial'
  - codice: GPIO 34 · 35 · 36 · 39
    commento: solo ingresso e senza pull-up interna
segnaposto: {}
varianti: []
vicine:
- pin-mappa
- pin-solo-ingresso
- avvio-bloccato
