id: interrupt-modo
tipo: ricetta
titolo: Scegliere quando scatta l'interrupt
sigla: Modo dell'interrupt
comando: LOW · HIGH · CHANGE · FALLING · RISING
frase: quale cambio di livello?
fonte: Slide ESP32 GPIO e timer
parole: modo mode low high change falling rising fronte discesa salita livello interrupt
quando: Quando devi decidere in quale momento esatto l'ISR deve partire.
fasi:
- nome: I cinque modi
  righe:
  - codice: attachInterrupt(«PIN», «ISR», LOW);
    commento: finché il pin è basso
  - codice: attachInterrupt(«PIN», «ISR», HIGH);
    commento: finché il pin è alto
  - codice: attachInterrupt(«PIN», «ISR», CHANGE);
    commento: a ogni cambio, in salita e in discesa
  - codice: attachInterrupt(«PIN», «ISR», FALLING);
    commento: quando il pin scende da alto a basso
    trappola: 'Con INPUT_PULLUP il pulsante premuto fa scendere il pin: serve FALLING.'
  - codice: attachInterrupt(«PIN», «ISR», RISING);
    commento: quando il pin sale da basso ad alto
segnaposto:
  PIN:
    esempio: '0'
    spiega: numero del GPIO
  ISR:
    esempio: isr
    spiega: nome della funzione
varianti: []
vicine:
- interrupt-pin
- pullup-pulsante
