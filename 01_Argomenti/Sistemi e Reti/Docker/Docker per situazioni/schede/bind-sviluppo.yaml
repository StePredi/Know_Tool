id: bind-sviluppo
tipo: ricetta
titolo: Provare un programma in un container senza scrivere il Dockerfile
sigla: Prova con bind mount
comando: -v "$PWD":/app -w /app
frase: il codice resta sul PC
fonte: lab_immagini_dockerfile.pdf (parte 1.3) · container_mini_tutorial.md
parole: sviluppo prova senza dockerfile bind mount pwd -w workdir python slim node codice locale
quando: Quando vuoi eseguire il tuo codice con l'interprete di un'immagine, senza costruirne una tua.
fasi:
- nome: Esegui il programma della cartella corrente
  righe:
  - codice: docker run --rm -it --name prova -v "$PWD":/app -w /app -p 5000:5000 python:3.12-slim python app.py
    commento: il terminale resta occupato dal servizio; Ctrl+C per fermarlo
    parti:
    - voce: -v "$PWD":/app
      spiega: la cartella corrente del PC compare in /app
    - voce: -w /app
      spiega: cartella di lavoro nel container (come WORKDIR)
    - voce: python app.py
      spiega: il comando da eseguire
    trappola: 'Ogni volta servono -v e -w: è il lavoro che il Dockerfile automatizza.'
- nome: Più cartelle
  righe:
  - codice: docker run -d -v $(pwd)/src:/app/src -v $(pwd)/public:/app/public -p 3000:3000 my-dev-app
    commento: i sorgenti modificati si vedono subito nel container
segnaposto: {}
varianti: []
vicine:
- bind-mount
- dockerfile-base
- file-di-root
