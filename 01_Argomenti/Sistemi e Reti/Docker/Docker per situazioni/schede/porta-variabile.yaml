id: porta-variabile
tipo: ricetta
titolo: Cambiare la porta del servizio senza ricostruire l'immagine
sigla: Porta con -e
comando: -e PORT=… -p …:…
frase: la porta di destra deve essere quella vera
fonte: lab_immagini_dockerfile.pdf (parte 4.4)
parole: variabile ambiente -e env port cambiare porta 8080 senza ricostruire configurare
quando: Quando il programma legge la porta da una variabile d'ambiente e vuoi farlo ascoltare su un'altra.
fasi:
- nome: Cambia la variabile e pubblica la stessa porta
  righe:
  - codice: docker run -d --name archivio-8080 -p 5002:8080 -e PORT=8080 note:2.0
    commento: il servizio ascolta su 8080 nel container, raggiungibile dalla 5002 del PC
    parti:
    - voce: -e PORT=8080
      spiega: sostituisce il valore di ENV PORT=5000 del Dockerfile
    - voce: -p 5002:8080
      spiega: a destra la stessa porta della variabile
- nome: Verifica
  righe:
  - codice: python3 client.py localhost 5002 LIST
  - codice: docker logs archivio-8080
    commento: deve dire «in ascolto su 0.0.0.0:8080»
    trappola: Se -e PORT e la porta a destra di -p non coincidono, il client non riceve risposta.
segnaposto: {}
varianti: []
vicine:
- porta-sbagliata
- pubblica-porta
- named-volume
