id: serial-ciclo
tipo: ricetta
titolo: Leggere e scrivere sulla seriale nello stesso thread
sigla: Ciclo seriale
comando: in_waiting + get_nowait
frase: un ciclo che fa tutti e due
fonte: gateway.py
parole: serial thread ciclo lettura scrittura in_waiting get_nowait coda comandi record seriale run
quando: Quando un solo thread deve ricevere dati dal dispositivo e mandargli comandi.
fasi:
- nome: Il ciclo del thread
  righe:
  - codice: 'while True:'
    commento: ogni giro legge se c'è qualcosa, poi invia se c'è un comando in coda
    trappola: 'Nota: questo ciclo non ha pause e può occupare molto processore; una breve pausa a ogni giro lo alleggerisce.'
  - codice: '    try:'
  - codice: '        if self.port.is_open and self.port.in_waiting > 0:'
  - codice: '            riga = self.port.readline().decode(''ascii'', errors=''ignore'')'
  - codice: '            record = self.decodifica_riga(riga)'
  - codice: '            if record:'
  - codice: '                self.coda_seriale.put(record)'
  - codice: '        try:'
  - codice: '            cmd = self.coda_mqtt_out.get_nowait()'
  - codice: '            self.port.write(cmd.encode(''ascii''))'
  - codice: '        except queue.Empty:'
  - codice: '            pass'
  - codice: '    except serial.SerialException as e:'
  - codice: '        self.logger.error(f"errore seriale: {e}")'
  - codice: '        break'
segnaposto: {}
varianti: []
vicine:
- serial-leggi
- serial-scrivi
