id: path-elenca
tipo: ricetta
titolo: Elencare i file di una cartella
sigla: iterdir / glob
comando: p.iterdir()  p.glob("*.py")
frase: un percorso alla volta
fonte: Documentazione ufficiale Python · Libreria standard · pathlib
parole: pathlib iterdir glob rglob elenco file cartella ricerca estensione
quando: Quando devi elaborare tutti i file di un certo tipo.
fasi:
- nome: Tutto il contenuto
  righe:
  - codice: 'for x in p.iterdir():'
    commento: iterdir() restituisce tutto quello che c'è dentro la cartella, un percorso alla volta.
    parti:
    - voce: p.iterdir()
      spiega: file e sottocartelle
  - codice: '    print(x)'
- nome: Solo alcuni
  righe:
  - codice: sorted(p.glob("*.py"))
    commento: 'glob filtra con un pattern: * significa qualsiasi testo.'
    parti:
    - voce: glob("*.py")
      spiega: solo i .py della cartella
    - voce: sorted(...)
      spiega: mette in ordine il risultato
  - codice: sorted(p.rglob("*.py"))
    commento: rglob cerca anche nelle sottocartelle.
    trappola: 'Nota: l''ordine non è garantito, per questo si usa sorted().'
    parti:
    - voce: rglob("*.py")
      spiega: ricorsivo
segnaposto: {}
varianti: []
vicine:
- path-cartelle
- path-leggi-scrivi
