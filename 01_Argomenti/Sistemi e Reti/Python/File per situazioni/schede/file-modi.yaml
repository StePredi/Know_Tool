id: file-modi
tipo: ricetta
titolo: 'Scegliere il modo: leggere, scrivere, aggiungere'
sigla: Modi
comando: r  w  a  r+  b
frase: una lettera per scopo
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: modo r w a r+ b binario testo append sovrascrivere
quando: Quando non sai quale modo passare a open().
fasi:
- nome: Le lettere
  righe:
  - codice: open(nome, "r")
    commento: 'Il modo è una stringa breve: dice cosa vuoi fare con il file.'
    parti:
    - voce: '"r"'
      spiega: 'read: leggere (predefinito); errore se il file non esiste'
  - codice: open(nome, "w")
    commento: 'Attenzione: "w" azzera il file se esiste già.'
    trappola: Con "w" il contenuto precedente sparisce.
    parti:
    - voce: '"w"'
      spiega: 'write: crea o svuota e riscrive'
  - codice: open(nome, "a")
    commento: '"a" non tocca il contenuto già presente.'
    parti:
    - voce: '"a"'
      spiega: 'append: scrive in fondo; crea il file se non c''è'
  - codice: open(nome, "r+")
    commento: '"r+" apre senza svuotare e permette entrambe le operazioni.'
    parti:
    - voce: '"r+"'
      spiega: read + write
- nome: Testo o binario
  righe:
  - codice: open(nome, "rb")
    commento: Aggiungendo b si lavora con i byte invece che con il testo.
    trappola: Il modo binario si usa per file che non sono testo, come le immagini.
    parti:
    - voce: '"rb"'
      spiega: 'read binary: niente codifica, restituisce bytes'
segnaposto: {}
varianti: []
vicine:
- file-apri
- file-scrivi
- file-aggiungi
