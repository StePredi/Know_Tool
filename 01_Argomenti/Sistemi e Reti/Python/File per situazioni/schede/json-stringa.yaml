id: json-stringa
tipo: ricetta
titolo: Trasformare dati Python in testo JSON e viceversa
sigla: dumps / loads
comando: json.dumps(x)  json.loads(s)
frase: con s sta per stringa
fonte: Documentazione ufficiale Python · Libreria standard · json
parole: json dumps loads stringa serializzare deserializzare lista dizionario
quando: Quando devi inviare o salvare un dizionario/lista come testo.
fasi:
- nome: Da Python a testo
  righe:
  - codice: |-
      import json
      json.dumps([1, "simple", "list"])
    commento: dumps trasforma un oggetto Python in testo JSON (s = string).
    parti:
    - voce: json.dumps(x)
      spiega: da Python a stringa JSON
- nome: Da testo a Python
  righe:
  - codice: 'json.loads(''["foo", {"bar": ["baz", null, 1.0, 2]}]'')'
    commento: loads fa il contrario. Il testo JSON diventa lista, dizionario, numeri.
    trappola: Il null di JSON diventa None; true e false diventano True e False.
    parti:
    - voce: json.loads(s)
      spiega: da stringa JSON a Python
    - voce: 'null'
      spiega: diventa None
segnaposto: {}
varianti: []
vicine:
- json-file
- json-opzioni
- json-errore
