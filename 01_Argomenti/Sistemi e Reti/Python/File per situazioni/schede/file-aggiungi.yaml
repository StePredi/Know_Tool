id: file-aggiungi
tipo: ricetta
titolo: Aggiungere righe in fondo
sigla: Aggiungere
comando: open(nome, "a")
frase: senza cancellare
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: append aggiungere fondo log riga file modo a
quando: Quando il file esiste già e vuoi aggiungere dati nuovi.
fasi:
- nome: Modo a
  righe:
  - codice: 'with open("log.txt", "a", encoding="utf-8") as f:'
    commento: 'Con "a" ogni esecuzione aggiunge in fondo, senza perdere quello che c''era: utile per i log.'
    trappola: 'Nota: esempio scritto qui; il modo "a" è nella documentazione di open().'
    parti:
    - voce: '"a"'
      spiega: append
  - codice: '    f.write("nuova riga\n")'
    parti:
    - voce: '"nuova riga\n"'
      spiega: il \n finale tiene separate le righe
segnaposto: {}
varianti: []
vicine:
- file-modi
- file-scrivi
- json-lines
