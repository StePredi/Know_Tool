id: path-crea
tipo: ricetta
titolo: Creare un percorso
sigla: Path
comando: Path("cartella") / "file.txt"
frase: la / unisce
fonte: Documentazione ufficiale Python · Libreria standard · pathlib
parole: pathlib path percorso crea slash unire cwd home
quando: Quando vuoi scrivere un percorso senza preoccuparti di / e \.
fasi:
- nome: Crea
  righe:
  - codice: |-
      from pathlib import Path
      p = Path("dati")
      q = p / "misure.json"
    commento: Path rappresenta un percorso. Con / ne unisci i pezzi come cartelle, senza preoccuparti del separatore di Windows o Linux.
    parti:
    - voce: Path("dati")
      spiega: percorso relativo
    - voce: p / "misure.json"
      spiega: aggiunge un pezzo
  - codice: |-
      Path.cwd()
      Path.home()
    commento: Due percorsi utili già pronti.
    trappola: 'Path non apre il file: costruisce solo il percorso.'
    parti:
    - voce: Path.cwd()
      spiega: cartella da cui avvii il programma
    - voce: Path.home()
      spiega: cartella personale dell'utente
segnaposto: {}
varianti: []
vicine:
- path-parti
- path-esiste
- path-leggi-scrivi
