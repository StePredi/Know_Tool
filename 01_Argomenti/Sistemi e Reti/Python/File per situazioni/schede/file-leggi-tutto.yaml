id: file-leggi-tutto
tipo: ricetta
titolo: Leggere tutto il contenuto
sigla: read()
comando: f.read()
frase: una stringa sola
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: read leggere tutto contenuto stringa size file
quando: Quando il file è piccolo e ti serve tutto il testo.
fasi:
- nome: Tutto
  righe:
  - codice: f.read()
    commento: read() senza argomenti legge tutto il file in una volta.
    trappola: 'Se il file è più grande della memoria, è un problema tuo: leggilo a righe.'
    parti:
    - voce: f.read()
      spiega: tutto il contenuto
- nome: Un pezzo
  righe:
  - codice: f.read(size)
    commento: Con un numero legge solo una parte; il cursore avanza di quel tanto.
    parti:
    - voce: f.read(size)
      spiega: al massimo size caratteri
    - voce: '""'
      spiega: risultato quando il file è finito
segnaposto: {}
varianti: []
vicine:
- file-leggi-righe
- file-seek
