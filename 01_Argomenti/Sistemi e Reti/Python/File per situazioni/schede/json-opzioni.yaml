id: json-opzioni
tipo: ricetta
titolo: Rendere il JSON leggibile o stabile
sigla: indent / ensure_ascii
comando: indent  sort_keys  ensure_ascii
frase: opzioni di dumps e dump
fonte: Documentazione ufficiale Python · Libreria standard · json
parole: json indent sort_keys ensure_ascii leggibile accenti ordinare tipi tupla chiavi
quando: Quando il file JSON lo deve leggere una persona, o ci sono accenti.
fasi:
- nome: Opzioni
  righe:
  - codice: json.dumps(dati, indent=4)
    commento: a capo e rientro di 4 spazi
  - codice: json.dumps(dati, sort_keys=True)
    commento: chiavi in ordine alfabetico
  - codice: json.dumps(dati, ensure_ascii=False)
    commento: le lettere accentate restano così come sono invece di diventare sequenze \\u
    trappola: Con ensure_ascii=False apri il file con encoding="utf-8".
- nome: Cosa cambia nei tipi
  righe:
  - codice: 'json.dumps({1: "a"})'
    commento: 'le chiavi diventano sempre stringhe: ''{"1": "a"}'''
  - codice: json.dumps((1, 2))
    commento: 'una tupla diventa un array: tornando indietro è una lista'
    trappola: 'Nota: per questo dati salvati e riletti non sono sempre identici agli originali.'
segnaposto: {}
varianti: []
vicine:
- json-stringa
- json-file
