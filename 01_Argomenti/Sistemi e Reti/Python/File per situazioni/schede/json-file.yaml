id: json-file
tipo: ricetta
titolo: Salvare e caricare un file JSON
sigla: dump / load
comando: json.dump(x, f)  json.load(f)
frase: senza la s lavorano sui file
fonte: Documentazione ufficiale Python · Libreria standard · json
parole: json dump load file salvare caricare configurazione
quando: Quando vuoi salvare dati strutturati in un file e rileggerli.
fasi:
- nome: Salva
  righe:
  - codice: 'with open("dati.json", "w", encoding="utf-8") as f:'
    commento: dump scrive direttamente su un file aperto.
    parti:
    - voce: open(..., "w")
      spiega: file in scrittura
  - codice: '    json.dump(dati, f)'
    parti:
    - voce: json.dump(dati, f)
      spiega: scrive il JSON nel file
- nome: Carica
  righe:
  - codice: 'with open("dati.json", "r", encoding="utf-8") as f:'
    commento: load legge il file e ricostruisce l'oggetto Python.
    trappola: 'Nota: json.dump e json.load hanno lo stesso nome senza la s di json.dumps e json.loads.'
    parti:
    - voce: open(..., "r")
      spiega: file in lettura
  - codice: '    dati = json.load(f)'
    parti:
    - voce: json.load(f)
      spiega: da file a oggetto Python
segnaposto: {}
varianti: []
vicine:
- json-stringa
- json-opzioni
- json-errore
