id: path-leggi-scrivi
tipo: ricetta
titolo: Leggere e scrivere un file con Path
sigla: read_text / write_text
comando: p.read_text()  p.write_text(s)
frase: apre e chiude da solo
fonte: Documentazione ufficiale Python · Libreria standard · pathlib
parole: pathlib read_text write_text leggere scrivere file breve
quando: Quando il file è piccolo e vuoi leggerlo o scriverlo in una riga.
fasi:
- nome: Leggi
  righe:
  - codice: p.read_text(encoding="utf-8")
    commento: 'Per file piccoli: una riga che apre, legge e chiude.'
    parti:
    - voce: p.read_text(encoding="utf-8")
      spiega: restituisce il testo
- nome: Scrivi
  righe:
  - codice: p.write_text("ciao", encoding="utf-8")
    commento: Scrive il testo e chiude il file. Se c'era qualcosa, viene sostituito.
    trappola: 'Per aggiungere in fondo devi usare open(p, "a"): write_text sostituisce.'
    parti:
    - voce: p.write_text("ciao", ...)
      spiega: sovrascrive il file
