id: file-seek
tipo: ricetta
titolo: Spostarsi dentro il file
sigla: seek / tell
comando: f.tell()  f.seek(offset, whence)
frase: il cursore nel file
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: seek tell posizione cursore inizio fine file
quando: Quando devi tornare indietro nel file o sapere dove sei.
fasi:
- nome: Posizione
  righe:
  - codice: f.tell()
    commento: Il file ha una posizione corrente (cursore) che avanza leggendo o scrivendo. tell() la restituisce.
    parti:
    - voce: f.tell()
      spiega: posizione in byte dall'inizio
- nome: Spostati
  righe:
  - codice: f.seek(offset, whence)
    commento: seek() sposta il cursore. Dopo aver letto tutto puoi tornare all'inizio con seek(0).
    trappola: Nei file di testo sono permessi solo spostamenti dall'inizio (e seek(0, 2) per la fine).
    parti:
    - voce: offset
      spiega: di quanto spostarsi
    - voce: whence 0
      spiega: dall'inizio
    - voce: whence 1
      spiega: dalla posizione attuale
    - voce: whence 2
      spiega: dalla fine
segnaposto: {}
varianti: []
vicine:
- file-leggi-tutto
- file-leggi-righe
