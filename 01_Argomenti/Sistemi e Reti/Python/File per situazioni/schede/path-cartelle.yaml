id: path-cartelle
tipo: ricetta
titolo: Creare una cartella
sigla: mkdir
comando: p.mkdir(parents=True, exist_ok=True)
frase: non dà errore se c'è già
fonte: Documentazione ufficiale Python · Libreria standard · pathlib
parole: pathlib mkdir parents exist_ok creare cartella
quando: Quando devi essere sicuro che la cartella ci sia prima di scrivere.
fasi:
- nome: Crea
  righe:
  - codice: Path("log/2026").mkdir(parents=True, exist_ok=True)
    commento: mkdir crea la cartella. Le due opzioni evitano gli errori più comuni.
    trappola: Senza exist_ok=True, una cartella già esistente dà FileExistsError.
    parti:
    - voce: parents=True
      spiega: crea anche le cartelle mancanti sopra (log/ e 2026/)
    - voce: exist_ok=True
      spiega: nessun errore se esiste già
segnaposto: {}
varianti: []
vicine:
- path-esiste
- path-elenca
