id: json-lines
tipo: ricetta
titolo: Un oggetto JSON per riga
sigla: JSON Lines
comando: json.dumps(x) + "\n"
frase: file di log che cresce
fonte: Documentazione ufficiale Python · Libreria standard · json
parole: json lines jsonl riga log messaggi append loads righe
quando: Quando aggiungi dati uno alla volta (letture, messaggi) e li rileggi dopo.
fasi:
- nome: Scrivi una riga
  righe:
  - codice: 'with open("misure.jsonl", "a", encoding="utf-8") as f:'
    commento: 'Ogni misura diventa una riga JSON: aggiungere dati è solo una riga in più in fondo al file.'
    trappola: 'Nota: formato non descritto nella documentazione di json; qui è la combinazione di dumps, modo "a" e fine riga.'
    parti:
    - voce: '"a"'
      spiega: non cancella le righe già presenti
  - codice: '    f.write(json.dumps(misura) + "\n")'
    parti:
    - voce: json.dumps(misura)
      spiega: la misura come testo
    - voce: + "\n"
      spiega: una riga per misura
- nome: Rileggi
  righe:
  - codice: 'with open("misure.jsonl", encoding="utf-8") as f:'
    commento: Per rileggere, trasformi ogni riga in un oggetto con json.loads.
  - codice: '    misure = [json.loads(riga) for riga in f]'
    parti:
    - voce: for riga in f
      spiega: una riga per volta
    - voce: json.loads(riga)
      spiega: da testo a dizionario
segnaposto: {}
varianti: []
vicine:
- file-aggiungi
- json-stringa
- file-leggi-righe
