id: file-encoding
tipo: ricetta
titolo: Scrivere e leggere con la stessa codifica
sigla: Codifica
comando: encoding="utf-8"
frase: lettere accentate senza guai
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: encoding utf-8 codifica accenti testo piattaforma
quando: Quando nel file ci sono lettere accentate o simboli.
fasi:
- nome: Indica la codifica
  righe:
  - codice: |-
      with open("dati.txt", "w", encoding="utf-8") as f:
          f.write("perché")
    commento: 'Il testo viene salvato come byte: la codifica è la regola che associa i caratteri ai byte. Usa la stessa per scrivere e leggere, altrimenti gli accenti si rovinano.'
    parti:
    - voce: encoding="utf-8"
      spiega: codifica consigliata dal tutorial
    - voce: '"perché"'
      spiega: la é richiede utf-8 per essere letta bene dopo
  - codice: |-
      with open("dati.txt", "r", encoding="utf-8") as f:
          testo = f.read()
    commento: Qui leggi lo stesso file con la stessa codifica.
    trappola: Il tutorial dice che la codifica predefinita dipende dalla piattaforma e consiglia utf-8.
    parti:
    - voce: f.read()
      spiega: tutto il testo come stringa
segnaposto: {}
varianti: []
vicine:
- file-apri
- file-leggi-tutto
