id: file-leggi-righe
tipo: ricetta
titolo: Leggere una riga alla volta
sigla: Righe
comando: readline  for line in f
frase: è veloce e usa poca memoria
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: readline righe linea for iterare readlines lista file
quando: Quando il file ha più righe da elaborare.
fasi:
- nome: Ciclo for
  righe:
  - codice: |-
      for line in f:
          print(line, end="")
    commento: 'Il modo più semplice e comune: il file stesso è scorribile riga per riga.'
    parti:
    - voce: 'for line in f:'
      spiega: una riga per giro, con il suo \n
    - voce: end=""
      spiega: print non aggiunge un secondo a capo
- nome: Una riga per volta a mano
  righe:
  - codice: f.readline()
    commento: readline() legge una riga per volta, chiamandola tu.
    trappola: Una riga vuota nel file si vede come "\n", non come "".
    parti:
    - voce: f.readline()
      spiega: prossima riga
    - voce: '""'
      spiega: file finito
- nome: Tutte in una lista
  righe:
  - codice: |-
      list(f)
      f.readlines()
    commento: Se ti serve la lista di tutte le righe.
    parti:
    - voce: list(f)
      spiega: lista delle righe
    - voce: f.readlines()
      spiega: stessa cosa
segnaposto: {}
varianti: []
vicine:
- file-leggi-tutto
- file-seek
