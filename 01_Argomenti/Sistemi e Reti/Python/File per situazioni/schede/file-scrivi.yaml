id: file-scrivi
tipo: ricetta
titolo: Scrivere nel file
sigla: write()
comando: f.write(testo)
frase: solo stringhe
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: write scrivere stringa file str converte numero tupla
quando: Quando vuoi salvare testo in un file.
fasi:
- nome: Scrivi una stringa
  righe:
  - codice: f.write("This is a test\n")
    commento: write() scrive una stringa e restituisce quanti caratteri ha scritto. Non aggiunge l'a capo.
    parti:
    - voce: f.write("...\n")
      spiega: scrive il testo, con \n per andare a capo
    - voce: '15'
      spiega: numero di caratteri scritti
  - codice: value = ("the answer", 42)
    commento: Per scrivere qualcosa che non è testo (numero, tupla) prima lo converti con str().
    trappola: 'Per fine riga devi aggiungere tu \n: write() non lo mette.'
  - codice: s = str(value)
    parti:
    - voce: str(value)
      spiega: da tupla a testo
  - codice: f.write(s)
    parti:
    - voce: f.write(s)
      spiega: scrive il testo
segnaposto: {}
varianti: []
vicine:
- file-aggiungi
- file-modi
- json-file
