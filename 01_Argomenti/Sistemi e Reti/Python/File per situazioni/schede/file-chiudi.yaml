id: file-chiudi
tipo: ricetta
titolo: Chiudere il file in automatico con with
sigla: with open
comando: 'with open(...) as f:'
frase: si chiude da solo
fonte: Documentazione ufficiale Python · Tutorial · 7.2 Lettura e scrittura di file
parole: with open chiudere file close automatico errore
quando: 'Quando apri un file: sempre.'
fasi:
- nome: Usa with
  righe:
  - codice: 'with open("workfile", encoding="utf-8") as f:'
    commento: Alla fine del blocco with il file si chiude da solo. Dopo, f esiste ancora ma è chiuso.
    parti:
    - voce: 'with open(...) as f:'
      spiega: apre e assegna il file a f
  - codice: '    read_data = f.read()'
    parti:
    - voce: read_data = f.read()
      spiega: legge dentro il blocco
  - codice: f.closed
    parti:
    - voce: f.closed
      spiega: True se il file è chiuso
  - codice: f.read()
    commento: Usare il file dopo il blocco è un errore.
    trappola: 'Il tutorial indica with come il modo consigliato: è più corto di try/finally e chiude anche in caso di errore.'
    parti:
    - voce: f.read()
      spiega: 'ValueError: I/O operation on closed file.'
segnaposto: {}
varianti: []
vicine:
- file-chiudi-prima-dopo
- file-apri
- file-errori
