id: path-parti
tipo: ricetta
titolo: Estrarre nome, estensione, cartella
sigla: name / suffix / parent
comando: p.name  p.stem  p.suffix  p.parent
frase: il percorso a pezzi
fonte: Documentazione ufficiale Python · Libreria standard · pathlib
parole: pathlib name stem suffix parent resolve nome estensione cartella assoluto
quando: Quando da un percorso ti serve solo una parte.
fasi:
- nome: Parti
  righe:
  - codice: p = Path("/home/utente/dati/misure.json")
    commento: Ogni parte del percorso è una proprietà.
  - codice: p.name
    parti:
    - voce: p.name
      spiega: nome del file con estensione
  - codice: p.stem
    parti:
    - voce: p.stem
      spiega: nome senza estensione
  - codice: p.suffix
    parti:
    - voce: p.suffix
      spiega: estensione, con il punto
  - codice: p.parent
    parti:
    - voce: p.parent
      spiega: cartella che lo contiene
- nome: Percorso assoluto
  righe:
  - codice: Path("dati").resolve()
    commento: resolve() trasforma un percorso relativo in assoluto (e risolve ..).
    trappola: Un percorso relativo dipende dalla cartella da cui avvii il programma.
    parti:
    - voce: .resolve()
      spiega: percorso completo dalla radice
segnaposto: {}
varianti: []
vicine:
- path-crea
- path-script
