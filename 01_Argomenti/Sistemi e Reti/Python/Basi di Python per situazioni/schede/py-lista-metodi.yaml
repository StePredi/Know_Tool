id: py-lista-metodi
tipo: ricetta
titolo: Aggiungere, togliere e ordinare elementi di una lista
sigla: Metodi delle liste
comando: append  insert  remove  pop  sort
frase: la lista si modifica sul posto
fonte: Documentazione ufficiale Python · Tutorial · 5. Strutture dati
parole: lista append extend insert remove pop sort reverse index count clear copy del metodi
quando: Quando devi cambiare il contenuto di una lista.
fasi:
- nome: Aggiungere
  righe:
  - codice: fruits.append('grape')
    commento: append mette un elemento alla fine.
    parti:
    - voce: append(x)
      spiega: in fondo
  - codice: fruits.insert(0, 'kiwi')
    commento: insert sceglie la posizione.
    parti:
    - voce: insert(0, 'kiwi')
      spiega: all'indice 0, cioè in testa
  - codice: fruits.extend(['fig', 'lime'])
    commento: extend aggiunge uno per uno gli elementi di un'altra lista.
    parti:
    - voce: extend([...])
      spiega: a differenza di append, non annida la lista
- nome: Togliere
  righe:
  - codice: fruits.remove('apple')
    commento: remove cerca il valore e toglie la prima occorrenza.
    trappola: ValueError se non c'è. Lo stesso per index().
    parti:
    - voce: remove('apple')
      spiega: per valore
  - codice: fruits.pop()
    commento: pop toglie un elemento e te lo restituisce.
    parti:
    - voce: pop()
      spiega: l'ultimo
    - voce: pop(0)
      spiega: il primo
  - codice: del fruits[0]
    commento: del toglie per posizione o per fetta.
    parti:
    - voce: del fruits[0]
      spiega: il primo
  - codice: del fruits[2:4]
    parti:
    - voce: del fruits[2:4]
      spiega: gli elementi 2 e 3
- nome: Ordinare e contare
  righe:
  - codice: fruits.sort()
    commento: Quattro metodi di uso comune.
    trappola: 'I metodi che modificano la lista restituiscono None: fruits = fruits.sort() la cancella.'
    parti:
    - voce: sort()
      spiega: mette in ordine la lista
  - codice: fruits.reverse()
    parti:
    - voce: reverse()
      spiega: la rovescia
  - codice: fruits.count('apple')
    parti:
    - voce: count(x)
      spiega: quante volte c'è x
  - codice: fruits.index('banana')
    parti:
    - voce: index(x)
      spiega: posizione di x
segnaposto: {}
varianti: []
vicine:
- py-list-comprehension
- py-copia-lista
- py-cicli-utili
