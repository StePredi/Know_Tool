id: py-pass
tipo: ricetta
titolo: Lasciare un blocco vuoto per ora
sigla: pass
comando: pass
frase: segnaposto che non fa niente
fonte: Documentazione ufficiale Python · Tutorial · 4.6 pass
parole: pass blocco vuoto classe funzione da implementare segnaposto
quando: Quando la sintassi vuole un blocco ma non hai ancora niente da scrivere.
fasi:
- nome: Blocco che non fa nulla
  righe:
  - codice: |-
      class MyEmptyClass:
          pass
    commento: pass riempie un blocco che deve esistere ma per ora non fa nulla.
    parti:
    - voce: pass
      spiega: istruzione che non fa niente
  - codice: |-
      def initlog(*args):
          pass   # Remember to implement this!
    commento: Utile come segnaposto per una funzione che scriverai dopo.
    trappola: 'pass non fa niente: serve solo perché un blocco non può restare vuoto.'
    parti:
    - voce: '# Remember to implement this!'
      spiega: promemoria per te
segnaposto: {}
varianti: []
vicine:
- py-if
- py-classe
