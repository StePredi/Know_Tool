id: py-eccezioni-proprie
tipo: ricetta
titolo: Creare un tipo di errore tutto tuo
sigla: Eccezioni proprie
comando: class MioErrore(Exception)
frase: derivano da Exception
fonte: Documentazione ufficiale Python · Tutorial · 8.6 Eccezioni definite dall'utente
parole: eccezione personalizzata exception classe derivata error nome attributi
quando: Quando vuoi che chi usa il tuo codice possa prendere un errore specifico.
fasi:
- nome: Definisci
  righe:
  - codice: |-
      class SogliaFuoriRange(Exception):
          pass
    commento: 'Un errore tuo è una classe che deriva da Exception: basta anche solo pass, il nome basta a distinguerlo.'
    trappola: 'Nota: codice di esempio scritto qui. Secondo il tutorial le eccezioni derivano da Exception e il nome di solito finisce con "Error" (per esempio SogliaFuoriRangeError).'
    parti:
    - voce: 'class SogliaFuoriRange(Exception):'
      spiega: nuovo tipo di errore, figlio di Exception
    - voce: pass
      spiega: nessun contenuto extra
- nome: Usa
  righe:
  - codice: |-
      try:
          raise SogliaFuoriRange('valore fuori range')
      except SogliaFuoriRange as e:
          print(e)
    commento: Lo sollevi con raise e lo prendi con except, come un errore normale di Python.
    parti:
    - voce: raise SogliaFuoriRange(...)
      spiega: crea l'errore con un messaggio e interrompe il flusso
    - voce: 'except SogliaFuoriRange as e:'
      spiega: prende solo questo tipo di errore
    - voce: print(e)
      spiega: stampa il messaggio
segnaposto: {}
varianti: []
vicine:
- py-raise
- py-classe
