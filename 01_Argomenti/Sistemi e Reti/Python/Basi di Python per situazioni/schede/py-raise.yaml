id: py-raise
tipo: ricetta
titolo: Segnalare un errore con raise
sigla: raise
comando: raise Errore(...)
frase: da solo rilancia l'errore corrente
fonte: Documentazione ufficiale Python · Tutorial · 8.4 Sollevare eccezioni · 8.5 Concatenamento
parole: raise sollevare eccezione rilanciare from chain valueerror nameerror
quando: Quando il tuo codice trova una situazione che non può gestire e deve avvisare chi lo chiama.
fasi:
- nome: Sollevare
  righe:
  - codice: raise ValueError('valore non valido')
    commento: raise interrompe il programma con un errore e un messaggio.
    parti:
    - voce: ValueError
      spiega: tipo di errore
    - voce: '''valore non valido'''
      spiega: messaggio
- nome: Rilanciare
  righe:
  - codice: 'try:'
    commento: 'Dentro un except, raise da solo rilancia l''errore appena preso: lo vedi, lo registri, lo fai proseguire.'
  - codice: '    raise NameError(''HiThere'')'
    parti:
    - voce: raise
      spiega: lo rilancia
  - codice: 'except NameError:'
    parti:
    - voce: 'except NameError:'
      spiega: prende l'errore
  - codice: '    print(''An exception flew by!'')'
  - codice: '    raise'
- nome: Indicare la causa
  righe:
  - codice: raise RuntimeError from exc
    commento: from collega il nuovo errore a quello che lo ha causato, per capire la catena.
    trappola: from None elimina il collegamento al primo errore.
    parti:
    - voce: raise A from exc
      spiega: A è stato causato da exc
segnaposto: {}
varianti: []
vicine:
- py-try-except
- py-eccezioni-proprie
