id: py-eredita
tipo: ricetta
titolo: Costruire una classe a partire da un'altra
sigla: Ereditarietà
comando: class Derivata(Base)
frase: la classe figlia riusa e cambia
fonte: Documentazione ufficiale Python · Tutorial · 9.5 Ereditarietà
parole: ereditarietà classe derivata base override super isinstance issubclass metodo sovrascrivere
quando: Quando una classe è una versione più specifica di un'altra.
fasi:
- nome: Derivare
  righe:
  - codice: 'class DerivedClassName(BaseClassName):'
    commento: 'Scrivi il nome della classe base tra parentesi: la nuova classe eredita tutti i suoi attributi e metodi.'
    parti:
    - voce: DerivedClassName
      spiega: la classe nuova (figlia)
    - voce: (BaseClassName)
      spiega: la classe da cui eredita (base)
  - codice: '    ...'
    parti:
    - voce: '...'
      spiega: qui aggiungi o cambi solo quello che serve
- nome: Cambiare un metodo
  righe:
  - codice: '# nella classe derivata: scrivi un metodo con lo stesso nome'
    commento: 'Se la figlia scrive un metodo con lo stesso nome della base, vale quello della figlia: si chiama override.'
    parti:
    - voce: stesso nome del metodo
      spiega: la ricerca si ferma alla prima classe che lo ha, partendo dalla figlia
  - codice: BaseClassName.methodname(self, arguments)
    commento: Per aggiungere qualcosa al metodo della base, invece di sostituirlo, lo richiami esplicitamente dentro il nuovo.
    trappola: 'Nota: nel codice moderno si usa di solito super() (come in super().__init__(...) dei thread); il tutorial qui mostra BaseClassName.methodname(self, ...).'
    parti:
    - voce: BaseClassName.methodname
      spiega: il metodo della base
    - voce: self, arguments
      spiega: l'oggetto e gli argomenti da passargli
- nome: Controllare il tipo
  righe:
  - codice: isinstance(obj, int)
    commento: 'Due funzioni per controllare i tipi: la prima su un oggetto, la seconda su due classi.'
    parti:
    - voce: isinstance(obj, int)
      spiega: True se obj è un int o un tipo derivato
  - codice: issubclass(bool, int)
    parti:
    - voce: issubclass(bool, int)
      spiega: 'True: bool è figlia di int'
segnaposto: {}
varianti: []
vicine:
- py-classe
- py-privati
