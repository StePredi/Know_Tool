id: py-def
tipo: ricetta
titolo: Scrivere una funzione che restituisce un valore
sigla: Funzione
comando: 'def nome(...):  return'
frase: senza return restituisce None
fonte: Documentazione ufficiale Python · Tutorial · 4.8 Definire funzioni
parole: funzione def return docstring none restituire valore parametri fibonacci
quando: Quando un pezzo di codice va riusato o ha un risultato da restituire.
fasi:
- nome: Definisci
  righe:
  - codice: 'def fib2(n):'
    commento: La funzione costruisce la serie di Fibonacci fino a n e restituisce la lista dei valori trovati.
    trappola: return senza valore, o arrivare in fondo alla funzione, restituisce None.
    parti:
    - voce: 'def fib2(n):'
      spiega: definisce la funzione con un parametro
  - codice: '    """Return a list containing the Fibonacci series up to n."""'
    parti:
    - voce: '"""Return a list..."""'
      spiega: 'docstring: descrive cosa fa la funzione'
  - codice: '    result = []'
  - codice: '    a, b = 0, 1'
    parti:
    - voce: a, b = 0, 1
      spiega: assegna due variabili insieme
  - codice: '    while a < n:'
  - codice: '        result.append(a)'
    parti:
    - voce: result.append(a)
      spiega: aggiunge il valore alla lista
  - codice: '        a, b = b, a+b'
  - codice: '    return result'
    parti:
    - voce: return result
      spiega: restituisce la lista a chi ha chiamato
- nome: Usa
  righe:
  - codice: fib2(100)
    commento: 'Chiami la funzione con un valore e usi il risultato: puoi stamparlo o metterlo in una variabile.'
    parti:
    - voce: fib2(100)
      spiega: lista dei numeri di Fibonacci minori di 100
segnaposto: {}
varianti: []
vicine:
- py-argomenti
- py-args-kwargs
