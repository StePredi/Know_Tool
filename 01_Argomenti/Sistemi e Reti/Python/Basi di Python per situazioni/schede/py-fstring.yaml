id: py-fstring
tipo: ricetta
titolo: Mettere valori dentro un testo con le f-string
sigla: f-string
comando: f"...{valore}..."
frase: espressioni tra graffe
fonte: Documentazione ufficiale Python · Tutorial · Input e output
parole: f-string formattare stampa valore graffe format precisione decimali larghezza repr debugging
quando: Quando devi costruire un testo a partire da variabili e numeri.
fasi:
- nome: Valori nel testo
  righe:
  - codice: |-
      year = 2016
      event = 'Referendum'
      f'Results of the {year} {event}'
    commento: Con la f davanti al testo, ciò che sta tra { } viene sostituito dal valore della variabile.
    parti:
    - voce: f'...'
      spiega: f-string
    - voce: '{year}'
      spiega: il valore della variabile year
- nome: Numeri formattati
  righe:
  - codice: |-
      import math
      print(f'The value of pi is approximately {math.pi:.3f}.')
    commento: 'Dopo i due punti si indica il formato: .3f significa tre cifre dopo la virgola.'
    parti:
    - voce: '{math.pi:.3f}'
      spiega: pi greco arrotondato a 3.142
  - codice: |-
      for name, phone in table.items():
          print(f'{name:10} ==> {phone:10d}')
    commento: 'Un numero dopo i due punti riserva uno spazio di quella larghezza: serve a incolonnare.'
    trappola: Il testo non viene troncato se è più lungo della larghezza.
    parti:
    - voce: '{name:10}'
      spiega: nome in 10 caratteri
    - voce: '{phone:10d}'
      spiega: numero intero in 10 caratteri
- nome: Per controllare
  righe:
  - codice: print(f'Debugging {bugs=} {count=}')
    commento: 'Utile per il debug: scrivi {x=} e ottieni nome e valore.'
    parti:
    - voce: '{bugs=}'
      spiega: stampa bugs='roaches'
  - codice: print(f'My hovercraft is full of {animals!r}.')
    commento: '!r mostra il valore come si scrive nel codice, quindi le stringhe hanno gli apici.'
    parti:
    - voce: '!r'
      spiega: 'repr(): mostra anche gli apici'
segnaposto: {}
varianti:
- codice: '"{} e {}".format(a, b)'
  spiega: 'modo più vecchio: str.format(), ancora molto usato'
vicine:
- py-print-input
- py-stringhe
