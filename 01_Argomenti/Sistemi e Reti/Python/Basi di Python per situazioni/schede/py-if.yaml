id: py-if
tipo: ricetta
titolo: Fare una scelta con if, elif ed else
sigla: if
comando: if / elif / else
frase: una sola strada viene eseguita
fonte: Documentazione ufficiale Python · Tutorial · 4.1 if
parole: if elif else condizione scelta confronto indentazione ramo
quando: Quando il programma deve fare cose diverse a seconda di una condizione.
fasi:
- nome: Le condizioni in ordine
  righe:
  - codice: 'if x < 0:'
    commento: Python controlla le condizioni dall'alto in basso e si ferma alla prima vera. L'else prende tutto il resto.
    trappola: Possono esserci zero o più elif, e l'else è facoltativo. I blocchi si riconoscono dall'indentazione.
    parti:
    - voce: 'if x < 0:'
      spiega: prima condizione
    - voce: == e <
      spiega: == confronta, = assegna
  - codice: '    x = 0'
  - codice: '    print(''Negative changed to zero'')'
  - codice: 'elif x == 0:'
    parti:
    - voce: 'elif x == 0:'
      spiega: altrimenti, se questa è vera
  - codice: '    print(''Zero'')'
  - codice: 'elif x == 1:'
  - codice: '    print(''Single'')'
  - codice: 'else:'
    parti:
    - voce: 'else:'
      spiega: se nessuna è vera
  - codice: '    print(''More'')'
segnaposto: {}
varianti: []
vicine:
- py-for
- py-while
