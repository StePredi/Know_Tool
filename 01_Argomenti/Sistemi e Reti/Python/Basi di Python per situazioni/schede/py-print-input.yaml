id: py-print-input
tipo: ricetta
titolo: 'Mostrare e leggere dati: print e input'
sigla: print e input
comando: print()  input()
frase: input restituisce sempre testo
fonte: Documentazione ufficiale Python · Tutorial · Introduzione · Gestione degli errori
parole: print input end sep stampare leggere tastiera int conversione valueerror numero utente
quando: Quando il programma deve scrivere a schermo e chiedere qualcosa all'utente.
fasi:
- nome: Stampare
  righe:
  - codice: i = 256*256
    commento: print accetta più valori separati da virgola e li stampa con uno spazio in mezzo.
  - codice: print('The value of i is', i)
    parti:
    - voce: print(a, b)
      spiega: a e b separati da uno spazio
  - codice: print(a, end=',')
    commento: Con end= scegli cosa stampare alla fine, per esempio una virgola invece dell'a capo.
    parti:
    - voce: end=','
      spiega: niente a capo, ma una virgola
- nome: Leggere
  righe:
  - codice: 'x = int(input("Please enter a number: "))'
    commento: input() mostra una domanda e restituisce sempre testo. Per avere un numero lo converti.
    trappola: 'Se l''utente scrive qualcosa che non è un numero, int() dà ValueError: vedi la scheda su try/except.'
    parti:
    - voce: input("...")
      spiega: mostra il messaggio e aspetta Invio
    - voce: int(...)
      spiega: da testo a numero intero
segnaposto: {}
varianti: []
vicine:
- py-fstring
- py-try-except
