id: py-list-comprehension
tipo: ricetta
titolo: Costruire una lista da un'altra in una riga
sigla: List comprehension
comando: '[espressione for x in ...]'
frase: un ciclo dentro le parentesi quadre
fonte: Documentazione ufficiale Python · Tutorial · 5.1.3 Comprensioni di liste
parole: list comprehension lista comprensione for if filtro quadrati nested tuple parentesi
quando: Quando devi trasformare o filtrare gli elementi di una sequenza.
fasi:
- nome: Trasformare
  righe:
  - codice: squares = [x**2 for x in range(10)]
    commento: 'Costruisce una lista in una riga: per ogni x da 0 a 9 mette x al quadrato.'
    parti:
    - voce: x**2
      spiega: il valore che va nella lista
    - voce: for x in range(10)
      spiega: da dove vengono gli x
  - codice: |-
      vec = [-4, -2, 0, 2, 4]
      [abs(x) for x in vec]
    commento: Applichi una funzione a ogni elemento.
    parti:
    - voce: abs(x)
      spiega: valore assoluto
- nome: Filtrare
  righe:
  - codice: '[x for x in vec if x >= 0]'
    commento: Con if tieni solo gli elementi che rispettano la condizione.
    parti:
    - voce: if x >= 0
      spiega: filtro
- nome: Coppie e liste annidate
  righe:
  - codice: '[(x, x**2) for x in range(6)]'
    commento: Per ogni numero crei una coppia (numero, quadrato).
    trappola: '[x, x**2 for x in range(6)] è un SyntaxError: la tupla (x, x**2) vuole le parentesi.'
    parti:
    - voce: (x, x**2)
      spiega: 'tupla: serve la parentesi'
  - codice: '[num for elem in [[1,2,3], [4,5,6]] for num in elem]'
    commento: 'Due for di fila: il primo scorre le liste, il secondo i numeri dentro ciascuna. Il risultato è una lista unica.'
    parti:
    - voce: for elem in [...]
      spiega: prima lista, poi seconda
    - voce: for num in elem
      spiega: elementi della lista corrente
segnaposto: {}
varianti: []
vicine:
- py-lista-metodi
- py-dizionario
