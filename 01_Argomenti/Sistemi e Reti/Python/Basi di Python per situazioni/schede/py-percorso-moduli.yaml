id: py-percorso-moduli
tipo: ricetta
titolo: Capire dove Python cerca i moduli
sigla: Percorso dei moduli
comando: sys.path  dir()
frase: la cartella dello script viene per prima
fonte: Documentazione ufficiale Python · Tutorial · 6.1.2 Il percorso di ricerca · 6.3 dir()
parole: sys path modulo cerca percorso pythonpath nome file stesso nome libreria dir shadowing
quando: Quando import non trova un modulo o ne importa uno diverso da quello che pensavi.
fasi:
- nome: Dove cerca
  righe:
  - codice: |-
      import sys
      print(sys.path)
    commento: Quando scrivi import x, Python cerca x nelle cartelle di sys.path, nell'ordine. La prima è quella dello script.
    trappola: Un tuo file con lo stesso nome di un modulo della libreria (per esempio un file socket.py o json.py) viene importato al posto di quello vero.
    parti:
    - voce: sys.path
      spiega: lista di cartelle
    - voce: print(...)
      spiega: la mostri per capire da dove viene un import
  - codice: sys.path.append('/ufs/guido/lib/python')
    commento: Puoi aggiungere una cartella, ma vale solo finché il programma gira.
    parti:
    - voce: sys.path.append(...)
      spiega: aggiunge un percorso in fondo
- nome: Vedere cosa contiene un modulo
  righe:
  - codice: dir(fibo)
    commento: 'dir() elenca i nomi definiti in un modulo: utile per vedere cosa contiene.'
    parti:
    - voce: dir(fibo)
      spiega: nomi in ordine alfabetico
segnaposto: {}
varianti: []
vicine:
- py-import
- py-pacchetti
