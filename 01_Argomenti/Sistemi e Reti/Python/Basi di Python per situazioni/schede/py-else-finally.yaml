id: py-else-finally
tipo: ricetta
titolo: Eseguire codice solo se va tutto bene, o sempre
sigla: else e finally
comando: try ... else ... finally
frase: finally gira sempre
fonte: Documentazione ufficiale Python · Tutorial · 8.3 else e finally
parole: else finally try except pulizia sempre eseguito divisione file chiudere
quando: Quando serve distinguere il caso "nessun errore" e fare pulizia in ogni caso.
fasi:
- nome: 'else: solo se non ci sono errori'
  righe:
  - codice: 'for arg in sys.argv[1:]:'
    commento: Se open() va a buon fine si esegue l'else; altrimenti l'except. Nell'else stanno le istruzioni da fare solo con successo.
  - codice: '    try:'
  - codice: '        f = open(arg, ''r'')'
  - codice: '    except OSError:'
    parti:
    - voce: 'except OSError:'
      spiega: il file non si apre
  - codice: '        print(''cannot open'', arg)'
  - codice: '    else:'
    parti:
    - voce: 'else:'
      spiega: solo se il try è andato bene
  - codice: '        print(arg, ''has'', len(f.readlines()), ''lines'')'
    parti:
    - voce: len(f.readlines())
      spiega: numero di righe del file
  - codice: '        f.close()'
- nome: 'finally: in ogni caso'
  righe:
  - codice: 'def divide(x, y):'
    commento: 'Tre rami diversi: errore previsto (except), nessun errore (else), e il finally che gira sempre.'
    trappola: Se l'errore non è gestito, il finally gira comunque e poi l'errore viene rilanciato.
  - codice: '    try:'
  - codice: '        result = x / y'
  - codice: '    except ZeroDivisionError:'
    parti:
    - voce: 'except ZeroDivisionError:'
      spiega: divisione per zero
  - codice: '        print("division by zero!")'
  - codice: '    else:'
    parti:
    - voce: 'else:'
      spiega: solo se non c'è stato errore
  - codice: '        print("result is", result)'
  - codice: '    finally:'
    parti:
    - voce: 'finally:'
      spiega: sempre, anche con un errore non gestito
  - codice: '        print("executing finally clause")'
segnaposto: {}
varianti: []
vicine:
- py-try-except
- py-with
