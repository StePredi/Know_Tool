id: py-dizionario
tipo: ricetta
titolo: 'Associare chiavi e valori: i dizionari'
sigla: Dizionari
comando: '{chiave: valore}  get()'
frase: get non dà errore se manca la chiave
fonte: Documentazione ufficiale Python · Tutorial · 5.5 Dizionari
parole: dizionario dict chiave valore get keyerror del in comprehension items aggiungere
quando: Quando devi cercare un valore a partire da un nome.
fasi:
- nome: Creare e leggere
  righe:
  - codice: 'tel = {''jack'': 4098, ''sape'': 4139}'
    commento: Un dizionario associa chiavi a valori. Assegnando a una chiave nuova la aggiungi; leggendola con le parentesi quadre ottieni il valore.
    parti:
    - voce: '{''jack'': 4098, ...}'
      spiega: 'chiave: valore'
  - codice: tel['guido'] = 4127
    parti:
    - voce: tel['guido'] = 4127
      spiega: aggiunge (o cambia) la chiave guido
  - codice: tel['jack']
    parti:
    - voce: tel['jack']
      spiega: 'legge il valore: 4098'
  - codice: tel.get('irv')
    commento: 'get() è il modo sicuro per leggere: se la chiave manca non dà errore.'
    trappola: 'tel[''irv''] dà KeyError se la chiave manca: usa get() oppure controlla prima con ''irv'' in tel.'
    parti:
    - voce: tel.get('irv')
      spiega: None se la chiave non c'è
    - voce: tel.get('irv', 0)
      spiega: oppure un valore di riserva a tua scelta
- nome: Togliere e controllare
  righe:
  - codice: del tel['sape']
    commento: del toglie una chiave; in controlla se una chiave c'è; list() e sorted() danno l'elenco delle chiavi.
    parti:
    - voce: del tel['sape']
      spiega: elimina la chiave e il suo valore
  - codice: '''guido'' in tel'
    parti:
    - voce: '''guido'' in tel'
      spiega: True/False sulle chiavi
  - codice: list(tel)
  - codice: sorted(tel)
    parti:
    - voce: sorted(tel)
      spiega: chiavi in ordine alfabetico
- nome: Costruire
  righe:
  - codice: '{x: x**2 for x in (2, 4, 6)}'
    commento: Come per le liste, una comprehension costruisce un dizionario in una riga.
    parti:
    - voce: '{x: x**2 for x in (2, 4, 6)}'
      spiega: 'chiave x, valore x al quadrato → {2: 4, 4: 16, 6: 36}'
  - codice: dict(sape=4139, guido=4127, jack=4098)
    commento: dict(...) con parole semplici come chiavi evita le virgolette.
    parti:
    - voce: dict(sape=4139, ...)
      spiega: 'le chiavi diventano stringhe: ''sape'', ''guido'', ''jack'''
segnaposto: {}
varianti: []
vicine:
- py-cicli-utili
- py-list-comprehension
- py-tuple
