id: py-stringhe
tipo: ricetta
titolo: 'Scrivere testo: apici, a capo e percorsi'
sigla: Stringhe
comando: '''...'' "..." r''...'' """..."""'
frase: apici, escape e stringhe grezze
fonte: Documentazione ufficiale Python · Tutorial · Introduzione
parole: stringhe apici virgolette escape a capo newline raw string percorso windows backslash triple quotes
quando: Quando devi scrivere testo con apici, a capo, backslash o su più righe.
fasi:
- nome: Apici dentro il testo
  righe:
  - codice: '''doesn\''t'''
    commento: Se il testo contiene un apice puoi scriverlo con \ davanti.
    parti:
    - voce: \'
      spiega: apice dentro il testo
  - codice: '"doesn''t"'
    commento: Oppure racchiudi il testo tra virgolette doppie.
    parti:
    - voce: '"..."'
      spiega: così l'apice non dà problemi
- nome: A capo
  righe:
  - codice: |-
      s = 'First line.\nSecond line.'
      print(s)
    commento: \n significa a capo. Nell'interprete lo vedi come \n, con print() come vera riga nuova.
    parti:
    - voce: \n
      spiega: a capo
    - voce: print(s)
      spiega: lo mostra
- nome: Backslash nei percorsi
  righe:
  - codice: print(r'C:\this\name')
    commento: 'r davanti al testo: raw. I backslash non vengono interpretati, utile per i percorsi Windows.'
    trappola: Senza la r, \t diventa una tabulazione e \n un a capo. Una stringa grezza non può finire con un numero dispari di backslash.
    parti:
    - voce: r'...'
      spiega: stringa grezza
- nome: Più righe
  righe:
  - codice: |-
      print("""\
      Usage: thingy [OPTIONS]
           -h    Display this usage message
      """)
    commento: Tre virgolette per testo su più righe. Il \ finale toglie il primo a capo.
    parti:
    - voce: '"""...."""'
      spiega: più righe
    - voce: \
      spiega: 'a fine riga: non andare a capo'
segnaposto: {}
varianti: []
vicine:
- py-stringhe-operazioni
- py-fstring
