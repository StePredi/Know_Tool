id: py-stringhe-operazioni
tipo: ricetta
titolo: Unire, ripetere e modificare stringhe
sigla: Operazioni sulle stringhe
comando: +  *  immutabili
frase: le stringhe non si modificano
fonte: Documentazione ufficiale Python · Tutorial · Introduzione
parole: stringhe concatenare unire ripetere immutabili immutable typeerror item assignment sostituire carattere
quando: Quando devi unire testi, ripeterli o cambiare un carattere.
fasi:
- nome: Unire e ripetere
  righe:
  - codice: 3 * 'un' + 'ium'
    commento: + unisce due stringhe, * le ripete.
    parti:
    - voce: 3 * 'un'
      spiega: '''ununun'''
    - voce: + 'ium'
      spiega: si attacca alla fine
  - codice: prefix = 'Py'
    commento: Con una variabile devi usare il +.
    trappola: Due testi scritti per esteso uno accanto all'altro ('Py' 'thon') si uniscono da soli; con una variabile, prefix 'thon' dà SyntaxError.
  - codice: prefix + 'thon'
    parti:
    - voce: prefix + 'thon'
      spiega: '''Python'''
- nome: Cambiare un carattere
  righe:
  - codice: word = 'Python'
    commento: 'Le stringhe non si modificano: per cambiarle ne costruisci una nuova.'
    trappola: 'word[0] = ''J'' dà TypeError: le stringhe sono immutabili e non si cambiano sul posto.'
  - codice: '''J'' + word[1:]'
    parti:
    - voce: '''J'' + word[1:]'
      spiega: '''J'' più tutto da ''y'' in poi'
segnaposto: {}
varianti: []
vicine:
- py-stringhe
- py-fette
