id: py-copia-lista
tipo: ricetta
titolo: Copiare una lista (e non solo il suo nome)
sigla: Copiare una lista
comando: rgba = rgb[:]
frase: due nomi per la stessa lista
fonte: Documentazione ufficiale Python · Tutorial · 3. Introduzione · 5. Strutture dati
parole: copia lista alias riferimento slice copy shallow nested annidata modifica
quando: Quando vuoi una lista indipendente e non un altro nome per la stessa lista.
fasi:
- nome: Un altro nome (non una copia)
  righe:
  - codice: rgba = rgb
    commento: 'rgba = rgb non copia niente: crea un secondo nome per la stessa lista. Se modifichi una, cambia anche l''altra.'
    trappola: 'L''assegnazione non copia: dà solo un secondo nome allo stesso oggetto.'
    parti:
    - voce: rgba = rgb
      spiega: due nomi, un solo oggetto
- nome: Una copia vera
  righe:
  - codice: correct_rgba = rgba[:]
    commento: 'Per avere una copia vera usa una fetta completa oppure copy(). È una copia "superficiale": copia la lista, non gli oggetti dentro.'
    parti:
    - voce: rgba[:]
      spiega: fetta dall'inizio alla fine = nuova lista
  - codice: correct_rgba = rgba.copy()
    parti:
    - voce: rgba.copy()
      spiega: stesso risultato, più esplicito
  - codice: x = [a, n]
    commento: 'Se la lista contiene altre liste, la copia superficiale le condivide: modificare una lista interna cambia entrambe le copie.'
    parti:
    - voce: x = [a, n]
      spiega: lista che contiene la lista a
  - codice: x[0][1]
    parti:
    - voce: x[0][1]
      spiega: secondo elemento della lista interna a
segnaposto: {}
varianti: []
vicine:
- py-lista-metodi
- py-fette
