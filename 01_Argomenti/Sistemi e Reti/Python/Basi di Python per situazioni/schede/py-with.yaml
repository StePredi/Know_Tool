id: py-with
tipo: ricetta
titolo: Aprire e chiudere una risorsa con with
sigla: with
comando: 'with ... as ...:'
frase: si chiude da solo
fonte: Documentazione ufficiale Python · Tutorial · 8.7 Azioni di pulizia
parole: with context manager file chiudere automaticamente risorsa pulizia open lock
quando: Quando una risorsa (un file, un lock) va sempre rilasciata, anche se c'è un errore.
fasi:
- nome: Il with
  righe:
  - codice: |-
      with open("myfile.txt") as f:
          for line in f:
              print(line, end="")
    commento: with apre il file e lo chiude da solo alla fine del blocco, anche in caso di errore. Dentro puoi leggere riga per riga con un for.
    trappola: Senza with il file resta aperto per un tempo indeterminato.
    parti:
    - voce: open("myfile.txt")
      spiega: apre il file
    - voce: as f
      spiega: il file si chiama f dentro il blocco
    - voce: for line in f
      spiega: legge una riga alla volta
    - voce: end=""
      spiega: le righe hanno già il loro a capo
segnaposto: {}
varianti: []
vicine:
- py-try-except
- py-else-finally
