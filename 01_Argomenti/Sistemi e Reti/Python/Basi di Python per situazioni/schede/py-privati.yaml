id: py-privati
tipo: ricetta
titolo: 'Nomi "privati" in una classe: _x e __x'
sigla: Nomi privati
comando: _nome  __nome
frase: una convenzione, non un blocco
fonte: Documentazione ufficiale Python · Tutorial · 9.6 Variabili private
parole: privato underscore name mangling doppio underscore attributo interno classe
quando: Quando un attributo o un metodo è un dettaglio interno e non va usato da fuori.
fasi:
- nome: Convenzione
  righe:
  - codice: self._cache = {}
    commento: Per convenzione il nome che comincia con un underscore dice "non usarlo da fuori".
    parti:
    - voce: self._cache
      spiega: attributo interno
- nome: Name mangling
  righe:
  - codice: |-
      class Mapping:
          def __init__(self, iterable):
              self.items_list = []
              self.__update(iterable)

          def update(self, iterable):
              for item in iterable:
                  self.items_list.append(item)

          __update = update
    commento: 'Con due underscore Python cambia il nome (name mangling): __update diventa _Mapping__update. Così una sottoclasse può ridefinire update() senza rompere __init__.'
    trappola: 'Non è una vera protezione: si può comunque accedere all''attributo con il nome modificato.'
    parti:
    - voce: self.__update(iterable)
      spiega: chiama la copia privata
    - voce: def update
      spiega: metodo pubblico, che le sottoclassi possono cambiare
    - voce: __update = update
      spiega: copia privata di update
segnaposto: {}
varianti: []
vicine:
- py-classe
- py-eredita
