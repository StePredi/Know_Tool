id: py-generatori
tipo: ricetta
titolo: Produrre valori uno alla volta con yield
sigla: Generatori
comando: yield
frase: un iteratore scritto come funzione
fonte: Documentazione ufficiale Python · Tutorial · 9.8 Iteratori · 9.9 Generatori
parole: generatore yield iteratore iter next stopiteration for classe reverse
quando: Quando vuoi scorrere una sequenza di valori senza costruirla tutta in memoria.
fasi:
- nome: Con una funzione generatore
  righe:
  - codice: |-
      def reverse(data):
          for index in range(len(data)-1, -1, -1):
              yield data[index]

      for char in reverse('golf'):
          print(char)
    commento: 'ogni yield restituisce un valore e sospende la funzione: f l o g'
- nome: Con una classe (stesso risultato)
  righe:
  - codice: |-
      class Reverse:
          def __init__(self, data):
              self.data = data
              self.index = len(data)
          def __iter__(self):
              return self
          def __next__(self):
              if self.index == 0:
                  raise StopIteration
              self.index = self.index - 1
              return self.data[self.index]
    commento: __iter__ e __next__ sono quelli che il generatore crea da solo
    trappola: 'Il generatore è più corto: __iter__() e __next__() si creano automaticamente.'
