id: py-main
tipo: ricetta
titolo: Far partire un file come programma, ma non quando lo importi
sigla: if __name__ == "__main__"
comando: 'if __name__ == "__main__":'
frase: codice che gira solo da script
fonte: Documentazione ufficiale Python · Tutorial · 6.1.1 Eseguire i moduli come script
parole: main name script importare eseguire argv sys programma principale test
quando: Quando un file deve poter essere sia un programma sia un modulo da importare.
fasi:
- nome: In fondo al file
  righe:
  - codice: 'if __name__ == "__main__":'
    commento: Ogni file ha una variabile __name__. Se lo avvii direttamente vale "__main__"; se lo importi vale il nome del modulo. Così il blocco parte solo da programma.
    trappola: Se il modulo viene importato __name__ vale il nome del modulo e il blocco non parte.
    parti:
    - voce: __name__
      spiega: nome del modulo in esecuzione
    - voce: '"__main__"'
      spiega: valore quando il file è avviato direttamente
  - codice: '    import sys'
  - codice: '    fib(int(sys.argv[1]))'
    parti:
    - voce: sys.argv[1]
      spiega: primo argomento scritto dopo il nome del file
- nome: Lancialo dal terminale
  righe:
  - codice: python fibo.py 50
    commento: 'Da terminale: python, il nome del file e gli argomenti. Il programma riceve "50" come testo, per questo c''è int().'
    parti:
    - voce: fibo.py
      spiega: file da eseguire
    - voce: '50'
      spiega: 'argomento: sys.argv[1]'
segnaposto: {}
varianti: []
vicine:
- py-import
- py-percorso-moduli
