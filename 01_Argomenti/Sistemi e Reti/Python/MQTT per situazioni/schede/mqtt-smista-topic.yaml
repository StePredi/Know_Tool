id: mqtt-smista-topic
tipo: ricetta
titolo: Capire da quale topic arriva il messaggio
sigla: Smistare per topic
comando: message.topic
frase: un if per topic
fonte: gateway.py · monitor.py
parole: mqtt message topic smistare if elif cmd config dati alert stato get payload
quando: Quando la stessa callback riceve da più topic e ognuno va trattato in modo diverso.
fasi:
- nome: Confronta il topic
  righe:
  - codice: payload = json.loads(message.payload.decode('utf-8'))
    commento: message.topic dice da dove arriva, payload.get() legge i campi
    trappola: 'Si usa get() e non payload["cmd"]: se il campo manca restituisce None invece di dare errore.'
  - codice: 'if message.topic == TOPIC_CMD:'
  - codice: '    cmd = payload.get(''cmd'')'
  - codice: '    if cmd:'
  - codice: '        ...'
  - codice: 'elif message.topic == TOPIC_CONFIG:'
  - codice: '    th = payload.get(''th'')'
  - codice: '    if th is not None:'
  - codice: '        ...'
segnaposto: {}
varianti: []
vicine:
- mqtt-on-message
- mqtt-coda-uscita
