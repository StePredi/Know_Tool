id: thread-scrittura-file
tipo: ricetta
titolo: Scrivere su file i record che arrivano da una coda
sigla: Thread di scrittura
comando: open(..., "a") + json.dumps
frase: un record per riga
fonte: gateway.py
parole: scrittura file thread jsonl json dumps append coda log record ioerror
quando: Quando vuoi salvare i dati su file senza rallentare il resto del programma.
fasi:
- nome: Il ciclo di scrittura
  righe:
  - codice: 'while True:'
    commento: un record JSON per riga, in coda al file
    trappola: 'Il file si apre e si chiude a ogni record: più lento, ma ogni riga è già salvata quando il programma si interrompe.'
  - codice: '    try:'
  - codice: '        record = self.coda_log.get(timeout=1)'
    parti:
    - voce: '''a'''
      spiega: 'append: aggiunge in fondo senza cancellare quello che c''è'
  - codice: '        try:'
  - codice: '            with open(self.log_file, ''a'') as f:'
  - codice: '                f.write(json.dumps(record) + ''\n'')'
    parti:
    - voce: json.dumps(record) + '\n'
      spiega: una riga di testo JSON per ogni record
  - codice: '        except IOError as e:'
  - codice: '            self.logger.error(f"errore scrittura: {e}")'
  - codice: '    except queue.Empty:'
  - codice: '        pass'
segnaposto: {}
varianti: []
vicine:
- coda-attesa
- log-percorsi
