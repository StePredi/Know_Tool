id: thread-classe
tipo: ricetta
titolo: Far lavorare una classe in un thread tutto suo
sigla: Thread come classe
comando: threading.Thread + run
frase: un compito, un thread
fonte: gateway.py
parole: thread classe threading run start daemon name super init sottoclasse compito parallelo
quando: Quando una parte del programma deve girare in parallelo alle altre, con un ciclo suo.
fasi:
- nome: Scrivi la classe
  righe:
  - codice: |-
      class Scrittura(threading.Thread):
          def __init__(self, coda_log, log_file):
              super().__init__(name="Scrittura", daemon=True)
              self.coda_log = coda_log
              self.log_file = log_file
    commento: dai un nome al thread e passagli tutto quello che gli serve
    parti:
    - voce: name="Scrittura"
      spiega: nome del thread, utile nei log
    - voce: daemon=True
      spiega: si ferma da solo quando il programma principale termina
  - codice: "    def run(self):\n        while True:\n            ..."
    commento: il lavoro del thread, di solito un ciclo
    trappola: 'Il lavoro va in run(): il metodo non si chiama a mano.'
- nome: Avvialo
  righe:
  - codice: |-
      self.scrittura = Scrittura(self.coda_log, DATA_FILE)
      self.scrittura.start()
    commento: start() crea il thread e fa partire run()
    trappola: 'Si usa start(): chiamare run() direttamente lo eseguirebbe nel thread principale, senza parallelismo.'
segnaposto: {}
varianti: []
vicine:
- thread-funzione
- thread-main-vivo
- coda-per-direzione
