id: lock-acquire-timeout
tipo: ricetta
titolo: Provare a prendere il lock senza bloccarsi
sigla: acquire / release
comando: lock.acquire(timeout=...)
frase: restituisce True o False
fonte: Documentazione ufficiale Python · Libreria standard · threading · Lock Objects
parole: lock acquire release timeout blocking true false tentare bloccare
quando: Quando non vuoi aspettare per sempre che il lock si liberi.
fasi:
- nome: Con attesa massima
  righe:
  - codice: 'if lock.acquire(timeout=2):'
    commento: acquire() prende il lock; con timeout aspetta al massimo quel numero di secondi. Restituisce True se ce l'ha fatta.
    trappola: 'Il release() va fatto solo se l''acquire è riuscito, e in un finally: altrimenti il lock resta preso.'
    parti:
    - voce: acquire(timeout=2)
      spiega: aspetta fino a 2 secondi
  - codice: '    try:'
  - codice: '        ...'
  - codice: '    finally:'
    parti:
    - voce: 'finally: lock.release()'
      spiega: rilascia il lock sempre
  - codice: '        lock.release()'
  - codice: 'else:'
  - codice: '    print("lock occupato")'
- nome: Senza attendere
  righe:
  - codice: lock.acquire(blocking=False)
    commento: 'Senza attesa: o lo prendi subito o niente.'
    parti:
    - voce: blocking=False
      spiega: non aspettare
  - codice: lock.release()
    commento: release() rilascia il lock; va chiamato solo se lo hai preso.
    trappola: 'Nota: with lock: fa acquire e release da solo, ed è la forma più sicura.'
    parti:
    - voce: lock.release()
      spiega: su un lock non preso dà RuntimeError
segnaposto: {}
varianti: []
vicine:
- lock-with
- rlock
