id: rlock
tipo: ricetta
titolo: Lo stesso thread deve riprendere il lock
sigla: RLock
comando: threading.RLock()
frase: rientrante
fonte: Documentazione ufficiale Python · Libreria standard · threading · RLock Objects
parole: rlock lock rientrante deadlock stesso thread metodo chiama metodo
quando: Quando un metodo con il lock ne chiama un altro che prende lo stesso lock.
fasi:
- nome: Il problema con Lock
  righe:
  - codice: lock = threading.Lock()
    commento: Con un Lock normale, un thread che lo riprende mentre ce l'ha già resta bloccato per sempre.
    parti:
    - voce: threading.Lock()
      spiega: non rientrante
- nome: La soluzione
  righe:
  - codice: |-
      lock = threading.RLock()

      with lock:
          with lock:
              ...
    commento: 'RLock tiene il conto: lo stesso thread può riprenderlo più volte, e va rilasciato altrettante volte.'
    trappola: Solo il thread che lo ha preso può rilasciarlo, e deve rilasciarlo tante volte quante lo ha preso.
    parti:
    - voce: threading.RLock()
      spiega: rientrante
    - voce: 'with lock: with lock:'
      spiega: 'due acquisizioni dello stesso thread: nessun blocco'
segnaposto: {}
varianti: []
vicine:
- lock-with
- lock-acquire-timeout
