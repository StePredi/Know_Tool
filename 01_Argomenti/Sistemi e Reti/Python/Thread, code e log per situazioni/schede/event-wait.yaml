id: event-wait
tipo: ricetta
titolo: Aspettare un evento, al massimo per un po'
sigla: Event wait
comando: stop.wait(timeout)
frase: True se è scattato, False se è scaduto
fonte: Documentazione ufficiale Python · Libreria standard · threading · Event Objects
parole: event wait timeout attesa sleep fermare pausa interrompibile
quando: Quando vuoi una pausa tra due giri del ciclo che si interrompe subito alla richiesta di stop.
fasi:
- nome: Pausa interrompibile
  righe:
  - codice: 'while not stop.wait(timeout=1.0):'
    commento: 'wait(timeout) fa da pausa: se l''evento scatta, torna subito True; se scade il tempo torna False. Il ciclo continua finché è False.'
    trappola: 'Nota: con time.sleep(1) il thread non può essere svegliato prima; con wait sì.'
    parti:
    - voce: stop.wait(timeout=1.0)
      spiega: aspetta fino a 1 secondo
    - voce: while not ...
      spiega: continua se è scaduto il tempo senza segnale
  - codice: '    ...'
- nome: Aspetta e basta
  righe:
  - codice: evento.wait()
    commento: Senza timeout aspetta finché un altro thread chiama set().
    parti:
    - voce: evento.wait()
      spiega: si ferma qui
segnaposto: {}
varianti: []
vicine:
- event-ferma
- event-set-clear
