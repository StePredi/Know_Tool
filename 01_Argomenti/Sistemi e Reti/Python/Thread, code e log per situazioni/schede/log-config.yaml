id: log-config
tipo: ricetta
titolo: Impostare il logging su file e console
sigla: Configurare il log
comando: logging.basicConfig
frase: livello, formato, destinazioni
fonte: gateway.py
parole: logging basicconfig level format datefmt handlers filehandler streamhandler console file debug formato
quando: Quando vuoi che il programma scriva cosa sta facendo, su file e sullo schermo.
fasi:
- nome: Una sola configurazione, all'avvio
  righe:
  - codice: logging.basicConfig(
    commento: scrive su file e sulla console, con ora, nome e livello
    trappola: basicConfig va chiamata una volta sola, nel main, prima di usare i logger.
  - codice: '    level=logging.DEBUG,'
  - codice: '    format="[%(asctime)s] [%(name)s] %(levelname)s: %(message)s",'
    parti:
    - voce: '%(name)s'
      spiega: nome del logger che ha scritto il messaggio
  - codice: '    datefmt="%H:%M:%S",'
  - codice: '    handlers=['
    parti:
    - voce: handlers
      spiega: 'le destinazioni: file e console'
  - codice: '        logging.FileHandler(LOG_FILE),'
  - codice: '        logging.StreamHandler()'
  - codice: '    ]'
  - codice: )
segnaposto: {}
varianti: []
vicine:
- log-livelli
- log-classe
- log-percorsi
