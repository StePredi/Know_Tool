id: event-ferma
tipo: ricetta
titolo: Dire a un thread di fermarsi
sigla: Event per fermare
comando: stop.set()  while not stop.is_set()
frase: un interruttore tra thread
fonte: Documentazione ufficiale Python · Libreria standard · threading · Event Objects
parole: event set is_set stop fermare thread ciclo while join is_alive
quando: Quando un thread gira in un ciclo e devi poterlo fermare da fuori.
fasi:
- nome: Il thread controlla
  righe:
  - codice: |-
      stop = threading.Event()

      def lavoro():
          while not stop.is_set():
              ...
    commento: 'Il thread controlla l''evento ad ogni giro del ciclo: finché non è impostato, continua a lavorare.'
    parti:
    - voce: threading.Event()
      spiega: interruttore condiviso, all'inizio spento
    - voce: stop.is_set()
      spiega: True se qualcuno ha chiamato set()
- nome: Il main ferma
  righe:
  - codice: |-
      stop.set()
      t.join()
    commento: Il main alza il segnale e aspetta che il thread finisca.
    parti:
    - voce: stop.set()
      spiega: dà il segnale
    - voce: t.join()
      spiega: aspetta la fine del thread
  - codice: t.is_alive()
    commento: Per sapere se il thread sta ancora girando.
    trappola: 'Se dentro il ciclo il thread resta bloccato (per esempio su una coda), non vede il segnale: usa un timeout.'
    parti:
    - voce: t.is_alive()
      spiega: True/False
segnaposto: {}
varianti: []
vicine:
- event-wait
- event-set-clear
- thread-chiudi
