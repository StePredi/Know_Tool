id: lock-with
tipo: ricetta
titolo: Far entrare un thread alla volta in un pezzo di codice
sigla: Lock con with
comando: 'with lock:'
frase: un solo thread per volta
fonte: Documentazione ufficiale Python · Libreria standard · threading · Lock Objects
parole: lock with acquire release mutex dati condivisi thread sezione critica threading
quando: Quando più thread leggono e modificano gli stessi dati.
fasi:
- nome: Crea il lock una volta
  righe:
  - codice: lock = threading.Lock()
    commento: 'Un Lock è un "lucchetto": un solo thread alla volta può tenerlo. Va creato una volta sola, fuori dai thread.'
    parti:
    - voce: threading.Lock()
      spiega: crea il lucchetto
- nome: Proteggi il pezzo di codice
  righe:
  - codice: 'with lock:'
    commento: Dentro with lock entra un thread alla volta; gli altri aspettano fuori. All'uscita il lock viene rilasciato da solo, anche in caso di errore.
    trappola: 'Il lock deve essere lo stesso oggetto per tutti i thread: se ognuno ne crea uno suo, non protegge nulla.'
    parti:
    - voce: 'with lock:'
      spiega: acquisisce il lock ed entra
  - codice: '    stato["contatore"] += 1'
    parti:
    - voce: stato["contatore"] += 1
      spiega: operazione che non deve essere interrotta da un altro thread
segnaposto: {}
varianti: []
vicine:
- lock-acquire-timeout
- lock-stato
- rlock
