id: event-set-clear
tipo: ricetta
titolo: Alzare, abbassare e controllare l'evento
sigla: set / clear / is_set
comando: set()  clear()  is_set()
frase: un flag interno
fonte: Documentazione ufficiale Python · Libreria standard · threading · Event Objects
parole: event set clear is_set flag segnale thread
quando: Quando un thread deve avvisare un altro che è successo qualcosa.
fasi:
- nome: I tre comandi
  righe:
  - codice: e.set()
    commento: 'set() alza il flag: chi aspettava con wait() riparte.'
    parti:
    - voce: e.set()
      spiega: flag a True
  - codice: e.clear()
    commento: 'clear() lo abbassa: wait() torna a bloccare.'
    parti:
    - voce: e.clear()
      spiega: flag a False
  - codice: e.is_set()
    commento: is_set() legge il flag senza aspettare.
    trappola: Un Event all'inizio è False.
    parti:
    - voce: e.is_set()
      spiega: True/False
segnaposto: {}
varianti: []
vicine:
- event-ferma
- event-wait
