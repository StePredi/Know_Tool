id: rd-scelta
tipo: ricetta
titolo: Quale lettura scegliere
sigla: Scegliere
comando: readline · readuntil · readexactly · read
frase: dipende da come sono i messaggi
fonte: 07_client_letture.py
parole: scegliere lettura readline readuntil readexactly read confronto
quando: Quando non sai quale funzione di lettura usare.
fasi:
- nome: In base ai dati
  righe:
  - codice: await reader.readline()
    commento: 'Messaggi a righe: la scelta più comune.'
    parti:
    - voce: readline()
      spiega: fino a \n
  - codice: await reader.readuntil(b";")
    commento: Se i messaggi finiscono con un carattere speciale.
    parti:
    - voce: readuntil(sep)
      spiega: fino al separatore
  - codice: await reader.readexactly(n)
    commento: Se ogni messaggio ha lunghezza nota.
    parti:
    - voce: readexactly(n)
      spiega: n byte precisi
  - codice: await reader.read(n)
    commento: Per leggere quello che c'è senza aspettare.
    parti:
    - voce: read(n)
      spiega: fino a n byte
  - codice: await reader.read()
    commento: Per leggere tutto fino alla fine della connessione.
    trappola: 'Nota: il client sceglie la lettura che corrisponde a come il server manda i dati.'
    parti:
    - voce: read()
      spiega: fino alla chiusura
segnaposto: {}
varianti: []
vicine:
- rd-readline
