id: asy-confronto
tipo: ricetta
titolo: 'Quanto si risparmia: sequenziale contro concorrente'
sigla: Confronto tempi
comando: time.time()
frase: 6 secondi contro 2
fonte: asyncio_guide_2627.ipynb · §1.6 Confronto diretto
parole: confronto sequenziale concorrente tempo download 2 secondi 6 secondi
quando: Quando vuoi capire a cosa serve davvero asyncio.
fasi:
- nome: Sequenziale
  righe:
  - codice: dati1 = await scarica_file("file1.txt", 2)
    commento: 'Tre await uno dopo l''altro: ogni download aspetta la fine del precedente.'
    parti:
    - voce: await scarica_file(...)
      spiega: esecuzione sequenziale
    - voce: 2 + 2 + 2
      spiega: 6 secondi
  - codice: dati2 = await scarica_file("file2.txt", 2)
  - codice: dati3 = await scarica_file("file3.txt", 2)
- nome: Concorrente
  righe:
  - codice: task1 = asyncio.create_task(scarica_file("file1.txt", 2))
    commento: 'Tre task creati subito, poi aspettati: durante l''attesa di uno, il loop fa partire gli altri.'
    parti:
    - voce: create_task x3
      spiega: tutti in coda
  - codice: task2 = asyncio.create_task(scarica_file("file2.txt", 2))
  - codice: task3 = asyncio.create_task(scarica_file("file3.txt", 2))
  - codice: dati1 = await task1
    parti:
    - voce: await task1 task2 task3
      spiega: tempo totale = il più lungo = 2 secondi
  - codice: dati2 = await task2
  - codice: dati3 = await task3
segnaposto: {}
varianti: []
vicine:
- asy-await-sequenziale
- asy-create-task
