id: asy-coroutine
tipo: ricetta
titolo: Scrivere una funzione che può mettersi in pausa
sigla: Coroutine
comando: async def
frase: chiamarla non la esegue
fonte: asyncio_intro_2627.ipynb · §2 Coroutines
parole: coroutine async def funzione cooperativa oggetto coroutine pigra
quando: Quando una funzione deve aspettare qualcosa di lento (rete, attesa) senza bloccare il resto del programma.
fasi:
- nome: Definisci
  righe:
  - codice: |-
      async def scarica_file(nome):
          print(f"Inizio download di {nome}")
          await asyncio.sleep(2)
          print(f"Completato download di {nome}")
          return f"Contenuto di {nome}"
    commento: 'async def crea una coroutine: una funzione che può fermarsi con await e riprendere dopo. Qui simula un download di 2 secondi.'
    parti:
    - voce: async def
      spiega: trasforma la funzione in coroutine
    - voce: await asyncio.sleep(2)
      spiega: pausa di 2 secondi che NON blocca il programma
    - voce: return
      spiega: il valore arriva a chi aspetta la coroutine
- nome: Chiamala
  righe:
  - codice: |-
      coro = scarica_file("documento.pdf")
      print(type(coro))
    commento: 'Chiamare la coroutine come una funzione normale non esegue il codice: restituisce un oggetto coroutine, una "promessa" di esecuzione.'
    trappola: 'Una coroutine chiamata non parte: la deve eseguire l''event loop (vedi asy-run).'
    parti:
    - voce: scarica_file("documento.pdf")
      spiega: 'nessun print: il corpo non è partito'
    - voce: type(coro)
      spiega: <class 'coroutine'>
segnaposto: {}
varianti: []
vicine:
- asy-run
- asy-await
- asy-senza-await
