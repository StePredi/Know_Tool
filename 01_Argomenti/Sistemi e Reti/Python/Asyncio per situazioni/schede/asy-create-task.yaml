id: asy-create-task
tipo: ricetta
titolo: Far partire un'operazione senza aspettarla subito
sigla: create_task
comando: asyncio.create_task(coro())
frase: la mette in coda nel loop
fonte: asyncio_guide_2627.ipynb · §1.3 task
parole: create_task task schedulare concorrente coda event loop
quando: Quando più operazioni possono andare insieme.
fasi:
- nome: Crea i task
  righe:
  - codice: |-
      task_a = asyncio.create_task(operazione_a())
      task_b = asyncio.create_task(operazione_b())
    commento: 'create_task() avvolge la coroutine in un task e la mette in coda nell''event loop. Non la esegue ancora: serve un punto in cui il loop è libero.'
    parti:
    - voce: create_task(...)
      spiega: restituisce il task
    - voce: task_a, task_b
      spiega: due compiti in coda
- nome: Aspetta i risultati
  righe:
  - codice: |-
      ris_b = await task_b
      ris_a = await task_a
    commento: 'Il primo await dà il controllo al loop: A e B partono e restano in attesa insieme. In 2 secondi sono finiti entrambi.'
    trappola: I task partono solo quando l'event loop ha un momento libero, cioè al primo await del chiamante.
    parti:
    - voce: await task_b
      spiega: sospende main finché B finisce
    - voce: await task_a
      spiega: 'A è già finito: risultato immediato'
segnaposto: {}
varianti: []
vicine:
- asy-gather
- asy-respiro
- asy-confronto
