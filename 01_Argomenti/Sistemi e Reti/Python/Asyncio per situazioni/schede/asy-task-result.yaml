id: asy-task-result
tipo: ricetta
titolo: Leggere il risultato senza await
sigla: result()
comando: task.result()
frase: solo se il task è finito
fonte: asyncio_guide_2627.ipynb · §2.3 result()
parole: result task invalidstateerror risultato senza await done
quando: Quando il task è finito e vuoi il risultato subito, senza sospenderti.
fasi:
- nome: Prima della fine
  righe:
  - codice: |-
      try:
          risultato = task.result()
      except asyncio.InvalidStateError as e:
          print(f"Errore: {e}")
    commento: result() su un task non ancora finito dà InvalidStateError.
    parti:
    - voce: task.result()
      spiega: prova a leggere il risultato
    - voce: asyncio.InvalidStateError
      spiega: il task non è finito
- nome: Dopo la fine
  righe:
  - codice: |-
      if task.done():
          risultato = task.result()
    commento: Quando done() è True, result() restituisce il valore senza await.
    trappola: Controlla done() prima di chiamare result().
    parti:
    - voce: 'if task.done():'
      spiega: controllo
    - voce: task.result()
      spiega: valore restituito dalla coroutine
segnaposto: {}
varianti: []
vicine:
- asy-task-stato
- asy-await-finito
