id: asy-await
tipo: ricetta
titolo: Cedere il controllo con await
sigla: await
comando: risultato = await operazione()
frase: '"io mi fermo, intanto fai altro"'
fonte: asyncio_intro_2627.ipynb · §3 await
parole: await sospendere cedere controllo awaitable coroutine task future
quando: Quando una coroutine arriva a un'operazione lenta.
fasi:
- nome: Cosa succede
  righe:
  - codice: 'async def esempio():'
    commento: Quando incontra await la coroutine si ferma e restituisce il controllo all'event loop, che può eseguire altro. Quando l'operazione ha finito, riparte dalla riga dopo.
  - codice: '    print("1. Inizio")'
    parti:
    - voce: print("1. Inizio")
      spiega: prima della pausa
    - voce: print("3. Riprendo...")
      spiega: dopo l'attesa
  - codice: '    risultato = await operazione_lenta()'
    parti:
    - voce: await operazione_lenta()
      spiega: qui la coroutine si sospende
  - codice: '    print("3. Riprendo dopo l''attesa")'
  - codice: '    return risultato'
- nome: Regole
  righe:
  - codice: await oggetto
    commento: 'await ha due regole: solo dentro async def, e solo su oggetti awaitable.'
    trappola: Nei thread decide il sistema operativo quando cambiare; qui decidi tu, con await.
    parti:
    - voce: coroutine
      spiega: awaitable
    - voce: Task
      spiega: awaitable
    - voce: Future
      spiega: awaitable
segnaposto: {}
varianti: []
vicine:
- asy-coroutine
- asy-vs-thread
- asy-senza-await
