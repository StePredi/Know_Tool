id: asy-wait-for
tipo: ricetta
titolo: Mettere un tempo massimo a un'operazione
sigla: wait_for
comando: asyncio.wait_for(coro(), timeout=2.0)
frase: scade con TimeoutError
fonte: asyncio_guide_2627.ipynb · §6.2 Timeout
parole: wait_for timeout tempo massimo timeouterror operazione lenta
quando: Quando un'operazione potrebbe non finire mai.
fasi:
- nome: Con timeout
  righe:
  - codice: 'try:'
    commento: wait_for dà un tempo massimo. Se l'operazione non finisce in tempo, solleva TimeoutError e viene interrotta.
  - codice: '    risultato = await asyncio.wait_for(operazione_lenta(), timeout=2.0)'
    parti:
    - voce: wait_for(op(), timeout=2.0)
      spiega: al massimo 2 secondi
  - codice: '    print(f"Risultato: {risultato}")'
  - codice: 'except asyncio.TimeoutError:'
    parti:
    - voce: except asyncio.TimeoutError
      spiega: scaduto il tempo
  - codice: '    print("Operazione troppo lenta! Timeout raggiunto.")'
segnaposto: {}
varianti: []
vicine:
- asy-gather-errori
- asy-await
