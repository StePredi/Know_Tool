id: asy-gather
tipo: ricetta
titolo: Aspettare più task insieme
sigla: gather
comando: await asyncio.gather(t1, t2, t3)
frase: restituisce i risultati in lista
fonte: asyncio_intro_2627.ipynb · §4 Tasks · asyncio_guide_2627.ipynb · §4
parole: gather attendere tutti task risultati lista concorrente
quando: Quando hai molti task e ti servono tutti i risultati.
fasi:
- nome: Con i task
  righe:
  - codice: risultati = await asyncio.gather(task1, task2, task3)
    commento: gather aspetta tutti i task e restituisce i risultati nell'ordine in cui li hai passati, non in quello in cui finiscono.
    parti:
    - voce: gather(task1, task2, task3)
      spiega: attende tutti
    - voce: risultati
      spiega: lista dei valori restituiti
- nome: Con una lista
  righe:
  - codice: risultati = await asyncio.gather(*tasks)
    commento: Se i task sono in una lista, l'asterisco li passa come argomenti separati.
    parti:
    - voce: '*tasks'
      spiega: spacchetta la lista
  - codice: await asyncio.gather(operazione_lenta(1), operazione_lenta(2), operazione_lenta(3))
    commento: 'gather accetta anche coroutine direttamente: le fa partire insieme (circa 2 secondi per tre pause da 2).'
    trappola: 'Nota: passando coroutine a gather, asyncio le trasforma in task da sé (comportamento della libreria, non spiegato nelle fonti).'
    parti:
    - voce: operazione_lenta(1)
      spiega: coroutine passata a gather
segnaposto: {}
varianti: []
vicine:
- asy-create-task
- asy-gather-errori
- asy-struttura
