id: asy-lancia-e-continua
tipo: ricetta
titolo: Avviare un task e fare altro nel frattempo
sigla: Task in background
comando: create_task + altro lavoro + await
frase: non aspetti subito
fonte: asyncio_guide_2627.ipynb · §6.1 Eseguire task e continuare
parole: task background continuare altro lavoro operazione lunga veloce
quando: Quando un'operazione lunga può andare avanti mentre ne fai un'altra.
fasi:
- nome: Schema
  righe:
  - codice: |-
      task_lungo = asyncio.create_task(operazione_lunga())
      risultato_veloce = await operazione_veloce()
      risultato_lungo = await task_lungo
    commento: Il task lungo parte in background mentre il main fa altro; lo aspetti solo quando serve il risultato.
    parti:
    - voce: create_task(operazione_lunga())
      spiega: parte (appena il loop è libero)
    - voce: await operazione_veloce()
      spiega: nel frattempo il main fa questo
    - voce: await task_lungo
      spiega: ora aspetta il resto
segnaposto: {}
varianti: []
vicine:
- asy-create-task
- asy-gather
