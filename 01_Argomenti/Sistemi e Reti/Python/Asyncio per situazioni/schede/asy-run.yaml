id: asy-run
tipo: ricetta
titolo: Far partire una coroutine
sigla: asyncio.run
comando: asyncio.run(main())
frase: crea l'event loop
fonte: asyncio_intro_2627.ipynb · §2 Coroutines · §4 Tasks
parole: asyncio run event loop avviare main jupyter notebook await
quando: Quando hai una coroutine e devi eseguirla.
fasi:
- nome: In un programma
  righe:
  - codice: asyncio.run(main())
    commento: asyncio.run crea l'event loop, esegue la coroutine principale fino in fondo e poi chiude il loop. Si usa una volta sola, alla fine del file.
    parti:
    - voce: main()
      spiega: coroutine principale
    - voce: asyncio.run(...)
      spiega: avvia tutto
- nome: In un notebook
  righe:
  - codice: await main()
    commento: 'Nei notebook (Jupyter, Colab) il loop esiste già: basta scrivere await davanti alla coroutine.'
    trappola: asyncio.run() dentro un notebook non va bene perché il loop esiste già.
    parti:
    - voce: await main()
      spiega: vale solo nel notebook
segnaposto: {}
varianti: []
vicine:
- asy-struttura
- asy-coroutine
