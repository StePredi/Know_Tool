id: net-server
tipo: ricetta
titolo: Aprire un server che accetta più client
sigla: start_server
comando: asyncio.start_server(gestore, host, porta)
frase: un task per ogni client
fonte: 01_echo_server.py · main()
parole: start_server server asyncio porta serve_forever async with ascolto
quando: Quando vuoi un server che gestisce più client insieme.
fasi:
- nome: Avvia
  righe:
  - codice: |-
      async def main():
          server = await asyncio.start_server(gestisci_client, "127.0.0.1", 8888)
          print("Server in ascolto sulla porta 8888")
          async with server:
              await server.serve_forever()

      asyncio.run(main())
    commento: start_server apre la porta e per ogni client che si collega crea un task che esegue gestisci_client. Così più client sono serviti insieme, in un solo thread.
    trappola: 'serve_forever() non finisce mai: il server resta attivo finché non lo fermi.'
    parti:
    - voce: '"127.0.0.1", 8888'
      spiega: indirizzo (solo questo PC) e porta
    - voce: 'async with server:'
      spiega: chiude il server in modo pulito alla fine
    - voce: serve_forever()
      spiega: accetta client senza mai finire
    - voce: asyncio.run(main())
      spiega: avvia l'event loop
segnaposto: {}
varianti: []
vicine:
- net-gestore
- net-chiudi
- net-client
