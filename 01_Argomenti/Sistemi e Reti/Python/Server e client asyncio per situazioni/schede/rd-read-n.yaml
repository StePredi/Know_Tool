id: rd-read-n
tipo: ricetta
titolo: Leggere quello che c'è, fino a n byte
sigla: read(n)
comando: await reader.read(100)
frase: restituisce subito quello che è arrivato
fonte: 07_client_letture.py · main()
parole: read n byte disponibili subito parziale
quando: Quando vuoi i dati disponibili senza aspettare di averne n.
fasi:
- nome: Leggi
  righe:
  - codice: |-
      pezzo = await reader.read(100)
      print("read(100)         ->", pezzo, f"({len(pezzo)} byte)")
    commento: 'read(n) non aspetta di averne n: restituisce subito quello che c''è (al massimo n). Qui sono 11 byte di "primo pezzo".'
    trappola: 'read(n) legge FINO A n byte: non aspetta di arrivare a n.'
    parti:
    - voce: read(100)
      spiega: fino a 100 byte
    - voce: len(pezzo)
      spiega: quanti ne sono arrivati davvero
segnaposto: {}
varianti: []
vicine:
- rd-readexactly
- rd-read-tutto
- rd-scelta
