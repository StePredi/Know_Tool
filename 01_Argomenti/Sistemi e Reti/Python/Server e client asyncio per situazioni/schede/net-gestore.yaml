id: net-gestore
tipo: ricetta
titolo: Scrivere la funzione che gestisce un client
sigla: Gestore
comando: async def gestisci_client(reader, writer)
frase: reader per leggere, writer per scrivere
fonte: 01_echo_server.py · gestisci_client()
parole: gestore handler reader writer peername client connesso
quando: Quando serve una funzione chiamata a ogni connessione.
fasi:
- nome: Firma
  righe:
  - codice: 'async def gestisci_client(reader, writer):'
    commento: Il gestore riceve reader (per leggere) e writer (per scrivere) già collegati al client. peername dà l'indirizzo del client.
    parti:
    - voce: reader
      spiega: legge dati dal client
    - voce: writer
      spiega: scrive dati al client
  - codice: '    indirizzo = writer.get_extra_info("peername")   # (ip, porta) del client'
    parti:
    - voce: get_extra_info("peername")
      spiega: (ip, porta) del client
  - codice: '    print("Connesso:", indirizzo)'
- nome: Ciclo di lavoro
  righe:
  - codice: 'while True:'
    commento: 'Ciclo tipico: leggi finché arrivano dati. Quando il client chiude, la lettura restituisce vuoto e il ciclo finisce.'
    trappola: L'await sulla lettura permette agli altri client di andare avanti mentre questo aspetta.
  - codice: '    dati = await reader.readline()'
    parti:
    - voce: await reader.readline()
      spiega: aspetta una riga, senza bloccare gli altri client
  - codice: '    if not dati:'
    parti:
    - voce: 'if not dati: break'
      spiega: b"" = client disconnesso
  - codice: '        break'
segnaposto: {}
varianti: []
vicine:
- net-server
- net-eco
- net-chiudi
