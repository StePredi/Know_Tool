    commento: Il gestore legge righe finché il client resta collegato e le inoltra agli altri con il nome del mittente.
  - codice: '    while True:'
  - codice: '        dati = await reader.readline()'
  - codice: '        if not dati:'
  - codice: '            break'
  - codice: '        testo = dati.decode().strip()'
  - codice: '        await invia_a_tutti(f"[{nome}] {testo}\n", writer)'
    parti:
    - voce: invia_a_tutti(...)
      spiega: inoltra ai client
    - voce: f"[{nome}] {testo}\n"
      spiega: messaggio con mittente
  - codice: 'except ConnectionError:'
    parti:
    - voce: except ConnectionError
      spiega: client caduto all'improvviso
  - codice: '    pass                                 # il client è caduto all''improvviso'
