id: chat-invia-tutti
tipo: ricetta
titolo: Inoltrare un messaggio a tutti gli altri
sigla: Inoltra
comando: 'for writer in clienti: ...'
frase: salta il mittente
fonte: 04_chat_server.py · invia_a_tutti()
parole: chat inoltrare messaggio tutti altri mittente ConnectionError drain
quando: Quando un client scrive e gli altri devono riceverlo.
fasi:
- nome: Ciclo
  righe:
  - codice: |-
      async def invia_a_tutti(messaggio, mittente):
          for writer in clienti:
              if writer is not mittente:
                  try:
                      writer.write(messaggio.encode())
                      await writer.drain()
                  except ConnectionError:         # quel client si è appena disconnesso
                      pass
    commento: Per ogni writer diverso dal mittente scrive il messaggio. Se un client è appena caduto, ConnectionError viene ignorato così gli altri ricevono comunque.
    trappola: 'Nota: durante l''await del drain un altro client può uscire e modificare la lista clienti mentre la stai scorrendo; per sicurezza si può scorrere una copia: for writer in list(clienti).'
    parti:
    - voce: writer is not mittente
      spiega: non rimandare il messaggio a chi lo ha scritto
    - voce: 'except ConnectionError: pass'
      spiega: ignora il client caduto
segnaposto: {}
varianti: []
vicine:
- chat-lista
- chat-finally
- chat-server
