id: ss-verify
tipo: ricetta
titolo: Rifiutare le connessioni da certi indirizzi
sigla: Controllo accessi
comando: verify_request
frase: restituisci False per rifiutare
fonte: socketserver.ipynb
parole: verify_request controllo accessi rifiutare indirizzo ip blacklist socketserver false esercizio
quando: Quando il server deve accettare solo i client che passano un controllo, per esempio sull'indirizzo IP.
fasi:
- nome: Sovrascrivi verify_request
  righe:
  - codice: 'class MioServer(socketserver.TCPServer):'
    commento: False = richiesta rifiutata, True = processata
    trappola: 'Nota: esempio scritto per l''esercizio 3 del notebook. Di base verify_request restituisce sempre True, cioè accetta tutto.'
  - codice: '    def verify_request(self, request, client_address):'
  - codice: '        return client_address[0] != «IP_RIFIUTATO»'
segnaposto:
  IP_RIFIUTATO:
    esempio: '''192.168.1.50'''
    spiega: indirizzo IP da rifiutare (come stringa)
varianti: []
vicine:
- ss-handler
- ss-thread
