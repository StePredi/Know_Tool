id: udp-server-ss
tipo: ricetta
titolo: Un server UDP con socketserver
sigla: Server UDP
comando: UDPServer + handler
frase: request = (dati, socket)
fonte: socketserver.ipynb
parole: udp udpserver socketserver handler sendto datagramma request dati socket client_address eco
quando: Quando i messaggi sono datagrammi UDP, senza connessione.
fasi:
- nome: Handler UDP
  righe:
  - codice: 'class echoUDPRequestHandler(socketserver.BaseRequestHandler):'
    commento: risponde all'indirizzo da cui è arrivato il datagramma
    trappola: 'Con UDP self.request è una coppia (dati, socket), non il socket: per rispondere si usa sendto() con client_address.'
  - codice: '    def handle(self):'
  - codice: '        data, sock = self.request'
  - codice: '        sock.sendto(data.upper(), self.client_address)'
- nome: Server
  righe:
  - codice: server = socketserver.UDPServer((«HOST», «PORTA»), echoUDPRequestHandler)
    commento: stessa struttura del server TCP
  - codice: server.serve_forever()
segnaposto:
  HOST:
    esempio: '''127.0.0.1'''
    spiega: indirizzo su cui ascoltare
  PORTA:
    esempio: '50017'
    spiega: porta del server
varianti: []
vicine:
- udp-client
- ss-handler
