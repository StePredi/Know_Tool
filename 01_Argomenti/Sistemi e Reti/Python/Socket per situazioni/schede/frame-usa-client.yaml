id: frame-usa-client
tipo: ricetta
titolo: Usare FrameSocket in un client
sigla: Client con FrameSocket
comando: FrameSocket connect send recv
frase: messaggio intero in andata e ritorno
fonte: frameclient.py · framesocket.py
parole: framesocket client connect send recv frame encode localhost 5000 messaggio grande
quando: Quando vuoi spedire a un server un messaggio anche molto lungo e leggere la risposta intera.
fasi:
- nome: Collegati e spedisci
  righe:
  - codice: |-
      s = FrameSocket()
      s.connect(("localhost", 5000))
      s.send(payload.encode())
    commento: il payload deve essere in byte
    trappola: 'send() vuole bytes: con una stringa serve .encode().'
- nome: Leggi la risposta
  righe:
  - codice: |-
      data = s.recv()
      print(f"[CLIENT] received: {len(data)}B")
    commento: data è il messaggio intero, non un pezzo
segnaposto: {}
varianti: []
vicine:
- frame-usa-server
- client-tcp
