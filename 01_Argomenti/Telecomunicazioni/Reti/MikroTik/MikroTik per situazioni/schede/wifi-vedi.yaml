id: wifi-vedi
tipo: ricetta
titolo: Identificare le interfacce wifi e la loro configurazione
sigla: Vedere le wifi
comando: wireless print
frase: nome, ssid e canale
fonte: Traccia verifica configurazione base
parole: wifi wlan1 wlan2 wireless ssid canale frequency band interface wireless print 2.4 5 ghz
quando: Quando devi identificare le interfacce wifi del router e annotarne nome e configurazione.
fasi:
- nome: Elenca le wifi
