    commento: elenco con nome e stato
    parti:
    - voce: wlan1
      spiega: di solito la wifi a 2,4 GHz
    - voce: wlan2
      spiega: di solito la wifi a 5 GHz
    trappola: 'Da RouterOS 7 su alcuni modelli il menu si chiama /interface wifi: se wireless non esiste usa quello.'
  - codice: /interface wireless print detail
    commento: ssid, banda e canale
