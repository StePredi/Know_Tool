esercizi:
- testo: Studia f(x) = x^3 - 3x
  risultato: dispari; zeri 0 e +-sqrt(3); massimo (-1, 2), minimo (1, -2), flesso (0, 0)
  piano:
  - scheda: dominio
    nota: 'Polinomio: tutti i reali.'
  - scheda: simmetrie
    nota: '`f(-x) = -f(x)`: dispari.'
  - scheda: intersezioni-segno
    nota: Zeri `x(x^2 - 3)`.
  - scheda: derivata-prima
    nota: '`3(x - 1)(x + 1)`.'
  - scheda: derivata-seconda
    nota: '`6x`: flesso in `0`.'
  - scheda: grafico
    nota: Curva a «S».
- testo: Dominio di f(x) = sqrt(x - 1)/(x - 3)
  risultato: x >= 1 e x != 3
  piano:
  - scheda: dominio
    nota: Radice e denominatore insieme.
  - scheda: dominio-radice
    nota: '`x >= 1`.'
  - scheda: dominio-fratta
    nota: '`x != 3`.'
- testo: Dominio di f(x) = ln(x^2 - 4)
  risultato: x < -2 oppure x > 2
  piano:
  - scheda: dominio-logaritmo
    nota: 'Argomento positivo: `x^2 - 4 > 0`.'
- testo: Di che tipo è la simmetria di f(x) = x/(x^2 + 1)?
  risultato: dispari
  piano:
  - scheda: simmetrie
    nota: Calcolo `f(-x)`.
  - scheda: funzione-dispari
    nota: '`f(-x) = -f(x)`.'
- testo: Trova gli asintoti di f(x) = (2x + 1)/(x - 3)
  risultato: verticale x = 3, orizzontale y = 2
  piano:
  - scheda: dominio-fratta
    nota: '`x != 3`.'
  - scheda: asintoto-verticale
    nota: Il denominatore si annulla in `3`.
  - scheda: asintoto-orizzontale
    nota: 'Gradi uguali: `frac(2|1)`.'
- testo: Trova gli asintoti di f(x) = (x^2 + 1)/x
  risultato: verticale x = 0, obliquo y = x
  piano:
  - scheda: asintoto-verticale
    nota: Denominatore zero in `0`.
  - scheda: asintoto-orizzontale
    nota: Il limite è infinito.
  - scheda: asintoto-obliquo
    nota: '`x + frac(1|x)`.'
- testo: Crescenza e massimi/minimi di f(x) = x^3 - 3x^2
  risultato: crescente per x < 0 e x > 2; massimo (0, 0), minimo (2, -4)
  piano:
  - scheda: derivata-prima
    nota: '`3x(x - 2)`.'
  - scheda: segno-derivata-prima
    nota: Quadro dei segni.
  - scheda: punti-stazionari
    nota: Da `+` a `-` in `0`, da `-` a `+` in `2`.
- testo: Concavità e flessi di f(x) = x^3 - 3x^2
  risultato: concava per x < 1, convessa per x > 1; flesso (1, -2)
  piano:
  - scheda: derivata-seconda
    nota: '`6(x - 1)`.'
  - scheda: segno-derivata-seconda
    nota: Segno di `x - 1`.
  - scheda: flesso
    nota: '`f(1) = -2`.'
- testo: Studia f(x) = x^2/(x - 1)
  risultato: asintoti x = 1 e y = x + 1; massimo (0, 0), minimo (2, 4); concava per x < 1, convessa per x > 1
  piano:
  - scheda: dominio
    nota: '`x != 1`.'
  - scheda: intersezioni-segno
    nota: Zero in `0`.
  - scheda: limiti-asintoti
    nota: Limiti in `1` e a `+-inf`.
  - scheda: asintoto-verticale
    nota: '`x = 1`.'
  - scheda: asintoto-obliquo
    nota: '`y = x + 1`.'
  - scheda: derivata-prima
    nota: '`frac(x^2 - 2x|(x - 1)^2)`.'
  - scheda: punti-stazionari
    nota: Massimo in `0`, minimo in `2`.
  - scheda: derivata-seconda
    nota: '`frac(2|(x - 1)^3)`.'
  - scheda: grafico
    nota: Due rami.
- testo: Studia f(x) = sqrt(x^2 - 4)
  risultato: dominio |x| >= 2; pari; minimi (+-2, 0) con tangente verticale; asintoti y = +-x
  piano:
  - scheda: dominio-radice
    nota: '`x^2 - 4 >= 0`.'
  - scheda: funzione-pari
    nota: '`f(-x) = f(x)`.'
  - scheda: punto-non-derivabile
    nota: In `+-2` la derivata va a infinito.
  - scheda: asintoto-obliquo
    nota: '`y = +-x`.'
- testo: Studia f(x) = ln(x)/x
  risultato: dominio x > 0; verticale x = 0, orizzontale y = 0; massimo (e, 1/e); flesso in x = e^(3/2)
  piano:
  - scheda: dominio-logaritmo
    nota: '`x > 0`.'
  - scheda: asintoto-verticale
    nota: '`ln(x) -> -inf`.'
  - scheda: asintoto-orizzontale
    nota: '`ln(x)/x -> 0`.'
  - scheda: punti-stazionari
    nota: '`1 - ln(x) = 0`.'
  - scheda: flesso
    nota: '`2 ln(x) = 3`.'
- testo: Massimo e minimo di f(x) = x^3 - 3x su [0, 2]
  risultato: massimo 2 in x = 2, minimo -2 in x = 1
  piano:
  - scheda: derivata-prima
    nota: Stazionari `+-1`.
  - scheda: punti-stazionari
    nota: Solo `x = 1` è nell'intervallo.
  - scheda: massimo-minimo-assoluti
    nota: Confronto `f(0)`, `f(1)`, `f(2)`.
