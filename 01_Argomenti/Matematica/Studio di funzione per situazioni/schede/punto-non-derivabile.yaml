id: punto-non-derivabile
tipo: regola
titolo: Punti dove la derivata non c'è
sigla: Non derivabile
comando: controlla i limiti di f'
vedo: Un punto del dominio dove `f` esiste ma `f'` no (radice, valore assoluto, grafico con spigolo).
formula:
- lim_(x -> c^-) f'(x)
- lim_(x -> c^+) f'(x)
adatto:
- Calcola i limiti di `f'` a sinistra e a destra del punto.
- 'Due limiti finiti ma diversi: punto angoloso.'
- 'Limiti infiniti con segni opposti: cuspide. Con segno uguale: flesso a tangente verticale.'
- In un punto angoloso o in una cuspide può esserci un massimo o un minimo.
esempi:
- da: f(x) = abs(x) in x = 0
  passi:
  - '`f''` vale `-1` a sinistra e `1` a destra'
  ris: punto angoloso, minimo
- da: f(x) = sqrt(x^2 - 4) in x = 2
  passi:
  - '`f''(x) = frac(x|sqrt(x^2 - 4))`'
  - per `x -> 2^+` va a `+inf`
  ris: tangente verticale in x = 2
- da: f(x) = x^(1/3) in x = 0
  passi:
  - '`f''(x) = frac(1|3*x^(2/3))`'
  - va a `+inf` da entrambi i lati
  ris: flesso a tangente verticale
errore: 'Dichiarare derivabile un punto solo perché la formula di `f''` si può scrivere: il punto potrebbe non essere nel suo dominio.'
confondi:
- scheda: punti-stazionari
  differenza: 'Stazionario: `f'' = 0`. Qui `f''` non esiste.'
perche: In un punto dove la pendenza cambia bruscamente non esiste una tangente unica.
parole: non derivabile punto angoloso cuspide flesso verticale
