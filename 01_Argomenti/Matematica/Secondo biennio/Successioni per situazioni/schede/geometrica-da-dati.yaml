id: geometrica-da-dati
tipo: regola
titolo: Progressione geometrica da dati
sigla: Geometrica da dati
comando: q^(m - k) = frac(a_m|a_k)
vedo: Ti danno due termini non consecutivi.
formula:
- q^(m - k) = frac(a_m|a_k)
- a_1 = frac(a_k|q^(k - 1))
adatto:
- Dividi i due termini per ottenere una potenza di `q` e ricava `q`.
- Se la potenza è pari, `q` può essere positivo o negativo.
- Poi trova `a_1` e scrivi `a_n`.
esempi:
- da: a_2 = 6, a_5 = 162
  passi:
  - '`q^3 = frac(162|6) = 27`'
  - '`q = 3`'
  - '`a_1 = frac(6|3) = 2`'
  ris: a_n = 2*3^(n - 1)
errore: Dimenticare la seconda soluzione quando l'esponente è pari.
confondi:
- scheda: geometrica-termine
  differenza: Lì conosci `a_1` e `q`; qui li ricavi.
perche: Tra `a_k` e `a_m` ci sono `m - k` moltiplicazioni per `q`.
parole: progressione geometrica da dati ragione due termini
