id: termine-generale
tipo: regola
titolo: Trovare il termine generale
sigla: Termine generale
comando: a_n = formula in n
vedo: Ti danno i primi termini e vuoi la formula di `a_n`.
formula:
- a_n = f(n)
adatto:
- Prima controlla se è aritmetica (`a_n = a_1 + (n - 1)*d`) o geometrica (`a_n = a_1*q^(n - 1)`).
- 'Quadrati: `n^2`; cubi: `n^3`; potenze di 2: `2^n`; alternanza dei segni: `(-1)^n`.'
- 'Frazioni: guarda separatamente numeratore e denominatore.'
- Prova la formula con `n = 1, 2, 3`.
esempi:
- da: 2, 5, 8, 11, ...
  passi:
  - aritmetica con `a_1 = 2`, `d = 3`
  - '`a_n = 2 + (n - 1)*3`'
  ris: 3*n - 1
- da: 2 + (x - 1)*3
  passi:
  - sviluppo
  ris: 3*x - 1
  verifica: scomposizione
- da: frac(1|2), frac(2|3), frac(3|4), ...
  passi:
  - numeratore `n`, denominatore `n + 1`
  ris: a_n = frac(n|n + 1)
- da: 2, 4, 8, 16, ...
  passi:
  - potenze di 2
  ris: a_n = 2^n
errore: Indovinare la formula senza verificarla sui primi termini.
confondi:
- scheda: controlla-successione
  differenza: Il controllo conferma la formula trovata.
perche: Il termine generale permette di calcolare qualsiasi termine senza dover calcolare i precedenti.
parole: termine generale formula primi termini successione
