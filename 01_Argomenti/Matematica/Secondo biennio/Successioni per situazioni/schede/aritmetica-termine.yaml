id: aritmetica-termine
tipo: regola
titolo: 'Progressione aritmetica: termine'
sigla: Aritmetica a_n
comando: a_n = a_1 + (n - 1)*d
vedo: I termini aumentano o diminuiscono sempre della stessa quantità `d`.
formula:
- a_n = a_1 + (n - 1)*d
- d = a_(n+1) - a_n
adatto:
- '`d > 0`: crescente; `d < 0`: decrescente; `d = 0`: costante.'
- 'Per trovare la posizione `n` di un valore: risolvi `a_n = valore` in `n`.'
- '`n` deve essere un intero positivo.'
esempi:
- da: 'a_1 = 4, d = 3: a_10'
  passi:
  - '`a_10 = 4 + 9*3`'
  ris: '31'
- da: 4 + (x - 1)*3
  passi:
  - sviluppo
  ris: 3*x + 1
  verifica: scomposizione
- da: 'a_n = 3n + 1: in quale posizione c''è 100?'
  passi:
  - '`3n + 1 = 100`'
  - '`n = 33`'
  ris: n = 33
errore: 'Usare `n` invece di `n - 1`: il primo termine ha zero passi, non uno.'
confondi:
- scheda: geometrica-termine
  differenza: Qui si somma `d`; lì si moltiplica per `q`.
perche: Ogni termine si ottiene dal primo aggiungendo `d` per `n - 1` volte.
parole: progressione aritmetica termine generale ragione differenza
