esercizi:
- testo: '2, 5, 8, 11, ...: tipo, a_n, a_20'
  risultato: aritmetica d = 3, a_n = 3n - 1, a_20 = 59
  piano:
  - scheda: riconosci-successione
    nota: Differenze costanti.
  - scheda: aritmetica-termine
    nota: '`a_n = 2 + (n - 1)*3`.'
  - scheda: controlla-successione
    nota: Sostituisco `n = 1, 2, 3`.
- testo: '3, 6, 12, 24, ...: tipo, a_n, a_8'
  risultato: geometrica q = 2, a_n = 3*2^(n - 1), a_8 = 384
  piano:
  - scheda: riconosci-successione
    nota: Rapporti costanti.
  - scheda: geometrica-termine
    nota: '`3*2^7 = 384`.'
- testo: Somma dei primi 30 numeri dispari
  risultato: '900'
  piano:
  - scheda: riconosci-successione
    nota: Aritmetica con `d = 2`.
  - scheda: aritmetica-somma
    nota: '`a_30 = 59`, `S = frac(30*(1 + 59)|2)`.'
- testo: Progressione aritmetica con a_3 = 7 e a_8 = 22
  risultato: a_n = 3n - 2
  piano:
  - scheda: aritmetica-da-dati
    nota: '`d = frac(22 - 7|5) = 3`, `a_1 = 1`.'
- testo: Progressione geometrica con a_2 = 6 e a_5 = 162
  risultato: a_n = 2*3^(n - 1)
  piano:
  - scheda: geometrica-da-dati
    nota: '`q^3 = 27`, `q = 3`.'
- testo: 1 + 2 + 4 + ... + 2^9
  risultato: '1023'
  piano:
  - scheda: geometrica-somma
    nota: 10 termini, `q = 2`.
- testo: 1 + 1/3 + 1/9 + ... (infiniti termini)
  risultato: 3/2
  piano:
  - scheda: serie-geometrica
    nota: '`frac(1|1 - frac(1|3))`.'
- testo: 'a_1 = 2, a_(n+1) = 2*a_n - 1: primi 5 termini'
  risultato: 2, 3, 5, 9, 17
  piano:
  - scheda: successione-ricorsiva
    nota: Calcolo un termine alla volta.
- testo: Monotonia di a_n = n/(n + 1)
  risultato: crescente
  piano:
  - scheda: monotonia
    nota: '`a_(n+1) - a_n = frac(1|(n+1)(n+2)) > 0`.'
- testo: Limite di a_n = (3n^2 + 1)/(n^2 + n)
  risultato: '3'
  piano:
  - scheda: limite-comportamento
    nota: Divido per `n^2`.
- testo: 2000 euro al 3% annuo composto per 4 anni
  risultato: circa 2251,02 euro
  piano:
  - scheda: problema-testo-successione
    nota: 'Percentuale: geometrica.'
  - scheda: geometrica-termine
    nota: '`2000*1,03^4`.'
