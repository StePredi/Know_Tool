esercizi:
- testo: Rapporto incrementale di f(x) = x^2 in x_0 = 2 con h = 0,1
  risultato: 4,1
  piano:
  - scheda: rapporto-incrementale
    nota: '`frac(2,1^2 - 4|0,1)`.'
- testo: f'(2) per f(x) = x^2, dalla definizione
  risultato: '4'
  piano:
  - scheda: rapporto-incrementale
    nota: '`frac((2 + h)^2 - 4|h)`.'
  - scheda: semplifica-e-limite
    nota: '`4 + h -> 4`.'
  - scheda: derivata-definizione
    nota: Il limite è la derivata.
- testo: f'(x) per f(x) = x^3, dalla definizione
  risultato: 3x^2
  piano:
  - scheda: derivate-da-definizione
    nota: '`(x + h)^3` ha quattro termini.'
- testo: f'(x) per f(x) = 1/x, dalla definizione
  risultato: -1/x^2
  piano:
  - scheda: derivate-da-definizione
    nota: Denominatore comune.
- testo: f'(x) per f(x) = sqrt(x), dalla definizione (x > 0)
  risultato: 1/(2*sqrt(x))
  piano:
  - scheda: derivate-da-definizione
    nota: Coniugato.
- testo: Retta tangente a f(x) = x^2 in x_0 = 1
  risultato: y = 2x - 1
  piano:
  - scheda: retta-tangente
    nota: '`f(1) = 1`, `f''(1) = 2`.'
- testo: Retta normale a f(x) = x^2 in x_0 = 1
  risultato: y = -x/2 + 3/2
  piano:
  - scheda: retta-normale
    nota: '`m_n = -frac(1|2)`.'
- testo: Tangente a f(x) = x^2 - 4x + 5 parallela a y = 2x
  risultato: y = 2x - 4
  piano:
  - scheda: tangenti-con-pendenza
    nota: '`2x - 4 = 2`: `x_0 = 3`.'
  - scheda: retta-tangente
    nota: Scrivo la tangente in `(3, 2)`.
- testo: 's(t) = t^2 + 3t: velocità media tra 1 e 3 e velocità in t = 2'
  risultato: 7 m/s e 7 m/s
  piano:
  - scheda: significato-fisico
    nota: 'Media: rapporto incrementale. Istantanea: derivata.'
- testo: f(x) = abs(x - 1) è derivabile in x = 1?
  risultato: 'no, punto angoloso: derivate -1 e 1'
  piano:
  - scheda: derivata-sinistra-destra
    nota: '`f''_- = -1`, `f''_+ = 1`.'
  - scheda: punti-non-derivabili
    nota: Punto angoloso.
- testo: Trova a, b perché f(x) = x^2 (x <= 1), a*x + b (x > 1) sia derivabile
  risultato: a = 2, b = -1
  piano:
  - scheda: parametri-derivabilita
    nota: Continuità e derivate uguali.
- testo: 'f(x) = x^(1/3): derivabilità in 0'
  risultato: non derivabile, flesso a tangente verticale
  piano:
  - scheda: derivata-sinistra-destra
    nota: Rapporto `h^(-2/3)`.
  - scheda: punti-non-derivabili
    nota: Infinito dello stesso segno.
