id: semplifica-e-limite
tipo: regola
titolo: Semplifica e passa al limite
sigla: Semplifica h
comando: semplifica h poi h -> 0
vedo: Hai il rapporto incrementale e devi calcolarne il limite per `h -> 0`.
formula:
- lim_(h -> 0) frac(f(x_0 + h) - f(x_0)|h)
adatto:
- 'Sostituire `h = 0` dà `frac(0|0)`: prima semplifica `h`.'
- Sviluppa i quadrati e i cubi, raccogli `h` al numeratore e semplificalo.
- Con le radici moltiplica per il coniugato.
- Con le frazioni porta al denominatore comune.
- Poi sostituisci `h = 0`.
esempi:
- da: lim_(h -> 0) frac((2 + h)^2 - 4|h)
  passi:
  - '`frac(4 + 4h + h^2 - 4|h) = 4 + h`'
  - '`h -> 0`'
  ris: '4'
- da: lim_(h -> 0) frac(frac(1|1 + h) - 1|h)
  passi:
  - 'denominatore comune: `frac(-h|(1 + h)*h)`'
  - 'semplifico `h`: `-frac(1|1 + h)`'
  ris: '-1'
- da: frac(sqrt(4 + x) - 2|x)
  passi:
  - moltiplico per il coniugato `sqrt(4 + x) + 2`
  ris: frac(1|sqrt(4 + x) + 2)
  verifica: scomposizione
errore: Mettere `h = 0` prima di aver semplificato.
confondi:
- scheda: rapporto-incrementale
  differenza: Lì si scrive il rapporto; qui lo si semplifica e si fa il limite.
perche: Dopo aver semplificato `h`, la forma indeterminata sparisce e si può sostituire.
parole: limite rapporto incrementale semplificare h
