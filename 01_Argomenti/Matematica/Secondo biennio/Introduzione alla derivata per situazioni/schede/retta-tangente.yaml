id: retta-tangente
tipo: regola
titolo: Retta tangente
sigla: Tangente
comando: y - f(x_0) = f'(x_0)*(x - x_0)
vedo: Ti chiedono la tangente al grafico di `f` in un punto.
formula:
- y - f(x_0) = f'(x_0)*(x - x_0)
adatto:
- 'Servono tre numeri: `x_0`, `f(x_0)` e `f''(x_0)`.'
- Se ti danno solo `x_0`, calcola `f(x_0)` dalla funzione.
- 'Tangente orizzontale: `f''(x_0) = 0`, retta `y = f(x_0)`.'
- 'Tangente verticale: `x = x_0` (derivata infinita).'
esempi:
- da: f(x) = x^2 in x_0 = 1
  passi:
  - '`f(1) = 1`, `f''(1) = 2`'
  - '`y - 1 = 2(x - 1)`'
  ris: y = 2x - 1
- da: f(x) = x^3 in x_0 = -1
  passi:
  - '`f(-1) = -1`, `f''(-1) = 3`'
  - '`y + 1 = 3(x + 1)`'
  ris: y = 3x + 2
- da: f(x) = x^2 - 4x + 5 in x_0 = 2
  passi:
  - '`f(2) = 1`, `f''(2) = 0`'
  ris: y = 1
errore: Usare `f(x_0)` al posto di `f'(x_0)` come pendenza.
confondi:
- scheda: retta-normale
  differenza: La normale è perpendicolare alla tangente.
perche: È la retta per il punto `(x_0, f(x_0))` con coefficiente angolare `f'(x_0)`.
parole: retta tangente equazione punto derivata
