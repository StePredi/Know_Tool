id: tangente-punto
tipo: regola
titolo: Tangente in un punto
sigla: Tangente
comando: formula dello sdoppiamento
vedo: La tangente a una conica in un suo punto `P(x_0, y_0)`.
formula:
- x^2 -> x*x_0
- y^2 -> y*y_0
- x -> frac(x + x_0|2)
- y -> frac(y + y_0|2)
adatto:
- Nell'equazione della conica sostituisci `x^2` con `x*x_0`, `y^2` con `y*y_0`, `x` con `frac(x + x_0|2)`, `y` con `frac(y + y_0|2)`.
- Il termine `x*y` diventa `frac(x*y_0 + y*x_0|2)`.
- Il punto deve appartenere alla conica.
esempi:
- da: x^2 + y^2 = 25 in P(3, 4)
  passi:
  - 'sdoppio: `3x + 4y = 25`'
  ris: 3x + 4y = 25
- da: y = x^2 in P(1, 1)
  passi:
  - '`frac(y + 1|2) = x*1`'
  ris: y = 2x - 1
- da: frac(x^2|25) + frac(y^2|9) = 1 in P(0, 3)
  passi:
  - '`frac(0*x|25) + frac(3y|9) = 1`'
  ris: y = 3
- da: (x - 1)^2 + (y - 2)^2 = 25 in P(4, 6)
  passi:
  - '`(x - 1)(4 - 1) + (y - 2)(6 - 2) = 25`'
  - '`3x - 3 + 4y - 8 = 25`'
  ris: 3x + 4y = 36
errore: Applicarla a un punto che non sta sulla conica.
confondi:
- scheda: retta-conica-posizione
  differenza: Con il discriminante trovi se esiste tangenza; con lo sdoppiamento scrivi direttamente la retta.
perche: 'È la forma polare della conica: per un punto sulla curva, la polare coincide con la tangente.'
parole: tangente punto sdoppiamento conica
