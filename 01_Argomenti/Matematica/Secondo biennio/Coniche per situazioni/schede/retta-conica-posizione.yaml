id: retta-conica-posizione
tipo: regola
titolo: Posizione di una retta rispetto a una conica
sigla: Retta-conica
comando: sostituisci e studia delta
vedo: Una retta e una conica e ti chiedono intersezioni o se è tangente.
formula:
- y = m*x + q
- 'd > 0: secante'
- 'd = 0: tangente'
- 'd < 0: esterna'
adatto:
- 'Sostituisci la retta nell''equazione della conica: viene un''equazione di secondo grado in `x`.'
- '`d` è il discriminante (`delta`).'
- Per la circonferenza puoi anche confrontare la distanza centro-retta con il raggio.
- 'Tangente per un parametro: imponi `d = 0`.'
esempi:
- da: x^2 + y^2 = 25 e y = x + 1
  passi:
  - '`2x^2 + 2x - 24 = 0`'
  - '`x^2 + x - 12 = 0`: `d = 49`'
  ris: secante in (3, 4) e (-4, -3)
- da: 'x^2 + y^2 = 2 e y = x + k: tangenza'
  passi:
  - '`2x^2 + 2k x + k^2 - 2 = 0`'
  - '`d/4 = k^2 - 2(k^2 - 2) = 4 - k^2 = 0`'
  ris: k = 2 oppure k = -2
- da: y = x^2 e y = 2x - 1
  passi:
  - '`x^2 - 2x + 1 = 0`: `d = 0`'
  ris: tangente in (1, 1)
errore: Dimenticare che per la parabola con retta verticale il discriminante non descrive la posizione.
confondi:
- scheda: tangente-punto
  differenza: Qui cerchi se è tangente; lì sai già il punto di tangenza.
perche: 'Le intersezioni sono le soluzioni comuni: il numero di soluzioni dice il tipo di posizione.'
parole: retta conica intersezione tangente secante discriminante
