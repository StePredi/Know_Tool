id: asintoto-verticale
tipo: regola
titolo: Asintoto verticale
sigla: Verticale
comando: lim_(x -> c) f(x) = +-inf
vedo: Dove la funzione non è definita (denominatore zero, logaritmo di 0).
formula:
- x = c
adatto:
- Cerca i punti `c` esterni al dominio con denominatore zero.
- 'Calcola il limite in `c`: se è infinito (da almeno un lato), `x = c` è asintoto verticale.'
- 'Se il limite è finito, il punto è una discontinuità eliminabile: niente asintoto.'
esempi:
- da: f(x) = frac(1|x - 2)
  passi:
  - denominatore zero in `x = 2`
  - limite infinito
  ris: asintoto verticale x = 2
- da: f(x) = ln(x)
  passi:
  - '`ln(x)` in `0^+`'
  ris: asintoto verticale x = 0
- da: f(x) = frac(x + 1|x^2 - 1)
  passi:
  - denominatore zero in `x = 1` e `x = -1`
  - 'semplificata: `frac(1|x - 1)`'
  - in `-1` il limite è `-frac(1|2)`
  ris: asintoto verticale solo x = 1
errore: Mettere un asintoto dove il limite è finito (discontinuità eliminabile).
confondi:
- scheda: discontinuita-tipi
  differenza: Il limite infinito dà una discontinuità di seconda specie e un asintoto.
perche: 'Vicino a `c` la funzione cresce (o decresce) senza limite: il grafico si avvicina alla retta verticale.'
parole: asintoto verticale limite infinito dominio
