esercizi:
- testo: 3^(2x - 1) = 27
  risultato: x = 2
  piano:
  - scheda: eq-esp-stessa-base
    nota: '`27 = 3^3`: `2x - 1 = 3`.'
- testo: 4^x - 6*2^x + 8 = 0
  risultato: x = 1, x = 2
  piano:
  - scheda: riduci-stessa-base
    nota: '`4^x = (2^x)^2`.'
  - scheda: eq-esp-sostituzione
    nota: '`t^2 - 6t + 8 = 0`: `t = 2` o `t = 4`.'
- testo: 5^x = 12
  risultato: x = log_5(12), circa 1,54
  piano:
  - scheda: eq-esp-basi-diverse
    nota: '`x = log_5(12)`.'
  - scheda: cambio-base
    nota: '`frac(ln(12)|ln(5))` per la calcolatrice.'
- testo: (1/2)^x >= 8
  risultato: x <= -3
  piano:
  - scheda: riduci-stessa-base
    nota: '`(frac(1|2))^x = 2^(-x)`.'
  - scheda: diseq-esponenziali
    nota: 'Base 2 maggiore di 1: stesso verso, `-x >= 3`.'
- testo: log_3(81) + log_2(1/8)
  risultato: '1'
  piano:
  - scheda: definizione-log
    nota: '`log_3(81) = 4`, `log_2(frac(1|8)) = -3`.'
- testo: log_2(x - 1) + log_2(x + 1) = 3
  risultato: x = 3
  piano:
  - scheda: condizioni-esistenza-log
    nota: '`x > 1`.'
  - scheda: proprieta-log
    nota: 'Riunisco: `log_2((x - 1)(x + 1))`.'
  - scheda: eq-log-forma-esp
    nota: '`x^2 - 1 = 8`.'
  - scheda: controlla-esp-log
    nota: '`x = -3` non soddisfa `x > 1`.'
- testo: log_5(2x - 3) = log_5(x + 4)
  risultato: x = 7
  piano:
  - scheda: condizioni-esistenza-log
    nota: '`x > frac(3|2)`.'
  - scheda: eq-log-uguaglianza
    nota: '`2x - 3 = x + 4`.'
- testo: ln(x)^2 - 3*ln(x) + 2 = 0
  risultato: x = e, x = e^2
  piano:
  - scheda: eq-log-sostituzione
    nota: '`t^2 - 3t + 2 = 0`: `t = 1` o `t = 2`.'
- testo: log_(1/2)(x - 1) >= -2
  risultato: 1 < x <= 5
  piano:
  - scheda: condizioni-esistenza-log
    nota: '`x > 1`.'
  - scheda: diseq-log
    nota: 'Base tra 0 e 1: `x - 1 <= (frac(1|2))^(-2) = 4`.'
- testo: Calcola log_4(8)
  risultato: 3/2
  piano:
  - scheda: cambio-base
    nota: '`frac(log_2(8)|log_2(4))`.'
- testo: 'y = 2^x - 4: asintoto e intersezioni con gli assi'
  risultato: asintoto y = -4, passa per (2, 0) e (0, -3)
  piano:
  - scheda: grafico-esponenziale
    nota: 'Asintoto `y = -4`; con l''asse `y`: `1 - 4`; con l''asse `x`: `2^x = 4`.'
- testo: 'y = log_2(x + 3): dominio, asintoto e zero'
  risultato: x > -3, asintoto x = -3, zero in x = -2
  piano:
  - scheda: condizioni-esistenza-log
    nota: '`x + 3 > 0`.'
  - scheda: grafico-log
    nota: 'Zero: `x + 3 = 1`.'
