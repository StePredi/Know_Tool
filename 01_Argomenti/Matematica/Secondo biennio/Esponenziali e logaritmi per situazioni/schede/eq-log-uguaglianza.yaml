id: eq-log-uguaglianza
tipo: regola
titolo: Equazione log_a f = log_a g
sigla: Uguaglianza
comando: log_a(f(x)) = log_a(g(x)) -> f(x) = g(x)
vedo: Un logaritmo da ogni lato (o due logaritmi sommati da riunire).
formula:
- log_a(f(x)) = log_a(g(x))
- f(x) = g(x)
adatto:
- 'Scrivi prima le condizioni di esistenza: `f(x) > 0` e `g(x) > 0`.'
- Se ci sono più logaritmi da un lato, riuniscili con le proprietà.
- Uguaglia gli argomenti e risolvi.
- Scarta le soluzioni che non rispettano le condizioni.
esempi:
- da: log_2(x + 3) = log_2(2x - 1)
  passi:
  - 'condizioni: `x > -3` e `x > frac(1|2)`'
  - '`x + 3 = 2x - 1`'
  ris: x = 4
- da: log_3(x) + log_3(x - 2) = 1
  passi:
  - 'condizione: `x > 2`'
  - '`log_3(x(x - 2)) = 1`: `x^2 - 2x = 3`'
  - '`x = 3` oppure `x = -1` (scartata)'
  ris: x = 3
- da: ln(x - 1) = ln(3 - x)
  passi:
  - 'condizioni: `1 < x < 3`'
  - '`x - 1 = 3 - x`'
  ris: x = 2
errore: Uguagliare gli argomenti senza controllare le condizioni di esistenza.
confondi:
- scheda: eq-log-forma-esp
  differenza: Se un solo lato ha un logaritmo, si passa alla forma esponenziale.
perche: 'Il logaritmo è iniettivo: due numeri con lo stesso logaritmo sono uguali.'
parole: equazione logaritmica uguaglianza argomenti
