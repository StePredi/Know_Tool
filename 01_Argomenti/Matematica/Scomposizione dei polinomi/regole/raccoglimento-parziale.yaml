id: raccoglimento-parziale
nome: Raccoglimento parziale
riconosci: Quattro termini senza un fattore comune a tutti (`x^3+x^2-4x-4`).
fai: Raggruppa i termini a due a due e raccogli in ogni coppia. Se in tutte e due resta la stessa parentesi, raccoglila.
formula: ax+ay+bx+by = (a+b)(x+y)
esempi:
  - da: x^3+x^2-4x-4
    passi:
      - "Gruppi: `(x^3+x^2)` e `(-4x-4)`"
      - "Raccolgo: `x^2(x+1)-4(x+1)`"
      - "Raccolgo `(x+1)`: `(x+1)(x^2-4)`"
      - "`x^2-4` è una differenza di quadrati"
    risultato: (x+1)(x-2)(x+2)
errore: "Il segno meno: `-4x-4 = -4(x+1)`, non `4(x+1)`. Se le due parentesi vengono diverse, prova un altro raggruppamento."
confondi:
  - con: raccoglimento-totale
    differenza: Il parziale si fa a coppie quando non c'è un fattore comune a tutti i termini.
controllo: raccoglimento-parziale
