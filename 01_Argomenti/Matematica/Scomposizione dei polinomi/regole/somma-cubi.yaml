id: somma-cubi
nome: Somma o differenza di cubi
riconosci: Due termini che sono cubi perfetti (`x^3-8`, `27x^3+1`), con il più o il meno in mezzo.
fai: "Fai la radice cubica di ciascun termine. Il primo fattore è la somma (o differenza) delle radici; il secondo ha il quadrato della prima, il prodotto e il quadrato della seconda. Per la somma i segni cambiano: `A^3+B^3 = (A+B)(A^2-AB+B^2)`."
formula: A^3-B^3 = (A-B)(A^2+AB+B^2)
esempi:
  - da: x^3-8
    passi:
      - "`x^3` è `x` al cubo e `8` è `2^3`"
      - "Primo fattore: `x-2`"
      - "Secondo fattore: `x^2+2x+4`"
    risultato: (x-2)(x^2+2x+4)
errore: "Scrivere `(x-2)^3`: il cubo di un binomio ha quattro termini. Il secondo fattore non si scompone più (`Delta < 0`)."
confondi:
  - con: differenza-quadrati
    differenza: I cubi hanno esponente 3 (o multiplo di 3), i quadrati esponente 2.
controllo: somma-cubi
