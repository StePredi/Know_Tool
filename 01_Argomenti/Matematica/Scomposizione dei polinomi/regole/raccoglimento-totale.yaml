id: raccoglimento-totale
nome: Raccoglimento totale
riconosci: Tutti i termini hanno un fattore in comune (un numero, una `x`, o tutti e due). Guarda sempre questo per primo.
fai: Trova il massimo comune divisore dei coefficienti e la potenza più bassa di `x`. Mettili fuori da una parentesi e dividi ogni termine per il fattore comune.
formula: ab+ac = a(b+c)
esempi:
  - da: 6x^3-12x^2+6x
    passi:
      - "Comune a tutti: `6x`"
      - "Divido ogni termine: `x^2-2x+1`"
      - Resta `6x(x^2-2x+1)`, e `x^2-2x+1` si scompone ancora
    risultato: 6x(x-1)^2
errore: "Dimenticare un termine, o scrivere `0` al posto di `1`: se un termine è uguale al fattore comune, nella parentesi resta `1`. Controlla moltiplicando di nuovo."
confondi:
  - con: raccoglimento-parziale
    differenza: Il totale vale per tutti i termini insieme; il parziale si fa a gruppi di due, quando non c'è un fattore comune a tutti.
controllo: raccoglimento-totale
capisci:
  - "Raccogliere vuol dire trovare quello che si ripete in ogni pezzo e portarlo fuori dalla parentesi: `ab+ac = a(b+c)`."
  - "Funziona perché è la proprietà distributiva letta al contrario: se moltiplichi `a(b+c)` ottieni `ab+ac`. Qui fai il percorso inverso."
  - "Cosa si porta fuori: il numero più grande che divide tutti i coefficienti (il MCD) e ogni lettera presente in tutti i pezzi, con l’esponente più piccolo. Dentro la parentesi scrivi cosa resta di ogni pezzo."
  - "Si prova sempre per primo: spesso fa il lavoro più grosso e rende più facili le regole dopo."
riconosciEsempi:
  - da: 6x^3-12x^2+6x
    domande:
      - titolo: Ogni pezzo scritto a fattori
        risposta: na
        figura:
          tipo: fattori
          termini: &a1
            - t: 6x^3
              fattori:
                - "2"
                - "3"
                - x
                - x
                - x
            - t: 12x^2
              fattori:
                - "2"
                - "2"
                - "3"
                - x
                - x
            - t: 6x
              fattori:
                - "2"
                - "3"
                - x
          comune: []
        nota: Numeri scomposti in primi, lettere una per una.
      - titolo: Cosa compare in tutti i pezzi?
        risposta: si
        figura:
          tipo: fattori
          termini: *a1
          comune:
            - "2"
            - "3"
            - x
        nota: "In comune: 2, 3 e una x. Cioè `6x`."
    esito:
      ok: true
      testo: "Si raccoglie `6x`: `6x(x^2-2x+1)`. Passa a «Fai e prova»."
  - da: 4x^2+6x
    domande:
      - titolo: Ogni pezzo scritto a fattori
        risposta: na
        figura:
          tipo: fattori
          termini: &a2
            - t: 4x^2
              fattori:
                - "2"
                - "2"
                - x
                - x
            - t: 6x
              fattori:
                - "2"
                - "3"
                - x
          comune: []
        nota: Numeri scomposti in primi, lettere una per una.
      - titolo: Cosa compare in tutti i pezzi?
        risposta: si
        figura:
          tipo: fattori
          termini: *a2
          comune:
            - "2"
            - x
        nota: "In comune: un 2 e una x. Cioè `2x`."
    esito:
      ok: true
      testo: "Si raccoglie `2x`: `2x(2x+3)`."
  - da: x^2-9
    domande:
      - titolo: Ogni pezzo scritto a fattori
        risposta: na
        figura:
          tipo: fattori
          termini: &a3
            - t: x^2
              fattori:
                - x
                - x
            - t: "9"
              fattori:
                - "3"
                - "3"
          comune: []
        nota: Numeri scomposti in primi, lettere una per una.
      - titolo: Cosa compare in tutti i pezzi?
        risposta: no
        figura:
          tipo: fattori
          termini: *a3
          comune: []
        nota: Niente compare in entrambi.
    esito:
      ok: false
      testo: "Nessun fattore comune: guarda la differenza di quadrati (regola 2)."
  - da: x^3+x^2-4x-4
    domande:
      - titolo: Ogni pezzo scritto a fattori
        risposta: na
        figura:
          tipo: fattori
          termini: &a4
            - t: x^3
              fattori:
                - x
                - x
                - x
            - t: x^2
              fattori:
                - x
                - x
            - t: 4x
              fattori:
                - "2"
                - "2"
                - x
            - t: "4"
              fattori:
                - "2"
                - "2"
          comune: []
        nota: Numeri scomposti in primi, lettere una per una.
      - titolo: Cosa compare in tutti i pezzi?
        risposta: no
        figura:
          tipo: fattori
          termini: *a4
          comune: []
        nota: La x non c’è nell’ultimo pezzo, il 2 non c’è nei primi due.
    esito:
      ok: false
      testo: "Nessun fattore comune a tutti e quattro: prova il raccoglimento parziale (regola 5)."
esercizi:
  - da: 6x^3-12x^2+6x
    passi:
      - domanda: Qual è il fattore comune?
        opzioni:
          - testo: "`6x`"
            giusta: true
            perche: Il MCD di 6, 12, 6 è 6; la x più piccola è `x^1`.
          - testo: "`6x^3`"
            giusta: false
            perche: "`x^3` non c’è nell’ultimo pezzo: si prende l’esponente più piccolo."
          - testo: "`3x`"
            giusta: false
            perche: "Si può raccogliere di più: anche 2 divide tutti i coefficienti."
        dopo: "Fattore comune: `6x`"
      - domanda: Cosa resta dentro la parentesi? Dividi ogni pezzo per `6x`.
        opzioni:
          - testo: "`x^2-2x+1`"
            giusta: true
            perche: "`6x^3:6x = x^2`, `12x^2:6x = 2x`, `6x:6x = 1`."
          - testo: "`x^2-2x`"
            giusta: false
            perche: L’ultimo pezzo `6x:6x` fa 1, non sparisce.
          - testo: "`x^3-2x^2+x`"
            giusta: false
            perche: "Hai tolto solo il 6: devi dividere anche per la x."
        dopo: "`= 6x(x^2-2x+1)`"
      - domanda: Qualche fattore si scompone ancora?
        opzioni:
          - testo: "Sì: `x^2-2x+1 = (x-1)^2`"
            giusta: true
            perche: È il quadrato di un binomio (regola del trinomio).
          - testo: No, ho finito
            giusta: false
            perche: "Guarda la parentesi: ha tre termini e `x^2-2x+1` si scompone."
          - testo: "Sì: `x^2-2x+1 = (x+1)^2`"
            giusta: false
            perche: "`(x+1)^2` dà `x^2+2x+1`: il segno in mezzo è diverso."
        dopo: "`= 6x(x-1)^2`"
  - da: 4x^2+6x
    passi:
      - domanda: Qual è il fattore comune?
        opzioni:
          - testo: "`2x`"
            giusta: true
            perche: MCD di 4 e 6 è 2; la x è in tutti e due.
          - testo: "`4x`"
            giusta: false
            perche: 4 non divide 6.
          - testo: "`x`"
            giusta: false
            perche: "Si può raccogliere di più: anche il 2 divide tutto."
        dopo: "Fattore comune: `2x`"
      - domanda: Cosa resta dentro la parentesi?
        opzioni:
          - testo: "`2x+3`"
            giusta: true
            perche: "`4x^2:2x = 2x` e `6x:2x = 3`."
          - testo: "`2x+6`"
            giusta: false
            perche: "Anche 6 va diviso per `2x`: resta 3."
          - testo: "`4x+6`"
            giusta: false
            perche: "Non hai diviso: nella parentesi deve restare quello che avanza."
        dopo: "`= 2x(2x+3)`"
