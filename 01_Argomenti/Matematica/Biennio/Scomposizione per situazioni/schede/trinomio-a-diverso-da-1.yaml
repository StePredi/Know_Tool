id: trinomio-a-diverso-da-1
tipo: regola
titolo: Trinomio ax² + bx + c
sigla: Trinomio con a diverso da 1
comando: "bx = mx + nx"
frase: "Trinomio di secondo grado con un numero diverso da 1 davanti a x²."
vedo: "Trinomio di secondo grado con un coefficiente diverso da 1 davanti a x^2: `2x^2 + 7x + 3`, `6x^2 - x - 2`."
formula:
  - a*x^2 + b*x + c
  - m + n = b
  - m*n = a*c
adatto:
  - "Calcola `a*c` e cerca due numeri m e n con prodotto `a*c` e somma b."
  - "Spezza il termine centrale: `bx = mx + nx`."
  - "Ora hai 4 termini: usa il raccoglimento parziale."
  - "Alternativa: Ruffini, oppure le radici con la formula risolutiva."
esempi:
  - da: 2x^2 + 7x + 3
    passi:
      - "`a*c = 6`, somma 7: i numeri sono 1 e 6"
      - "Spezzo: `2x^2 + x + 6x + 3`"
      - "Raggruppo: `x(2x + 1) + 3(2x + 1)`"
    ris: (2x + 1)(x + 3)
    verifica: scomposizione
  - da: 6x^2 - x - 2
    passi:
      - "`a*c = -12`, somma -1: i numeri sono -4 e 3"
      - "Spezzo: `6x^2 - 4x + 3x - 2`"
      - "Raggruppo: `2x(3x - 2) + (3x - 2)`"
    ris: (3x - 2)(2x + 1)
    verifica: scomposizione
errore: "Cercare i numeri sul solo termine noto, dimenticando di moltiplicare per a."
confondi:
  - scheda: trinomio-notevole
    differenza: "Con 1 davanti a x^2 basta cercare due numeri con prodotto c e somma b."
  - scheda: raccoglimento-parziale
    differenza: "È l'ultimo passo di questo metodo, dopo aver spezzato il termine centrale."
perche: "Spezzare il termine centrale trasforma il trinomio in un polinomio a 4 termini con fattore comune a gruppi."
parole: trinomio coefficiente a spezzare termine centrale
