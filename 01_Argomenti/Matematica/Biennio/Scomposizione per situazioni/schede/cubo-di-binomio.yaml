id: cubo-di-binomio
tipo: regola
titolo: Cubo di binomio (letto al contrario)
sigla: Cubo di binomio
comando: "(a + b)^3"
frase: "Quattro termini: due cubi e due termini misti."
vedo: "Quattro termini con due cubi (primo e ultimo) e due termini misti: `x^3 + 6x^2 + 12x + 8`."
formula:
  - a^3 + 3*a^2*b + 3*a*b^2 + b^3 = (a + b)^3
  - a^3 - 3*a^2*b + 3*a*b^2 - b^3 = (a - b)^3
adatto:
  - "Cerca i due cubi (primo e ultimo termine) e le loro radici a e b."
  - "Controlla che i termini in mezzo siano `3a^2b` e `3ab^2`."
  - "Con segni alternati (+ − + −) è `(a - b)^3`."
  - "Se i termini centrali non tornano, non è un cubo: prova il raccoglimento parziale."
esempi:
  - da: x^3 + 6x^2 + 12x + 8
    passi:
      - "Cubi: `x^3` e `8`, radici `x` e `2`"
      - "`3*x^2*2 = 6x^2` e `3*x*4 = 12x`: tornano"
    ris: (x + 2)^3
    verifica: scomposizione
  - da: 8x^3 - 12x^2 + 6x - 1
    passi:
      - "Cubi: `8x^3` e `1`, radici `2x` e `1`"
      - "`3*4x^2*1 = 12x^2` e `3*2x*1 = 6x`, segni alternati"
    ris: (2x - 1)^3
    verifica: scomposizione
errore: "Usarla senza controllare i termini centrali: `x^3 + 3x^2 + 3x + 2` non è un cubo."
confondi:
  - scheda: raccoglimento-parziale
    differenza: "Se i termini centrali non sono i tripli prodotti, la strada è il raccoglimento parziale."
  - scheda: somma-differenza-cubi
    differenza: "Somma e differenza di cubi hanno solo 2 termini."
perche: "È il cubo di binomio sviluppato, letto da destra a sinistra."
parole: cubo binomio quattro termini scomposizione
