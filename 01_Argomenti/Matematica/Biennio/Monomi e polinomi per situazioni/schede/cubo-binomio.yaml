id: cubo-binomio
tipo: regola
titolo: Cubo di un binomio
sigla: Cubo di binomio
comando: coefficienti 1, 3, 3, 1
vedo: "Un binomio elevato al cubo: `(x+2)^3`, `(2x-1)^3`."
formula:
  - (a + b)^3 = a^3 + 3*a^2*b + 3*a*b^2 + b^3
  - (a - b)^3 = a^3 - 3*a^2*b + 3*a*b^2 - b^3
adatto:
  - "Quattro termini: cubo del primo, triplo del quadrato del primo per il secondo, triplo del primo per il quadrato del secondo, cubo del secondo."
  - "Gli esponenti di a scendono (3, 2, 1, 0), quelli di b salgono (0, 1, 2, 3). Coefficienti 1, 3, 3, 1."
  - "Con il meno nella parentesi i segni si alternano: + − + −."
  - "Se non ricordi la formula: `(a+b)^3 = (a+b)^2 * (a+b)`."
esempi:
  - da: (x + 2)^3
    passi:
      - "`a^3 = x^3`"
      - "`3a^2b = 3*x^2*2 = 6x^2`"
      - "`3ab^2 = 3*x*4 = 12x`"
      - "`b^3 = 8`"
    ris: x^3 + 6x^2 + 12x + 8
    verifica: scomposizione
  - da: (2x - 1)^3
    passi:
      - "`a = 2x`, `b = 1`, segni alternati"
      - "`8x^3 - 3*4x^2*1 + 3*2x*1 - 1`"
    ris: 8x^3 - 12x^2 + 6x - 1
    verifica: scomposizione
errore: "Scrivere `a^3 + b^3` e saltare i due termini misti, oppure non alternare i segni quando c'è il meno."
confondi:
  - scheda: quadrato-binomio
    differenza: "Il quadrato ha coefficienti 1, 2, 1 (3 termini); il cubo ha 1, 3, 3, 1 (4 termini)."
perche: "È `(a+b)^2 * (a+b)`: sviluppando, i termini misti compaiono tre volte."
parole: cubo binomio notevole tartaglia
