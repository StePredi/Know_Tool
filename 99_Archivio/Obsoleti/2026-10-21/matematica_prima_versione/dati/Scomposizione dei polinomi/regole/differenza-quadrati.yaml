id: differenza-quadrati
nome: Differenza di quadrati
riconosci: Due termini, tutti e due quadrati perfetti, con il segno meno in mezzo (`x^2-9`, `4x^2-25`, `x^4-16`).
fai: Fai la radice di ciascun termine e scrivi somma per differenza.
formula: A^2-B^2 = (A-B)(A+B)
esempi:
  - da: x^4-16
    passi:
      - "`x^4` è `(x^2)^2` e `16` è `4^2`"
      - "Somma per differenza: `(x^2-4)(x^2+4)`"
      - "`x^2-4` è ancora una differenza di quadrati"
    risultato: (x-2)(x+2)(x^2+4)
errore: "La somma di quadrati (`x^2+9`) non si scompone. Non scrivere `(x+3)^2` per `x^2+9`: ti viene `x^2+6x+9`."
confondi:
  - con: trinomio
    differenza: La differenza di quadrati ha due termini e niente in mezzo; il quadrato di un binomio ha tre termini (`A^2+2AB+B^2`).
controllo: differenza-quadrati
riconosciEsempi:
  - da: x^2-9
    domande:
      - titolo: Quanti pezzi?
        risposta: si
        figura:
          tipo: pezzi
          termini:
            - x^2
            - "9"
          segni:
            - "-"
        nota: Servono esattamente due pezzi.
      - titolo: Sono quadrati?
        risposta: si
        figura:
          tipo: quadrati
          termini:
            - t: x^2
              lato: x
            - t: "9"
              n: 9
        nota: ""
      - titolo: Che segno c’è in mezzo?
        risposta: si
        figura:
          tipo: segno
          segno: "-"
        nota: "Il meno toglie un angolo: resta una L che si ricompone."
    esito:
      ok: true
      testo: "Differenza di quadrati: `x^2-3^2`. Passa a «Fai e prova»."
  - da: x^2+9
    domande:
      - titolo: Quanti pezzi?
        risposta: si
        figura:
          tipo: pezzi
          termini:
            - x^2
            - "9"
          segni:
            - +
        nota: Servono esattamente due pezzi.
      - titolo: Sono quadrati?
        risposta: si
        figura:
          tipo: quadrati
          termini:
            - t: x^2
              lato: x
            - t: "9"
              n: 9
        nota: ""
      - titolo: Che segno c’è in mezzo?
        risposta: no
        figura:
          tipo: segno
          segno: +
        nota: "Con il più i quadrati restano attaccati: non c’è nessuna L da ricomporre."
    esito:
      ok: false
      testo: "È una somma di quadrati: non si scompone (e non è `(x+3)^2`)."
  - da: 4x^2-25
    domande:
      - titolo: Quanti pezzi?
        risposta: si
        figura:
          tipo: pezzi
          termini:
            - 4x^2
            - "25"
          segni:
            - "-"
        nota: Servono esattamente due pezzi.
      - titolo: Sono quadrati?
        risposta: si
        figura:
          tipo: quadrati
          termini:
            - t: 4x^2
              lato: 2x
            - t: "25"
              n: 25
        nota: ""
      - titolo: Che segno c’è in mezzo?
        risposta: si
        figura:
          tipo: segno
          segno: "-"
        nota: "Meno in mezzo: va bene."
    esito:
      ok: true
      testo: "Differenza di quadrati: `(2x)^2-5^2`. Passa a «Fai e prova»."
  - da: x^2-8
    domande:
      - titolo: Quanti pezzi?
        risposta: si
        figura:
          tipo: pezzi
          termini:
            - x^2
            - "8"
          segni:
            - "-"
        nota: Servono esattamente due pezzi.
      - titolo: Sono quadrati?
        risposta: no
        figura:
          tipo: quadrati
          termini:
            - t: x^2
              lato: x
            - t: "8"
              n: 8
        nota: ""
      - titolo: Che segno c’è in mezzo?
        risposta: si
        figura:
          tipo: segno
          segno: "-"
        nota: Il segno è giusto, ma 8 non è un quadrato.
    esito:
      ok: false
      testo: "8 non è un quadrato perfetto (manca un quadratino): non è una differenza di quadrati."
  - da: x^3-9
    domande:
      - titolo: Quanti pezzi?
        risposta: si
        figura:
          tipo: pezzi
          termini:
            - x^3
            - "9"
          segni:
            - "-"
        nota: Servono esattamente due pezzi.
      - titolo: Sono quadrati?
        risposta: no
        figura:
          tipo: quadrati
          termini:
            - t: x^3
            - t: "9"
              n: 9
        nota: ""
      - titolo: Che segno c’è in mezzo?
        risposta: si
        figura:
          tipo: segno
          segno: "-"
        nota: Il segno è giusto, ma `x^3` non è un quadrato.
    esito:
      ok: false
      testo: "`x^3` non è un quadrato: prova altre regole (il raccoglimento `x^3-9x`, o Ruffini)."
  - da: x^2-6x+9
    domande:
      - titolo: Quanti pezzi?
        risposta: no
        figura:
          tipo: pezzi
          termini:
            - x^2
            - 6x
            - "9"
          segni:
            - "-"
            - +
        nota: "Servono due pezzi: qui sono tre."
      - titolo: Sono quadrati?
        risposta: no
        figura:
          tipo: quadrati
          termini:
            - t: x^2
              lato: x
            - t: 6x
            - t: "9"
              n: 9
        nota: ""
      - titolo: Che segno c’è in mezzo?
        risposta: na
        figura:
          tipo: nessuna
          testo: "non serve: i pezzi non sono due"
        nota: ""
    esito:
      ok: false
      testo: "Tre pezzi: guarda il trinomio (è il quadrato di un binomio `(x-3)^2`)."
capisci:
  - "Scomporre vuol dire riscrivere una somma come un prodotto: `x^2-9` diventa `(x-3)(x+3)`. Il valore non cambia, cambia la forma. E la forma nuova serve per risolvere equazioni e disequazioni."
  - "Un quadrato perfetto è qualcosa moltiplicato per se stesso: `9 = 3^2`, `x^2`, `25x^2 = (5x)^2`, `x^4 = (x^2)^2`. Non lo sono 8, `x^3` o 10: non esiste un numero o un termine che moltiplicato per sé li dia."
  - "Perché funziona: parti da un quadrato di lato `a` e togli in un angolo un quadratino di lato `b`. Resta `a^2-b^2`. Se sposti il pezzo viola, la L diventa un rettangolo con lati `a-b` e `a+b`: la sua area è `(a-b)(a+b)`."
  - Vale per qualsiasi a e b. Per usarla ti basta trovare le due radici (il lato di ciascun quadrato) e scrivere somma per differenza.
animazione: ricomposizione
esercizi:
  - da: x^4-16
    passi:
      - domanda: "Scrivi ogni termine come quadrato: chi sono A e B?"
        opzioni:
          - testo: A = `x^2`, B = 4
            giusta: true
            perche: "`x^4 = (x^2)^2` e `16 = 4^2`."
          - testo: A = `x^4`, B = 16
            giusta: false
            perche: Quelli sono i termini, non le loro radici.
          - testo: A = `x^2`, B = 8
            giusta: false
            perche: "`8^2` fa 64, non 16."
        dopo: "`x^4-16 = (x^2)^2-4^2`"
      - domanda: "Scrivi somma per differenza:"
        opzioni:
          - testo: "`(x^2-4)(x^2+4)`"
            giusta: true
            perche: "`(A-B)(A+B)` con A = `x^2` e B = 4."
          - testo: "`(x^2-4)^2`"
            giusta: false
            perche: Il quadrato di un binomio ha un termine in mezzo.
          - testo: "`(x^2+4)(x^2+4)`"
            giusta: false
            perche: Serve un meno e un più.
        dopo: "`= (x^2-4)(x^2+4)`"
      - domanda: Qualche fattore si scompone ancora?
        opzioni:
          - testo: "Sì: `x^2-4`"
            giusta: true
            perche: È ancora due quadrati con il meno in mezzo.
          - testo: No, ho finito
            giusta: false
            perche: "`x^2-4` si scompone ancora: guarda i pezzi."
          - testo: "Sì: `x^2+4`"
            giusta: false
            perche: "Ha il più: somma di quadrati, non si scompone."
        dopo: "`= (x-2)(x+2)(x^2+4)`"
  - da: 9x^2-25
    passi:
      - domanda: Chi sono A e B?
        opzioni:
          - testo: A = `3x`, B = 5
            giusta: true
            perche: "`(3x)^2 = 9x^2` e `5^2 = 25`."
          - testo: A = `9x`, B = 25
            giusta: false
            perche: "Sono i termini: A e B sono le radici."
          - testo: A = `3x`, B = 25
            giusta: false
            perche: "25 non è la radice: B = 5."
        dopo: "`9x^2-25 = (3x)^2-5^2`"
      - domanda: "Scrivi somma per differenza:"
        opzioni:
          - testo: "`(3x-5)(3x+5)`"
            giusta: true
            perche: "`(A-B)(A+B)`."
          - testo: "`(3x-5)^2`"
            giusta: false
            perche: Darebbe `9x^2-30x+25`.
          - testo: "`(9x-25)(x+1)`"
            giusta: false
            perche: Non hai fatto le radici.
        dopo: "`= (3x-5)(3x+5)`"
  - da: 1-49x^2
    passi:
      - domanda: Chi sono A e B?
        opzioni:
          - testo: A = 1, B = `7x`
            giusta: true
            perche: "`1 = 1^2` e `49x^2 = (7x)^2`: l’ordine non conta, conta il meno in mezzo."
          - testo: A = 1, B = 49
            giusta: false
            perche: "49 è il numero davanti: la radice è 7, e la x resta."
          - testo: Non è una differenza di quadrati
            giusta: false
            perche: "Lo è: due quadrati con il meno in mezzo. Parti dal termine con il segno più."
        dopo: "`1-49x^2 = 1^2-(7x)^2`"
      - domanda: "Scrivi somma per differenza:"
        opzioni:
          - testo: "`(1-7x)(1+7x)`"
            giusta: true
            perche: "`(A-B)(A+B)` con A = 1 e B = `7x`."
          - testo: "`(1-7x)^2`"
            giusta: false
            perche: Darebbe `1-14x+49x^2`.
          - testo: "`(7x-1)(7x+1)`"
            giusta: false
            perche: "Quello è `49x^2-1`: il segno è opposto."
        dopo: "`= (1-7x)(1+7x)`"
