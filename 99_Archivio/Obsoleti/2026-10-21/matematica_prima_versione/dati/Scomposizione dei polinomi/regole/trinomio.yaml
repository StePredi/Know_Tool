id: trinomio
nome: Trinomio di 2º grado
riconosci: Tre termini della forma `ax^2+bx+c`. Se `Delta = 0` è il quadrato di un binomio (`A^2+2AB+B^2`).
fai: "Cerca due numeri che sommati danno `b` e moltiplicati danno `a·c` (se `a=1`: somma `b`, prodotto `c`). Se non li trovi, calcola `Delta = b^2-4ac`: se è un quadrato perfetto le radici sono razionali, altrimenti il trinomio non si scompone."
formula: x^2+bx+c = (x-x_1)(x-x_2)
esempi:
  - da: x^2-5x+6
    passi:
      - "Cerco due numeri: somma `-5`, prodotto `6`"
      - Sono `-2` e `-3`
    risultato: (x-2)(x-3)
  - da: 2x^2+5x+3
    passi:
      - "`Delta = 25-24 = 1`"
      - "Radici: `(-5+-1)/(4)`, cioè `-1` e `-3/2`"
      - "Con il coefficiente iniziale: `2(x+1)(x+3/2)`, cioè `(x+1)(2x+3)`"
    risultato: (x+1)(2x+3)
errore: "Sbagliare i segni: i fattori sono `(x-x_1)`, con il segno opposto alle radici. Controlla sempre moltiplicando."
confondi:
  - con: ruffini
    differenza: Il trinomio è di 2º grado e si risolve con somma e prodotto o con `Delta`; Ruffini serve dal 3º grado in su.
controllo: trinomio
