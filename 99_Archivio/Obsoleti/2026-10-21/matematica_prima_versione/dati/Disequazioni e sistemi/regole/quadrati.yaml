id: quadrati
nome: Fattori al quadrato e senza radici
riconosci: Un fattore è un quadrato `(x-a)^2` oppure un trinomio con `Delta < 0` (`x^2+1`).
fai: "Non cambia segno: `(x-a)^2` non è mai negativo (zero in `a`); `x^2+1` è sempre positivo. Mettilo sulla linea come riga tutta continua (o tutta tratteggiata se il coefficiente è negativo). Con `<=` o `>=` il punto `a` può essere soluzione."
formula: (x-a)^2 >= 0
esempi:
  - da: (x-2)^2 <= 0
    passi:
      - Un quadrato non è mai negativo
      - Vale zero solo in `x = 2`
    risultato: x = 2
errore: "Dire «nessuna soluzione» per `(x-2)^2 <= 0`: il punto `x = 2` annulla il quadrato, quindi è soluzione."
confondi:
  - con: segno-fattore
    differenza: Un fattore di 1º grado cambia segno nella radice; un quadrato no.
