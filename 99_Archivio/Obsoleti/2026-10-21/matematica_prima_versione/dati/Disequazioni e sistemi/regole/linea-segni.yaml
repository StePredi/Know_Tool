id: linea-segni
nome: Linea dei segni
riconosci: Hai più fattori da combinare.
fai: "Metti sulla linea tutti i punti dove un fattore si annulla, in ordine. Una riga per fattore: linea continua dove è positivo, tratteggiata dove è negativo. Poi moltiplica i segni colonna per colonna: un numero pari di tratteggiate dà positivo, dispari dà negativo."
formula: (+)(+)=+   (+)(-)=-   (-)(-)=+
esempi:
  - da: (x-1)(x+3) > 0
    passi:
      - "Punti: `-3` e `1`"
      - "`(x+3)`: tratteggiata prima di `-3`, continua dopo"
      - "`(x-1)`: tratteggiata prima di `1`, continua dopo"
      - "Risultato: `+` a sinistra di `-3`, `-` in mezzo, `+` a destra di `1`"
    risultato: x < -3  oppure  x > 1
errore: "Contare male le righe tratteggiate: pari dà positivo, dispari dà negativo."
confondi:
  - con: scegli-intervalli
    differenza: La linea dei segni costruisce il risultato; scegliere gli intervalli è l'ultimo passo.
